  if (!cut2.hit) return null;                       // 2적구를 못 맞힌다
  const c2 = cut2.pts.length - 2;                   // 충돌 후 2적구 전까지 쿠션 수
  if (c2 > budget) return null;                     // 표가 허락한 것보다 멀리 갔다
  if (c1 + c2 < 3) return null;                     // ★ 3쿠션 미달 — 득점이 아니다
  const rails = seq.slice(0, c1).map(h => h.rail)
           .concat(seq2.slice(0, c2).map(h => h.rail));
  // ⚠️ 같은 쿠션이 연달아 나오면 쿠션을 **스치며 미끄러진** 것이지 경로가 아니다.
  //    (파이썬 검증에서 'bottom-bottom-left' 같은 것이 잔뜩 잡혔다.)
  for (let i = 1; i < rails.length; i++) if (rails[i] === rails[i-1]) return null;
  // ★ 사용자 지시 2026-08-11: '역각으로 돌아오는 경로는 추천하지 않습니다.'
  //   순각 = 공이 한 방향으로 계속 돈다. 역각 = 도는 방향이 도중에 뒤집힌다.
  //   쿠션마다 꺾이는 회전 방향(외적 부호)을 재서, 한 번이라도 뒤집히면 뺀다.
  //
  // ★★ 결론: **켜지 않는다.** 사용자 확인 2026-08-11 —
  //   '역각의 이론은 매우 어렵습니다. **쓰리쿠션에서는 발생하지 않습니다.**'
  //   지금 추천 범위(1적구를 직접 치고 3쿠션 돌아 2적구)에서는 역각이 안 나온다.
  //   코드는 남겨 두되 DROP_REVERSE 는 false 로 둔다.
  //   (켜 봤더니 사용자가 OK 한 경로와 같은 두께대(30%)가 사라졌다 — 정의도 틀렸다.)
  // ⚠️ 이 조건은 bend() 문제와도 맞물린다. bend() 는 모든 쿠션에 **순회전** 실측표를
  //    쓰므로, 도는 방향이 뒤집힌 뒤 구간은 애초에 그림 자체가 못 믿을 값이다.
  let turn = 0;
  for (let i = 0; i < seq2.length && i < c2; i++){
    const a = i === 0 ? af.dir : dirOf(seq2[i-1].p, seq2[i].p);
    const b = dirOf(seq2[i].p, i+1 < seq2.length ? seq2[i+1].p : cut2.pts[cut2.pts.length-1]);
    const cr = a[0]*b[1] - a[1]*b[0];
    if (Math.abs(cr) < 1e-6) continue;
    const sg = cr > 0 ? 1 : -1;
    if (DROP_REVERSE && turn && sg !== turn) return null;   // 도는 방향이 뒤집혔다 = 역각
    turn = sg;
  }
  // 먼저 맞는 공이 어느 것인지까지 넣어야 '빨강 먼저' 와 '노랑 먼저' 가 갈린다
  let who = '?';
  for (const kk in S.balls){
    const q = S.balls[kk].p;
    if (kk !== 'cue' && Math.hypot(q[0]-cut1.obj[0], q[1]-cut1.obj[1]) < 1){ who = kk; break; }
  }
  return {key: who + '|' + rails.join('-'), rails, first: who, cushions: c1 + c2};
}

let ROUTES = {key:null, list:[]};
// 지금 배치에 대해 **이미 훑어 둔** 결과가 있으면 그것. 없으면 null.
// ⚠️ 그리기에서 findRoutes() 를 부르면 안 된다 — 공을 끄는 동안 매 프레임 한 바퀴씩
//    훑게 된다. 훑기는 버튼을 누를 때만 돈다.
function routesReady(){
  const k = routeKey();
  return (k && ROUTES.key === k) ? ROUTES.list : null;
}
function routeKey(){
  const cue = S.balls.cue;
  if (!cue) return null;
  return S.corr + '|' + S.tipDir + '|' + S.tipR + '|' +
         Object.keys(S.balls).sort().map(k => k + S.balls[k].p).join(';');
}
function findRoutes(){
  const key = routeKey();
  if (!key) return [];
  if (ROUTES.key === key) return ROUTES.list;
  S.routeIx = -1;                                   // 배치가 바뀌었으면 처음부터
  const cue = S.balls.cue;
  let objs = 0;
  for (const k in S.balls) if (k !== 'cue') objs++;
  if (objs < 2){ ROUTES = {key, list:[]}; return []; }   // 2적구가 없으면 득점 자체가 없다
  // 보정을 한 번만 푼다 (위 ⚠️ 참고)
  let k0 = 0;
  if (S.corr && S.aim){
    try { pathFromAim(cue.p, S.aim, S.corr); k0 = LAST_K; } catch(e){ k0 = 0; }
  }
  const step = SWEEP_STEP_DEG * Math.PI/180, n = Math.round(2*Math.PI/step);
  const at = a => simulate([Math.cos(a), Math.sin(a)], k0);
  const runs = [];
  let cur = null;
  for (let i = 0; i <= n; i++){                     // 한 바퀴 + 한 칸 (이음매를 잇는다)
    const r = at(i*step);
    if (cur && (!r || r.key !== cur.key)){ runs.push(cur); cur = null; }
    if (r){
      if (cur) cur.iHi = i;
      else cur = {key:r.key, iLo:i, iHi:i, rails:r.rails, first:r.first, cushions:r.cushions};
    }
  }
  if (cur) runs.push(cur);
  // 가장자리를 이분법으로 다듬는다. 굵게 훑은 폭은 걸음 단위로 뭉뚱그려져 있어서
  // 그대로 쓰면 허용오차가 0.2 · 0.4 · 0.6 처럼 계단으로만 나온다 (파이썬에서 확인).
  const edge = (aIn, aOut, key) => {
    let lo = aIn, hi = aOut;
    for (let i = 0; i < EDGE_ITER; i++){
      const m = (lo+hi)/2, r = at(m);
      if (r && r.key === key) lo = m; else hi = m;
    }
    return lo;
  };
  for (const r of runs){
    r.lo = edge(r.iLo*step, (r.iLo-1)*step, r.key);
    r.hi = edge(r.iHi*step, (r.iHi+1)*step, r.key);
  }
  // 0도 이음매에서 잘린 덩어리를 도로 붙인다
  if (runs.length > 1){
    const A = runs[0], B = runs[runs.length-1];
    if (A.key === B.key && A.lo <= step*1.5 && B.hi >= 2*Math.PI - step*1.5){
      B.hi = A.hi + 2*Math.PI; runs.shift();
    }
  }
  // 같은 길이 여러 군데 나오면 **제일 넓은 것** 하나만 남긴다 (미리보기가 똑같아 보인다)
  const best = {};
  for (const r of runs){
    const w = r.hi - r.lo;
    if (w < ROUTE_MIN_DEG * Math.PI/180) continue;
    if (!best[r.key] || w > best[r.key].hi - best[r.key].lo) best[r.key] = r;
  }
  const list = Object.values(best).map(r => ({
    a: (r.lo + r.hi)/2,
    w: (r.hi - r.lo) * 180/Math.PI,
    rails: r.rails, first: r.first, cushions: r.cushions, key: r.key,
  })).sort((x, y) => y.w - x.w);                    // 넓은 것부터 = 쉬운 것부터
  ROUTES = {key, list};
  return list;
}
// 추천 버튼 — 한 번 누를 때마다 다음 경로로. 끝나면 직접조준으로 돌아온다.
function nextRoute(){
  const list = findRoutes();
  const cue = S.balls.cue;
  if (!list.length || !cue){ S.routeIx = -1; return; }
  S.routeIx = S.routeIx + 1 >= Math.min(list.length, ROUTE_SHOW) ? -1 : S.routeIx + 1;
  if (S.routeIx < 0) return;                        // 직접조준 — 조준선은 그대로 둔다
  const r = list[S.routeIx];
  const len = S.aim ? Math.hypot(S.aim[0]-cue.p[0], S.aim[1]-cue.p[1]) : 2000;
  S.aim = S.lastAim = [cue.p[0] + Math.cos(r.a)*len, cue.p[1] + Math.sin(r.a)*len];
}

// ─────────────────────────────── 자석 (사용자 지시 2026-08-11)
// '경로를 설정하고 손을 놓으면 지맘대로 경로가 변해버려요. 또 자석 같은 기능이
//  없나요 — 경로가 맞으면 붙여주는 기능.'
//
// ⚠️ 처음엔 ±8도를 훑어 '목표 공에 제일 가까운 각' 으로 옮겼다. 두 가지가 틀렸다 —
//    ① 8도는 너무 넓다. 손댄 곳에서 멀리 끌려가니 '지맘대로' 로 느껴진다.
//    ② 붙이는 대상이 **득점하는 길인지를 안 봤다.** 공에 가깝기만 하면 붙였다.
// 지금은 findRoutes() 가 찾아 둔 **득점 경로에만** 붙는다. 그 안에 없으면
// 손댄 각을 그대로 둔다. 붙으면 추천 버튼에 몇 번째 경로인지 뜬다.
const MAGNET_DEG = 1.5;   // 이 안에 들어와야 붙는다. 경로 폭이 0.2~0.6도라 이만하면 넉넉하다

function snapAim(){
  const cue = S.balls.cue;
  if (!cue || !S.aim) return false;
  const d0 = [S.aim[0]-cue.p[0], S.aim[1]-cue.p[1]];
  const len = Math.hypot(d0[0], d0[1]);
  if (len < 1e-6) return false;
  const list = findRoutes();
  if (!list.length){ S.routeIx = -1; return false; }
  const a0 = Math.atan2(d0[1], d0[0]);
  let bi = -1, bd = Infinity;
  for (let i = 0; i < Math.min(list.length, ROUTE_SHOW); i++){
    // 각도 차이를 -180~180 으로 접어서 잰다 (0도 이음매에서 뒤집히지 않게)
    const df = Math.abs(((list[i].a - a0 + Math.PI*3) % (Math.PI*2)) - Math.PI);
    if (df < bd){ bd = df; bi = i; }
  }
  if (bi < 0 || bd > MAGNET_DEG * Math.PI/180){ S.routeIx = -1; return false; }
  S.routeIx = bi;
  const a = list[bi].a;
  S.aim = S.lastAim = [cue.p[0] + Math.cos(a)*len, cue.p[1] + Math.sin(a)*len];
  return true;
}

function drawNumbers(){
  if (curSystem() === 1){ drawNumbers2Bank(); return; }
  const o = orientation();
  for (const sc of SCALES){
    const third = sc.name === 'third_cushion';
    // 숫자도 화면에 비례시킨다. 17/20px 고정이면 폰에서 안 보인다.
    const fs = Math.round(L.cloth.h * (third ? 0.055 : 0.065));   // 천 높이 기준
    g.font = 'bold ' + fs + 'px sans-serif';
    g.fillStyle = sc.color; g.textAlign = 'center'; g.textBaseline = 'middle';
    const seen = [];
    for (const pt of sc.points){
      // ⚠️ 100 뒤의 110·120 은 **판독창 전용**이다 (사용자 확정). 다이에는 안 그린다.
      if (pt.readout_only) continue;
      let mm = railPoint(sc, pt.rail, pt.index);
      const rail = foldRail(o, pt.rail);
      mm = fold(o, mm);
      let [x,y] = toPx(...mm);
      // ⚠️ 단쿠션(좌·우) 숫자는 레일 **가운데**에 정렬한다. 프레임 포인트 자리에
      //    그대로 두면 레일 한쪽에 치우쳐 보인다 (사용자 지적).
      //    화면이 좌우로 뒤집혀도(fold) 같이 따라가야 하므로 접은 뒤의 레일로 판단한다.
      // ⚠️ 위쪽 레일 숫자는 화면 맨 위에 붙어 잘려 보인다 (사용자 지적).
      //    글자 높이의 20% 만큼 안쪽으로 내린다.
      if (rail === 'top')    y += fs * 0.20;
      if (rail === 'bottom') y -= fs * 0.06;
      if (rail === 'left' || rail === 'right'){
        const railMid = rail === 'right'
          ? (L.cloth.x + L.cloth.w + L.rail.x + L.rail.w) / 2
          : (L.rail.x + L.cloth.x) / 2;
        x = railMid;
      }
      if (seen.some(s => s.n === pt.number && Math.hypot(s.x-x, s.y-y) < fs*6)) continue;
      seen.push({n:pt.number, x, y});
      // ⚠️ 다이아몬드 **반칸**에 걸린 숫자는 밝기를 30% 낮춘다 (사용자 지시).
      //    상단 60·80·100 / 우측 80·100 / 하단(3쿠션) 50·70·90 이 여기 해당한다.
      g.fillStyle = pt.index % 1 ? dim(sc.color, 0.7) : sc.color;
      g.strokeStyle = '#101014'; g.lineWidth = Math.max(3, fs * 0.28);
      g.strokeText(String(pt.number), x, y); g.fillText(String(pt.number), x, y);
    }
  }
}
// 2뱅크 눈금 — 그 샷의 레일 배정대로 세 줄을 그린다. **레일 포인트** 기준이라
// 프레임이 아니라 쿠션 날 위에 찍는다.
// ★ 팁 가이드 — 사용자 2026-08-11: '무회전을 기본으로 하고 각이 안 나올 경우
//   회전을 가이드 하는 겁니다.'
//   목표는 **2적구**다. 0팁(무회전)부터 0.5씩 올려가며 2적구에 닿는 팁을 찾는다.
//   ⚠️ 순회전만 본다. reflect() 가 0~3팁으로 묶여 있고, 역회전 표는 아직 없다
//      (오전 촬영에서 7샷 20접점뿐). 역회전이 필요한 배치는 '못 만듦' 으로 나온다.
function segNear(a, b, q, r){
  const vx = b[0]-a[0], vy = b[1]-a[1], wx = q[0]-a[0], wy = q[1]-a[1];
  const L = vx*vx + vy*vy;
  const t = L < 1e-9 ? 0 : Math.max(0, Math.min(1, (wx*vx + wy*vy)/L));
  return Math.hypot(a[0]+vx*t-q[0], a[1]+vy*t-q[1]) <= r;
}
function reaches(tip, cue, tgt, d){
  const save = S.tipH; S.tipH = tip;
  const pts = [cue.p, ...roll(cue.p, d, 5, 0).map(h => h.p)];
  S.tipH = save;
  for (let i = 0; i < pts.length-1; i++)
    if (segNear(pts[i], pts[i+1], tgt.p, T.ball_diameter)) return true;
  return false;
}
// ⚠️ 전에는 '0팁부터 훑어 닿는 가장 작은 팁' 을 보여줬다. 0팁이 닿으면 당점을
//    뭘로 바꿔도 늘 '무회전' 이라 무슨 뜻인지 알 수 없었다 (사용자 지적 35·36.jpg).
//    → **지금 당점으로 닿는지**를 먼저 보고, 안 닿으면 닿는 팁을 권한다.
function tipGuide(){
  const cue = S.balls.cue;
  const tgt = S.balls.obj2 || S.balls.obj1;
  if (!cue || !S.aim || !tgt) return null;
  const d = [S.aim[0]-cue.p[0], S.aim[1]-cue.p[1]];
  const now = Math.max(0, Math.min(3, S.tipH));
  if (reaches(now, cue, tgt, d)) return {ok:true, tip:now};
  for (let t = 0; t <= 3.001; t += 0.5)
    if (reaches(t, cue, tgt, d)) return {ok:false, tip:t};
  return {ok:false, tip:null};
}

function drawNumbers2Bank(){
  const tb = twoBank();
  const fs = Math.round(L.cloth.h * 0.065);
  g.font = 'bold ' + fs + 'px sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  if (!tb){                                     // 아직 조준 전 — 안내만
    g.fillStyle = 'rgba(255,255,255,0.45)';
    g.fillText('2뱅크 — 조준하면 눈금이 나옵니다', L.cloth.x + L.cloth.w/2, L.cloth.y + L.cloth.h/2);
    return;
  }
  const put = (rail, corner, dia, txt, col) => {
    const mm = railPos(rail, corner, dia);
    let [x,y] = toPx(...mm);
    if (rail === 'top')    y += fs * 0.70;
    if (rail === 'bottom') y -= fs * 0.70;
    if (rail === 'left')   x += fs * 0.85;
    if (rail === 'right')  x -= fs * 0.85;
    g.fillStyle = col;
    g.strokeStyle = '#101014'; g.lineWidth = Math.max(3, fs*0.28);
    g.strokeText(txt, x, y); g.fillText(txt, x, y);
  };
  const n0 = isLong(tb.r0) ? 8 : 4, n1 = isLong(tb.r1) ? 8 : 4;
  // 출발값 — 한 칸에 1 (흰색)
  for (let v = 1; v <= Math.min(4, n0); v++) put(tb.r0, tb.cS, v, String(v), '#f6f5ee');
  // 2쿠션값 — 5 − 칸수×단위 (노랑). 화면에서 확인된 2·3·4 만 찍는다
  for (const v of [2,3,4]){
    const dia = (5 - v) / (isLong(tb.r2) ? 0.5 : 1);
    if (dia <= (isLong(tb.r2) ? 8 : 4)) put(tb.r2, tb.cS, dia, String(v), '#f0be28');
  }
  // 1쿠션 위치값 — 한 칸에 10 (빨강)
  for (let k = 1; k <= n1; k++) put(tb.r1, tb.cF, k, String(k*10), '#ff5a4e');
}

function railPoint(sc, rail, idx){
  const off = sc.reference === 'rail' ? 0 : T.frame_offset;
  const n = (rail === 'bottom' || rail === 'top') ? 8 : 4;
  const t = idx/n;
  if (rail === 'bottom') return [T.width*t, -off];
  if (rail === 'top')    return [T.width*t, T.height+off];
  if (rail === 'left')   return [-off, T.height*t];
  return [T.width+off, T.height*t];
}

// 궤적이 적구에 닿으면 거기서 끊는다.
// ⚠️ 닿은 뒤의 경로는 두께·당점·스트로크에 따라 완전히 달라진다 — 아직 재지 않은
//    영역이다. 그대로 이어 그리면 없는 것을 보여주게 된다 (사용자 지시).
//    수구 중심이 적구 중심에서 **지름**만큼 떨어지는 순간이 접촉이다.
// 반환: {pts, hit}  hit=true 면 마지막 점이 적구에 닿은 자리
function cutAtBall(pts, except){
  // ⚠️ except — 방금 맞은 그 공은 빼야 한다. 충돌 직후 수구는 아직 그 공에서
  //    지름 거리에 있고, 얇게 맞으면 계속 다가가므로 **즉시 다시 맞았다고** 나온다
  //    (사용자 지적, 2.jpg 에서 충돌 후 궤적이 몇 px 만 그려졌다).
  const objs = [];
  for (const k in S.balls){
    const q = S.balls[k].p;
    if (k === 'cue') continue;
    if (except && Math.hypot(q[0]-except[0], q[1]-except[1]) < 1) continue;
    objs.push(q);
  }
  if (!objs.length) return {pts, hit:false};
  const D = T.ball_diameter, out = [pts[0]];
  for (let i = 0; i < pts.length-1; i++){
    const a = pts[i], b = pts[i+1];
    const dx = b[0]-a[0], dy = b[1]-a[1], ll = dx*dx + dy*dy;
    let t0 = null, hitObj = null;
    if (ll > 1e-9) for (const o of objs){
      const fx = a[0]-o[0], fy = a[1]-o[1];
      const B = 2*(fx*dx + fy*dy), C = fx*fx + fy*fy - D*D;
      const disc = B*B - 4*ll*C;
      if (disc < 0) continue;
      const sq = Math.sqrt(disc);
      for (const t of [(-B-sq)/(2*ll), (-B+sq)/(2*ll)])
        if (t > 1e-3 && t <= 1 && (t0 === null || t < t0)){ t0 = t; hitObj = o; }
    }
    if (t0 !== null){
      out.push([a[0]+dx*t0, a[1]+dy*t0]);
      return {pts:out, hit:true, obj:hitObj, from:a};
    }
    out.push(b);
  }
  return {pts:out, hit:false};
}



// 1적구가 나가는 각. **수구의 진행 방향** 을 0 으로 보고, 적구가 있는 **같은 쪽**으로 꺾인다.
// (수구는 반대쪽으로 꺾인다 — data/separation.json 참고)
function objectAngle(thick){
  if (!SEP_OBJ.length) return null;
  const t = Math.max(0, Math.min(1, thick));
  const a = SEP_OBJ.slice().sort((x,y) => x[0]-y[0]);
  if (t <= a[0][0]) return a[0][1];
  if (t >= a[a.length-1][0]) return a[a.length-1][1];
  for (let i = 0; i < a.length-1; i++)
    if (t >= a[i][0] && t <= a[i+1][0]){
      const k = (t - a[i][0]) / (a[i+1][0] - a[i][0]);
      return a[i][1] + k * (a[i+1][1] - a[i][1]);
    }
  return null;
}

// 회전 없는 거울반사로 굴린다.
// ⚠️ 1적구에 실측 반사표(measured_bounce)를 쓰면 안 된다. 그 표는 **큐로 3팁을 준
//    수구** 로 잰 것이고, 1적구는 큐에 안 맞아 회전이 없다.
function rollPlain(start, d, cushions){
  const n = Math.hypot(d[0], d[1]);
  if (n < 1e-9) return [];
  let p = start.slice(), dir = [d[0]/n, d[1]/n], out = [];
  for (let i = 0; i < cushions; i++){
    const nx = nextRail(p, dir, T.width, T.height);
    if (!nx) break;
    const [rail, q] = nx, nb = RAILS[rail];
    const dot = dir[0]*nb[0] + dir[1]*nb[1];
    dir = [dir[0] - 2*dot*nb[0], dir[1] - 2*dot*nb[1]];
    out.push({rail, p: q});
    p = q;
  }
  return out;
}

// ---------------------------------------------------------------- 충돌 후
// 적구를 맞은 뒤 수구가 꺾이는 각 (분리각). data/separation.json 의 표를 보간한다.
// ⚠️ 이 표는 **당점 2시30분~3시 3팁 · 사용자의 평소 속도** 에서만 맞는다
//    (실측 쿠션표와 같은 조건). 속도·거리·당점 높낮이는 아직 안 넣었다.
// 두께와 **상하 당점**으로 분리각을 낸다.
//   tip  +3 = 상단 3팁(12시) · 0 = 중단 · −3 = 하단 3팁(6시)
// ⚠️ 좌우 회전(사이드)은 여기가 아니라 쿠션 반사(reflect)를 바꾼다.
//    사용자 확인: '중단 2~3팁(옆회전만)' 이 무회전과 값이 같다 → 분리각은 좌우와 무관.
function separationAngle(thick, tip){
  if (!SEP.length) return null;
  const t = Math.max(0, Math.min(1, thick));
  const v = Math.max(-3, Math.min(3, tip === undefined ? S.tipV : tip));
  // 한 줄에서 상하 당점으로 값을 뽑는다.
  // 표는 일곱 칸: [두께, +3, +2, +1, 0, −1, −2, −3] — 사용자 제공 실측값이라
  // 상단↔중단↔하단이 직선이 아니다. 이웃한 두 칸 사이만 보간한다.
  const byTip = r => {
    const f = Math.max(0, Math.min(5.999, 3 - v));   // +3→0 · 0→3 · −3→6
    const i = Math.floor(f);
    return r[1+i] + (f - i) * (r[2+i] - r[1+i]);
  };
  if (t >= SEP[SEP.length-1][0]) return byTip(SEP[SEP.length-1]);  // 더 두꺼워도 안 늘린다
  for (let i = 0; i < SEP.length-1; i++)
    if (t >= SEP[i][0] && t <= SEP[i+1][0]){
      const k = (t - SEP[i][0]) / (SEP[i+1][0] - SEP[i][0]);
      return byTip(SEP[i]) + k * (byTip(SEP[i+1]) - byTip(SEP[i]));
    }
  return null;
}

// 적구에 닿는 순간의 두께와, 그 뒤 수구가 갈 방향.
//   두께 = (지름 − 중심선까지 거리) / 지름     (정면 1.0 · 반두께 0.5 · 스침 0)
//   꺾이는 쪽은 적구가 있는 **반대쪽**이다.
function afterHit(from, to, obj){
  const D = T.ball_diameter;
  let dx = to[0]-from[0], dy = to[1]-from[1];
  const L = Math.hypot(dx, dy);
  if (L < 1e-9) return null;
  dx /= L; dy /= L;
  const ox = obj[0]-to[0], oy = obj[1]-to[1];
  const side = dx*oy - dy*ox;                    // 적구가 왼쪽(+)인가 오른쪽(−)인가
  const perp = Math.abs(side);                   // 접촉 순간 중심선까지 거리
  const thick = Math.max(0, Math.min(1, (D - perp) / D));
  const deg = separationAngle(thick);
  if (deg === null) return null;
  const sgn = Math.sign(side || 1);
  const r = -sgn * deg * Math.PI/180;                    // 수구는 적구 반대쪽으로
  const od = objectAngle(thick);
  const ro = od === null ? null : sgn * od * Math.PI/180; // 1적구는 같은 쪽으로
  return {thick, deg, objDeg: od,
          dir: [dx*Math.cos(r) - dy*Math.sin(r), dx*Math.sin(r) + dy*Math.cos(r)],
          objDir: ro === null ? null
                : [dx*Math.cos(ro) - dy*Math.sin(ro), dx*Math.sin(ro) + dy*Math.cos(ro)]};
}

// 1적구를 맞은 뒤 수구 경로를 몇 쿠션까지 그리나.
// data/speed.json ★_충돌_후_그리는_쿠션 의 표 그대로. 표에 없는 값은 마지막 줄을 쓴다.
function afterCushions(used){
  if (!POST_CUSHIONS.length) return 7;
  const u = Math.max(0, used);
  const row = POST_CUSHIONS.find(r => r[0] === u);
  return row ? row[1] : POST_CUSHIONS[POST_CUSHIONS.length-1][1];
}

function drawPath(){
  const cue = S.balls.cue;
  if (!cue || !S.aim) return;
  const hits = pathFromAim(cue.p, S.aim, S.corr), kk = LAST_K;
  if (!hits.length) return;
  const full = [cue.p, ...hits.map(h => h.p)];
  const cut = cutAtBall(full);
  const cols = [COL.aim, COL.c12, COL.c23, COL.after, COL.after, COL.after];
  const seg = (a, b, w, alpha, col) => {
    g.strokeStyle = col; g.globalAlpha = alpha; g.lineWidth = w; g.lineCap = 'round';
    g.beginPath(); g.moveTo(...toPx(...a)); g.lineTo(...toPx(...b)); g.stroke();
    g.globalAlpha = 1;
  };
  const band = Math.max(3, T.ball_diameter * L.sc);
  const thin = Math.max(2.5, L.cloth.h*0.008);

  // 1) 적구에 부딪히기 전 — 공 두께(궤적) 띠를 깔고 그 위에 선
  const before = cut.pts;
  for (let i = 0; i < before.length-1; i++){
    const c = cols[Math.min(i,cols.length-1)];
    seg(before[i], before[i+1], band, 0.28, c);
    seg(before[i], before[i+1], thin, 1, c);
  }

  if (!cut.hit){                                  // 안 맞으면 4쿠션까지 선만
    const last = Math.min(full.length-1, 4);
    for (let i = before.length-1; i < last; i++)
      seg(full[i], full[i+1], thin, 1, cols[Math.min(i,cols.length-1)]);
    drawCushionDots(full, Math.min(last, full.length-1));
    return;
  }

  // 2) 맞은 뒤 — 두께로 꺾인 방향으로 다시 굴린다 (사용자 제공 분리각 표)
  const P = before[before.length-1];
  const a = afterHit(cut.from, P, cut.obj);
  drawCushionDots(before, before.length-2);
  const [hx,hy] = toPx(...P);
  g.fillStyle = COL.hit; g.beginPath(); g.arc(hx,hy,9,0,7); g.fill();
  g.strokeStyle = '#14141a'; g.lineWidth = 2; g.stroke();
  if (!a) return;

  // ★ 사용자 확정 2026-08-11: '충돌 뒤 쿠션 보정이 걸립니다.'
  //   조준선에서 풀린 k 를 그대로 이어 쓴다 (LAST_K). 보정은 **다이(쿠션)** 의 값이라
  //   같은 다이면 충돌 전이든 후든 같은 값이 걸리는 것이 맞다.
  //   ⚠️ 1적구와 부딪혀 꺾이는 각에는 안 걸린다 — 그건 공끼리라 다이와 무관하다.
  // ★ 사용자 확정 2026-08-10 — **두께로 자르지 않고 굵기·진하기로 가른다.**
  //   1~5쿠션   궤적 띠 + 선   진하게 (지금까지와 같다)
  //   6~7쿠션   얇은 선만      흐리게, 띠 없음
  //   8쿠션 방향 더 흐리게 절반
  //   보통 배치는 5쿠션까지가 눈에 들어오고 그 뒤는 배경처럼 깔린다.
  //   대회전(28.jpg)은 흐린 선을 따라가면 7쿠션까지 보인다.
  // ⚠️ 지저분해 보이는 것은 결국 **띠(공 두께 폭)** 때문이다. 6쿠션부터 띠를 빼면 된다.
  //   두께 30% 규칙·버튼은 사용자가 접었다 — 다시 꺼내지 말 것.
  // ⚠️ 1~5쿠션에 띠를 넣는 이유: 어디로 지나가는지 폭까지 봐야 키스가 보인다.
  // ★ 사용자 2026-08-10 (4.jpg) — 충돌 **전에 쓴 쿠션 수**로 정한다.
  //   쓰리뱅크로 3쿠션을 이미 돌고 얇게 맞았는데 거기서 또 7쿠션을 더 도는 것이 문제였다.
  //   직접 치는 경우(앞·뒤·제각돌리기)는 7쿠션 그대로. 표는 data/speed.json.
  const DRAW_UPTO = afterCushions(before.length - 2);   // 여기까지 진하게 그린다
  const BAND_UPTO = Math.min(5, DRAW_UPTO);             // 띠는 그리는 데까지만
  // ★ 사용자 2026-08-10 (1.jpg): '궤적이 1적구를 맞고 멈추었는데 **2적구까지는
  //   연장궤적이 그려져야** 합니다.' 득점이 되는지가 거기서 갈리므로, 표대로 끊더라도
  //   2적구에 닿는 경로는 보여야 한다. 표는 **진하게 그리는 한도**이고,
  //   그 뒤는 2적구에 닿을 때만 얇고 흐린 연장선으로 이어 붙인다.
  const REACH_UPTO = 7;                                 // 2적구를 여기까지 찾아본다
  const later = roll(P, a.dir, REACH_UPTO + 1, kk);   // 충돌 뒤 쿠션에도 보정
  const post = cutAtBall([P, ...later.slice(0, REACH_UPTO).map(h => h.p)], cut.obj);
  // 2적구에 닿으면 거기까지, 아니면 표대로만
  const lastSeg = post.hit ? post.pts.length - 1
                           : Math.min(DRAW_UPTO, post.pts.length - 1);
  const pts2 = post.pts.slice(0, lastSeg + 1);
  // ★ 사용자 지시 2026-08-10: '직접 공을 치는 경우도 파이브앤하프와 같이
  //   쿠션별 컬러를 적용해 주세요.' 충돌점부터 다시 세어 1·2·3쿠션을 같은 색으로.
  //   숫자를 충돌 후 라인에서 읽는 것(systemBase)과도 눈으로 맞아떨어진다.
  for (let i = 0; i < pts2.length-1; i++){
    const c = cols[Math.min(i, cols.length-1)];
    if (i < BAND_UPTO){
      seg(pts2[i], pts2[i+1], band, 0.22, c);
      seg(pts2[i], pts2[i+1], thin, 0.95, c);
    } else if (i < DRAW_UPTO){
      seg(pts2[i], pts2[i+1], thin, i === BAND_UPTO ? 0.45 : 0.30, c);
    } else {
      // ★ 사용자 2026-08-11 (4.jpg): '공 궤적이 빨간공에서 끊어지고 실선이 노란공까지
      //   가는데, **공 궤적이 노란공까지 가야** 합니다.'
      //   → 2적구까지 이어 붙이는 구간도 얇은 선이 아니라 **띠(공 두께 폭)** 로 그린다.
      //   득점이 되는 길이라 폭까지 보여야 한다 — 키스도 여기서 보인다.
      seg(pts2[i], pts2[i+1], band, 0.22, c);
      seg(pts2[i], pts2[i+1], thin, 0.95, c);
    }
  }
  // 쿠션 점은 띠 구간까지만. 흐린 구간까지 찍으면 다시 지저분해진다.
  drawCushionDots(pts2, Math.min(BAND_UPTO, pts2.length - 1 - (post.hit ? 1 : 0)));
  // 마지막 쿠션 다음 **방향**만 절반 길이로. 제일 흐리게.
  // ⚠️ 그 안에서 공에 맞았으면 그리지 않는다 — '공에 닿으면 이후는 지운다'.
  if (!post.hit && DRAW_UPTO >= 1 && later.length >= DRAW_UPTO + 1){
    const aN = later[DRAW_UPTO-1].p, aN1 = later[DRAW_UPTO].p;
    const half = [aN[0] + (aN1[0]-aN[0])*0.5, aN[1] + (aN1[1]-aN[1])*0.5];
    const tail = cutAtBall([aN, half], cut.obj);
    for (let i = 0; i < tail.pts.length-1; i++)
      seg(tail.pts[i], tail.pts[i+1], thin, 0.20, COL.after);
  }
  // 1적구 동선 — 키스를 보려면 이것도 그려야 한다 (사용자 확정).
  // 1적구는 회전·당점의 영향을 안 받고 두께로만 방향이 정해지므로 계산할 수 있다.
  if (a.objDir){
    // ★ 사용자 지시 2026-08-10: '1적구 경로를 **3쿠션까지만** 보여줍시다, 힘에
    //   관계없이. 공에 맞았을 경우입니다. 안 맞았을 경우 4쿠션까지 연장합니다.'
    //   → 3쿠션 안에서 공에 맞으면 거기서 끊고, 아무 공에도 안 맞으면 4쿠션까지.
    // ⚠️ 얼마나 굴러가는지는 아직 모른다 — 1적구가 받는 **충격량**을 안 재서다.
    //    전에 6쿠션까지 그렸더니 34% 얇은 두께에도 다이 전체를 덮었다 (3.jpg).
    //    이제는 '힘에 관계없이 몇 쿠션' 이라는 사용자 기준을 그대로 쓴다.
    let oq = cutAtBall([cut.obj, ...rollPlain(cut.obj, a.objDir, 3).map(h => h.p)], cut.obj);
    if (!oq.hit)
      oq = cutAtBall([cut.obj, ...rollPlain(cut.obj, a.objDir, 4).map(h => h.p)], cut.obj);
    const op = oq.pts;
    // ⚠️ 수구의 1→2쿠션 구간도 노란색이라 1적구 궤적과 헷갈린다. 점선으로 갈라 준다.
    g.save(); g.setLineDash([Math.max(8, thin*4), Math.max(6, thin*3)]);
    for (let i = 0; i < op.length-1; i++){
      seg(op[i], op[i+1], band, 0.18, COL.obj);
      seg(op[i], op[i+1], Math.max(2, thin*0.8), 0.95, COL.obj);
    }
    g.restore();
    for (let i = 1; i < op.length - (oq.hit ? 1 : 0); i++){
      const [x,y] = toPx(...op[i]);
      g.fillStyle = COL.obj; g.beginPath(); g.arc(x,y,4,0,7); g.fill();
      g.strokeStyle = '#14141a'; g.lineWidth = 2; g.stroke();
    }
  }

  if (post.hit){                                  // 다음 공에 맞은 자리 = 득점
    const [x,y] = toPx(...pts2[pts2.length-1]);
    g.fillStyle = '#6eeb5a'; g.beginPath(); g.arc(x,y,11,0,7); g.fill();
    g.strokeStyle = '#14141a'; g.lineWidth = 3; g.stroke();
  }
  // 두께·분리각을 접촉점 옆에 적는다.
  // ⚠️ 접촉점 **바로 위**에 적으면 1적구가 덮는다 (사용자 지적, ss.jpg).
  //    draw() 가 경로를 먼저 그리고 공을 나중에 그려서 글자가 공 밑으로 들어간다.
  //    '32%  35°' 의 가운데가 가려져 각도 두 개처럼 보였다.
  //    → 1적구 **반대쪽**으로 민다. 공이 어디 있든 자동으로 반대편에 붙는다.
  g.save();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const fs = Math.max(11, L.cloth.h*0.045);
  g.font = '800 ' + Math.round(fs) + 'px system-ui, sans-serif';
  g.lineJoin = 'round'; g.strokeStyle = '#14161a'; g.lineWidth = Math.max(3, fs*0.28);
  const txt = Math.round(a.thick*100) + '%  ' + Math.round(a.deg) + '°';
  const [obx, oby] = toPx(...cut.obj);
  let vx = hx - obx, vy = hy - oby;
  const vn = Math.hypot(vx, vy) || 1;
  vx /= vn; vy /= vn;
  const off = ballR()*2.0 + fs*0.9;
  const half = g.measureText(txt).width/2 + fs*0.3;
  const c2 = L.cloth;
  // 천 밖으로 나가지 않게 잡아 둔다
  const tx = Math.min(Math.max(hx + vx*off, c2.x + half), c2.x + c2.w - half);
  const ty = Math.min(Math.max(hy + vy*off, c2.y + fs*0.7), c2.y + c2.h - fs*0.7);
  g.strokeText(txt, tx, ty); g.fillStyle = COL.hit;
  g.fillText(txt, tx, ty);
  g.restore();
}

function drawCushionDots(pts, upto){
  for (let i = 1; i <= upto; i++){
    const [x,y] = toPx(...pts[i]);
    g.fillStyle = COL.c23; g.beginPath(); g.arc(x,y,6,0,7); g.fill();
    g.strokeStyle = '#14141a'; g.lineWidth = 2; g.stroke();
  }
}
function drawBalls(){
  for (const k in S.balls){
    const b = S.balls[k], [x,y] = toPx(...b.p), rr = ballR();
    // ⚠️ 검은 천에서는 검은 테두리가 안 보인다. 하이라이트와 접지 그림자로 띄운다.
    g.save();
    g.fillStyle = 'rgba(0,0,0,0.45)';
    g.beginPath(); g.ellipse(x+rr*0.12, y+rr*0.30, rr*0.95, rr*0.42, 0, 0, 7); g.fill();
    g.restore();
    const base = TONE[b.color] || '#fff';
    const sph = g.createRadialGradient(x-rr*0.34, y-rr*0.38, rr*0.05, x, y, rr*1.06);
    sph.addColorStop(0,   '#ffffff');
    sph.addColorStop(0.30, base);
    sph.addColorStop(1,   shade(base, 0.42));
    g.fillStyle = sph;
    g.beginPath(); g.arc(x,y,rr,0,7); g.fill();
    // ⚠️ 폰에서 공이 작아 얇은 테두리는 안 보인다. 수구는 **공 바깥에 굵은 링**을
    //    따로 그려 확실히 구분한다 (사용자 지적: 수구 테두리가 안 보인다).
    const r = ballR();
    g.strokeStyle = '#14141a'; g.lineWidth = Math.max(1.5, r*0.12); g.stroke();
    // 수구는 금색 링을 **계속** 유지한다. 나머지는 방금 놓였을 때만 잠깐 깜박인다
    // (사용자 지시: 3초간 금색 테두리 블링크 후 지우기).
    const on = k === 'cue' ? 1 : blinkAlpha();
    if (on > 0){
      g.save();
      g.globalAlpha = on;
      g.strokeStyle = '#ffdd33';
      g.lineWidth = Math.max(3, r * 0.42);
      g.beginPath(); g.arc(x, y, r + g.lineWidth*0.7, 0, 7); g.stroke();
      g.restore();
    }
  }
}

// 방금 공이 놓이거나 움직였으면 3초간 깜박인다. 0 이면 안 그린다.
function blinkAlpha(){
  if (!S.blink) return 0;
  const left = S.blink - Date.now();
  if (left <= 0){ S.blink = 0; return 0; }
  return 0.35 + 0.65 * Math.abs(Math.sin(left / 1000 * Math.PI * 2));
}
// ⚠️ const 화살표로 두면 선언 전에 불릴 때 화면이 통째로 죽는다 (전에 겪었다).
//    함수 선언으로 둬서 끌어올려지게 한다.
function blink(){ S.blink = Date.now() + 3000; }
function drawClock(){
  if (previewOn()) return;                        // 촬영 중에는 다이 안을 비운다
  const [x,y] = clockCenter(), R = clockR();
  g.fillStyle = '#f0f0ea'; g.beginPath(); g.arc(x,y,R,0,7); g.fill();
  g.strokeStyle = '#3c3e46'; g.lineWidth = 2; g.stroke();
  // 누르면 커진다는 표시. 크기는 그대로 두고(사용자가 줄이라고 했다) 테두리만 두른다.
  g.strokeStyle = 'rgba(255,221,51,0.55)'; g.lineWidth = Math.max(1.5, R*0.10);
  g.beginPath(); g.arc(x, y, R*1.22, 0, 7); g.stroke();
  // ⚠️ 작은 원에서는 점이 커서, 3팁(0.78R) 자리에 찍으면 점 가장자리가 공 끝에
  //    딱 닿아 **떨어져 나가는 것처럼 보인다** (사용자 지적, 13.jpg — 6시 3팁).
  //    큰 판은 그대로 두고 여기서만 점을 줄이고, 한계 원을 같이 그려
  //    '원 위에 얹힌 자리' 로 읽히게 한다.
  g.strokeStyle = 'rgba(190,40,32,0.40)'; g.lineWidth = Math.max(1, R*0.045);
  g.beginPath(); g.arc(x, y, R*TIP_R*3, 0, 7); g.stroke();
  const [dx,dy] = tipOffset(R);
  g.fillStyle = '#de342c';
  g.beginPath(); g.arc(x + dx, y + dy, R*0.155, 0, 7); g.fill();
}
function goingLeft(){
  // ⚠️ 전에는 pathFromAim() 을 불렀다. 이제 bend() 가 englishSide() → tipSide() →
  //    goingLeft() 를 부르므로 그러면 무한재귀가 된다.
  //    첫 쿠션이 어디인지는 반사와 무관하니 nextRail 로 바로 구한다 (더 싸기도 하다).
  const cue = S.balls.cue;
  if (!cue || !S.aim) return false;
  const d = [S.aim[0]-cue.p[0], S.aim[1]-cue.p[1]];
  const n = Math.hypot(d[0], d[1]);
  if (n < 1e-9) return false;
  const nx = nextRail(cue.p, [d[0]/n, d[1]/n], T.width, T.height);
  return nx ? nx[1][0] < cue.p[0] : false;
}

// ---------------------------------------------------------------- 당점판
// ★ 2026-08-10 사용자 확정 (C:/sc/ss1.jpg):
//   '팁의 방향을 나눌 때는 **중앙 기준 시계방향**으로 잡습니다. ss1이 정확한 그림입니다.'
//   ss1 을 픽셀로 재보니 상단·1팁·2팁·3팁·4팁·하단이 **전부 같은 반지름**(약 18mm)에
//   있고 각도만 다르다. 즉 **팁 번호 = 시계 눈금**이다.
//        12시 상단 · 1시 1팁 · 2시 2팁 · 3시 3팁 · 4시 4팁 · 6시 하단
//   이 하나로 사용자가 한 말이 전부 맞아떨어진다 —
//     '3시 방향 3번째가 3팁'                → 3시 = 18mm = 3팁
//     '4팁은 순3 바로 아래 원에 걸린 자리'    → 4시 방향, 같은 원 위
//     '6시 3팁이 너무 내려가 있다'            → 24mm 가 아니라 18mm 였어야 한다
//     '파이브앤하프는 2시30분, 2단과 3단 가운데'
//   separation.json 의 상단3팁 = 12시, 하단3팁 = 6시 와도 그대로 맞는다.
// ⚠️ 전에는 가로·세로를 따로 세는 사각 격자였다. 그것이 틀렸다 (v88~v95).
const TIP_R    = 6.0 / 30.75;      // 1팁 6mm / 공 반지름 30.75mm = 0.195  (3팁 = 18mm)
const TIP_EDGE = 23.75 / 30.75;    // 칠 수 있는 바깥 끝 = 반지름 − 7mm. 그 밖은 삑사리.
const TIP_DIRS = 24;               // 30분 단위. 0=12시 · 5=2시30분 · 6=3시 · 12=6시
const TIP_RUN  = 12;               // 여기까지가 순회전 쪽 (12시 → 3시 → 6시)
// 어느 원에 어느 방향을 놓나. ss1 을 따른다 — 바깥 원(3팁)은 30분 단위로 촘촘하게,
// 안쪽은 성기게 (ss1 의 중상단·중하단이 12시·6시 절반 자리에만 있다).
const TIP_RING = [{r:3, step:1}, {r:2, step:2}, {r:1, step:6}];

// ★ 사용자 데이터에 실제로 적혀 있는 당점만 넣는다. 내가 만든 조합은 없다.
const PRESET = [
  {lb:'파이브앤하프', dir: 5, r: 3, src:'★ 사용자 확정 2026-08-10 — 2시30분 3팁 (2단과 3단 가운데)'},
  {lb:'무회전 뱅크',  dir: 0, r: 3, src:'systems.json  12시 2~3팁 · 좌우 회전 0'},
  {lb:'끌어치기',     dir:10, r: 3, src:'kiss.json  일자배치 5시 (하단 3팁)'},
  {lb:'중단 기준',    dir: 0, r: 0, src:'separation.json  자연 분리각 45도'}
];

// 순회전(공이 도는 쪽)이 화면의 어느 쪽인가.
function tipSide(){ return goingLeft() ? -1 : 1; }

// 반지름 R 인 작은 공에서 지금 당점이 중심에서 얼마나 떨어져 있나 (px)
function tipOffset(R){ return tipXY(S.tipDir, S.tipR, R * TIP_R); }

// 고를 수 있는 자리 — 가운데 하나 + 세 원. 24자리.
function tipDots(){
  const out = [{dir:0, r:0}];
  for (const g of TIP_RING)
    for (let d = 0; d <= TIP_RUN; d += g.step) out.push({dir:d, r:g.r});
  return out;
}

// 방향(30분 단위) · 거리(팁) → 중심에서의 화면 오프셋.
// ⚠️ 순회전이 왼쪽이면 좌우를 뒤집는다. 시계 읽기도 같이 뒤집힌다.
function tipXY(dir, r, unit){
  const a = dir * Math.PI / 12;                    // 15도씩
  return [Math.sin(a) * r * unit * tipSide(), -Math.cos(a) * r * unit];
}

// 고른 자리를 상하·좌우 성분으로 풀어 둔다.
//   분리각은 상하(tipV) 를, 쿠션 반사는 좌우(tipH) 를 쓴다.
//   예) 2시30분 3팁 → 위로 0.78팁 · 옆으로 2.90팁
function setTip(dir, r){
  const a = dir * Math.PI / 12;
  S.tipDir = dir; S.tipR = r;
  S.tipV = r * Math.cos(a);
  S.tipH = r * Math.sin(a);
}

// 사용자가 실제로 쓰는 말로 읽는다 — systems.json '2시30분 3팁', kiss.json '5시'.
function tipClock(dir, r){
  if (!r) return '중단 무팁';
  const d = tipSide() > 0 ? dir : (TIP_DIRS - dir) % TIP_DIRS;
  let hh = d / 2; if (hh === 0) hh = 12;
  const h = Math.floor(hh), m = hh - h;
  return (m ? h + '시30분' : h + '시') + ' · ' + r + '팁';
}

// ⚠️ 세로 자리를 0.10h ~ 0.84h 안에만 둔다. 폰 화면이 캔버스보다 짧게 보이는
//    경우가 있어서(7.jpg — 공 아래와 마지막 버튼이 잘렸다) 위아래를 넉넉히 비운다.
const TIP_TOP = 0.10, TIP_BOT = 0.84;
function tipGeom(){
  const w = L.w, h = L.h;
  const R  = Math.min(h*0.37, w*0.24);
  const cx = Math.round(Math.max(R + w*0.045, w*0.28));
  const cy = Math.round(h*0.47);
  const x0 = Math.round(cx + R + w*0.05);
  const bw = Math.max(40, Math.round(w - x0 - w*0.04));
  // 버튼 띠는 0.30h ~ TIP_BOT. 글자 띠(TIP_TOP ~ 0.27h)와 절대 안 겹치게 나눈다.
  // ⚠️ 전에는 글자 셋째 줄이 0.321h, 버튼 시작이 0.319h 라 정확히 겹쳤다 (7.jpg).
  // 프리셋 4개 + '조정 완료' 1개 = 다섯 칸.
  // ⚠️ 탭하면 바로 닫던 것을 사용자가 되돌렸다 — 오른쪽 안내를 읽을 시간이 필요하다.
  //    '위치 지정시 우측에서 다 보여주는데 바로 넘어가면 좀 그렇네요.'
  const band = h*(TIP_BOT - 0.30), gap = Math.round(h*0.016);
  const bh = Math.round((band - gap*4) / 5);
  const y0 = Math.round(h*0.30);
  const rows = PRESET.concat([{lb:'조정 완료', done:true}]);
  const btn = rows.map((p,i) => ({...p, x:x0, y:y0 + i*(bh+gap), w:bw, h:bh}));
  return {R, cx, cy, x0, bw, y0, btn, dots: tipDots(), unit: R*TIP_R};
}

function drawTipPanel(){
  if (!S.tipPanel) return;
  const q = tipGeom(), sd = tipSide();
  g.save();
  g.fillStyle = '#0a0b0d'; g.fillRect(0,0,L.w,L.h);   // 뒤가 비치면 당점이 안 읽힌다

  // 공
  const sph = g.createRadialGradient(q.cx-q.R*0.34, q.cy-q.R*0.38, q.R*0.05,
                                     q.cx, q.cy, q.R*1.06);
  sph.addColorStop(0,'#ffffff'); sph.addColorStop(0.34,'#f2f1ea');
  sph.addColorStop(1,'#b9b7ac');
  g.fillStyle = sph; g.beginPath(); g.arc(q.cx,q.cy,q.R,0,7); g.fill();

  // 3팁 바깥 = 삑사리 구역. 선수는 치지만 우리는 미끄러진다 (사용자 확인).
  // ⚠️ 진하게 칠하면 공 전체가 붉어져 당점이 안 보인다 (7.jpg). 옅게 + 경계선.
  // ⚠️ 도넛을 그릴 때 두 arc 를 그냥 이어 붙이면 3시 방향에 쐐기 자국이 남는다
  //    (10.jpg 오른쪽에 밝은 삼각형). 안쪽 원 앞에 moveTo 를 넣고 정확히 2파이를 쓴다.
  g.save();
  g.beginPath();
  g.arc(q.cx, q.cy, q.R, 0, Math.PI*2);
  g.moveTo(q.cx + q.R*TIP_EDGE, q.cy);
  g.arc(q.cx, q.cy, q.R*TIP_EDGE, 0, Math.PI*2, true);
  g.fillStyle = 'rgba(190,40,32,0.16)'; g.fill();
  g.restore();
  g.strokeStyle = 'rgba(222,52,44,0.75)'; g.lineWidth = Math.max(1.5, q.unit*0.07);
  g.beginPath(); g.arc(q.cx,q.cy,q.R*TIP_EDGE,0,7); g.stroke();
  // 3팁 원 — ss1 에서 상단·1팁·2팁·3팁·4팁·하단이 모두 얹혀 있던 그 원.
  g.strokeStyle = 'rgba(70,74,84,0.45)'; g.lineWidth = Math.max(1, q.unit*0.05);
  g.beginPath(); g.arc(q.cx,q.cy,q.unit*3,0,7); g.stroke();

  // 역회전 쪽 = 실측 데이터가 없다. 덮어서 못 고르게 한다.
  // ⚠️ arc 의 시작·끝 각으로 반쪽을 그리려다 **반대쪽**이 칠해졌다 (7.jpg).
  //    원으로 자른 뒤 사각형을 칠한다 — 어느 쪽인지 눈으로 확인된다.
  g.save();
  g.beginPath(); g.arc(q.cx,q.cy,q.R,0,7); g.clip();
  g.fillStyle = 'rgba(12,13,15,0.66)';
  g.fillRect(sd > 0 ? q.cx - q.R : q.cx, q.cy - q.R, q.R, q.R*2);
  g.restore();

  // 팁 자리 — 방향 × 거리
  for (const d of q.dots){
    const [ox,oy] = tipXY(d.dir, d.r, q.unit);
    const x = q.cx + ox, y = q.cy + oy;
    const on = d.dir === S.tipDir && d.r === S.tipR;
    const rr = Math.max(3, q.unit * (d.r === 3 ? 0.17 : 0.14));
    g.beginPath(); g.arc(x, y, on ? q.unit*0.30 : rr, 0, 7);
    g.fillStyle = on ? '#de342c' : 'rgba(58,60,68,0.55)'; g.fill();
    if (on){ g.strokeStyle = '#ffdd33'; g.lineWidth = Math.max(2, q.unit*0.13); g.stroke(); }
  }

  // 시계 눈금 — ss1 처럼 바깥에 시각을 적는다 (12 1 2 3 4 5 6)
  g.fillStyle = 'rgba(40,42,48,0.85)'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '700 ' + Math.round(q.unit*0.44) + 'px system-ui, sans-serif';
  for (let d = 0; d <= TIP_RUN; d += 2){
    const [ox,oy] = tipXY(d, 3.62, q.unit);
    g.fillText(String(d === 0 ? 12 : d/2), q.cx + ox, q.cy + oy);
  }
  g.fillStyle = 'rgba(230,232,238,0.75)';
  g.font = '700 ' + Math.round(q.unit*0.40) + 'px system-ui, sans-serif';
  g.fillText('역회전', q.cx - q.unit*2.0*sd, q.cy - q.unit*0.32);
  g.fillText('실측 없음', q.cx - q.unit*2.0*sd, q.cy + q.unit*0.32);

  // 지금 값
  // 글자 띠 — 버튼(0.30h 부터)과 안 겹치게 TIP_TOP ~ 0.27h 안에 넣는다.
  const fs = Math.round(L.h*0.050);
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = '#f2f4f8';
  g.font = '800 ' + Math.round(fs*1.15) + 'px system-ui, sans-serif';
  g.fillText(tipClock(S.tipDir, S.tipR), q.x0, Math.round(L.h*0.125));
  const vn = Math.abs(S.tipV) < 0.05 ? '중단'
           : (S.tipV>0?'상단 ':'하단 ') + Math.abs(S.tipV).toFixed(1) + '팁';
  const sa = separationAngle(0.5, S.tipV), rf = reflect(45, S.tipH) - 45;
  g.fillStyle = '#9aa2b2';
  g.font = '600 ' + Math.round(fs*0.76) + 'px system-ui, sans-serif';
  g.fillText(vn + ' · ' + (S.tipH < 0.05 ? '회전 없음' : '순회전 ' + S.tipH.toFixed(1) + '팁'),
             q.x0, Math.round(L.h*0.190));
  g.fillText('반두께 분리각 ' + (sa === null ? '-' : sa.toFixed(0) + '°')
             + '    쿠션 45° 입사 +' + rf.toFixed(1) + '°',
             q.x0, Math.round(L.h*0.250));

  // 자주 쓰는 당점 (전부 data/ 에 적혀 있는 것)
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const b of q.btn){
    const on = !b.done && b.dir === S.tipDir && b.r === S.tipR;
    // '조정 완료' 는 나가는 버튼이라 눈에 띄게 채운다
    g.fillStyle   = b.done ? '#c8a23a' : (on ? '#3a4150' : '#22252b');
    g.strokeStyle = b.done ? '#ffdd33' : (on ? '#ffdd33' : '#3a3e46');
    g.lineWidth   = b.done ? 2.5 : (on ? 3 : 1.5);
    g.beginPath(); g.rect(b.x, b.y, b.w, b.h); g.fill(); g.stroke();
    g.fillStyle = b.done ? '#1a1508' : (on ? '#ffe98a' : '#dfe3ea');
    g.font = (b.done ? '800 ' : '700 ') + Math.round(b.h*0.44) + 'px system-ui, sans-serif';
    g.fillText(b.lb, b.x + b.w/2, b.y + b.h/2);
  }
  g.restore();
}

// 오른쪽 칸 위 빈 자리에 이름을 넣는다 (사용자 지시, ss.jpg 자리).
// 버튼 묶음이 세로 가운데 정렬이라 위아래에 빈 공간이 남는다.
// 색 버튼에서 끌어오는 중인 공 — 손가락을 따라다닌다
function drawPalDrag(){
  if (!S.pal || !S.pal.moved) return;
  const r = ballR(), x = S.pal.x, y = S.pal.y, base = TONE[S.pal.c] || '#fff';
  g.save();
  g.globalAlpha = 0.85;
  const sph = g.createRadialGradient(x-r*0.34, y-r*0.38, r*0.05, x, y, r*1.06);
  sph.addColorStop(0, '#ffffff'); sph.addColorStop(0.30, base);
  sph.addColorStop(1, shade(base, 0.42));
  g.fillStyle = sph;
  g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  g.strokeStyle = '#ffdd33'; g.lineWidth = Math.max(2, r*0.30);
  g.beginPath(); g.arc(x, y, r + g.lineWidth*0.7, 0, 7); g.stroke();
  g.restore();
}

function drawBrand(){
  // ★ 사용자 2026-08-11: '상단 로고가 많이 차지하는데 로고 만들고 BSsystem 이라고
  //   하고 위로 조금 올리면 공간이 나오지 않을까요.'
  //   세 줄(BILLIARDS/ASSISTANT/SYSTEM) 이 세로를 많이 먹어 버튼이 작아졌다.
  //   **공 하나 + 한 줄** 로 줄이고 위로 붙인다. 그림 파일이 아니라 캔버스로 그린다 —
  //   해상도에 안 흐려지고 파일도 안 늘어난다.
  if (!PANEL || !BTN.length) return;
  const top = Math.min(...BTN.filter(b => b.x >= PANEL.x).map(b => b.y));
  const room = top - PANEL.y;
  if (room < 14) return;
  const cx = PANEL.x + PANEL.w / 2;
  // 이름이 놓이는 높이. 위 여백과 아래 여백을 나누는 비율이다.
  // ⚠️ 0.60 → 0.42 로 올렸더니 위에 딱 붙었다 (사용자: '아주 조금만 내려보세요,
  //    상단 여백을 아주 조금만'). 0.52 로 살짝 내린다.
  const cy = PANEL.y + room * 0.52;
  const face = 'px Georgia, "Times New Roman", serif';
  let fs = Math.min(room * 0.42, PANEL.w * 0.20);
  g.save();
  g.textAlign = 'left'; g.textBaseline = 'middle';
  const gap = () => fs * 0.42;                     // 공과 글자 사이
  const R = () => fs * 0.46;                       // 공 반지름
  const width = () => { g.font = 'italic 700 ' + Math.round(fs) + face;
                        return R()*2 + gap() + g.measureText('BSsystem').width; };
  for (let k = 0; k < 14 && width() > PANEL.w * 0.90 && fs > 8; k++) fs *= 0.92;
  if (fs < 8){ g.restore(); return; }
  const w = width(), bx = cx - w/2 + R(), tx = cx - w/2 + R()*2 + gap();
  // ★ 사용자 2026-08-11: '로고 테두리 노랑, 가운데 빨강, 안쪽 흰색 —
  //   **공 색깔을 넣어보자**는 의미입니다.' 3쿠션에서 쓰는 세 공이 한 표시에 다 들어간다.
  //   색은 앱에서 공을 그리는 값(TONE)을 그대로 쓴다 — 화면과 로고가 따로 놀지 않게.
  const rr = R();
  [[1.00, TONE.yellow], [0.70, TONE.red], [0.40, TONE.white]].forEach(([k, col], i) => {
    // 각 고리마다 살짝 구면 음영을 준다 (평면 과녁이 아니라 공으로 보이게)
    const sph = g.createRadialGradient(bx - rr*k*0.35, cy - rr*k*0.38, rr*k*0.05,
                                       bx, cy, rr*k*1.05);
    sph.addColorStop(0, '#ffffff');
    sph.addColorStop(i === 2 ? 0.34 : 0.30, col);
    sph.addColorStop(1, shade(col, 0.62));
    g.fillStyle = sph;
    g.beginPath(); g.arc(bx, cy, rr*k, 0, 7); g.fill();
  });
  g.strokeStyle = '#14161a'; g.lineWidth = Math.max(1, rr*0.09);
  g.beginPath(); g.arc(bx, cy, rr, 0, 7); g.stroke();
  // ⚠️ 폰에서는 화면이 어두워 반투명이 더 죽는다 (사용자 지적). 불투명 흰색에
  //    옅은 그림자를 둬서 뜨게 한다.
  g.shadowColor = 'rgba(0,0,0,0.85)';
  g.shadowBlur = Math.max(2, fs*0.18);
  g.font = 'italic 700 ' + Math.round(fs) + face;
  g.fillStyle = '#ffffff';
  g.fillText('BSsystem', tx, cy);
  g.shadowBlur = 0;
  g.restore();
}

// ---------------------------------------------------------------- 번호 판독
// 프레임 위의 한 점(mm, 접기 전 기준) → 그 레일 위 위치 t 와 레일 이름.
function frameParam(mm){
  const off = T.frame_offset, e = 1.0;
  if (Math.abs(mm[1] + off) < e)              return {rail:'bottom', t: mm[0]/T.width};
  if (Math.abs(mm[1] - (T.height+off)) < e)   return {rail:'top',    t: mm[0]/T.width};
  if (Math.abs(mm[0] + off) < e)              return {rail:'left',   t: mm[1]/T.height};
  if (Math.abs(mm[0] - (T.width+off)) < e)    return {rail:'right',  t: mm[1]/T.height};
  return null;
}

// 쿠션 날(노즈) 위의 한 점 → 그 레일 위 위치 t. 3쿠션 눈금은 프레임이 아니라
// **쿠션 위**에 있다 (five_half_numbers.json 의 reference = rail).
function railParam(mm){
  const e = 2.0;
  if (Math.abs(mm[1]) < e)            return {rail:'bottom', t: mm[0]/T.width};
  if (Math.abs(mm[1]-T.height) < e)   return {rail:'top',    t: mm[0]/T.width};
  if (Math.abs(mm[0]) < e)            return {rail:'left',   t: mm[1]/T.height};
  if (Math.abs(mm[0]-T.width) < e)    return {rail:'right',  t: mm[1]/T.height};
  return null;
}

// 번호표에서 그 자리의 값을 읽는다 (점 사이는 직선 보간).
// 레일의 t 끝(0/1)에서 맞닿는 이웃 레일과 그쪽 끝
//   bottom t: 0=좌하 1=우하   right t: 0=우하 1=우상
//   top    t: 0=좌상 1=우상   left  t: 0=좌하 1=좌상
const CORNER_NEXT = {
  'bottom:1': ['right', 0], 'right:0': ['bottom', 1],
  'right:1' : ['top', 1],   'top:1'  : ['right', 1],
  'top:0'   : ['left', 1],  'left:1' : ['top', 0],
  'left:0'  : ['bottom', 0],'bottom:0': ['left', 0]
};

function readScale(name, rail, t, clampEnds){
  const sc = SCALES.find(s => s.name === name);
  if (!sc) return null;
  const n = (rail === 'bottom' || rail === 'top') ? 8 : 4;
  const pts = sc.points.filter(p => p.rail === rail)
                       .map(p => [p.index / n, p.number])
                       .sort((a,b) => a[0]-b[0]);
  if (pts.length < 2) return null;
  // ⚠️ 코너각은 모두 수구수 50 이다 (사용자 확정) — 모서리에서 만나는 양쪽 끝
  //    포인트 사이 공간을 전부 그 값으로 본다. 다만 **두 레일의 끝값이 같은
  //    모서리에서만** 그렇다. 아무 끝이나 늘리면 없는 값을 지어내게 된다
  //    (우측 레일 반대쪽 끝은 100 이라 늘리면 100 이 나와 버렸다).
  // ⚠️ 끝점과 **정확히** 같은 자리는 범위 밖이 아니다. 그 값을 그대로 준다
  //    (전엔 t=1.00 에서 null 이 나와 마지막 눈금을 못 읽었다).
  if (t === pts[0][0]) return pts[0][1];
  if (t === pts[pts.length-1][0]) return pts[pts.length-1][1];
  if (t < pts[0][0] || t > pts[pts.length-1][0]){
    if (!clampEnds) return null;
    const lo = t <= pts[0][0];
    const mine = lo ? pts[0][1] : pts[pts.length-1][1];
    const nb = CORNER_NEXT[rail + ':' + (lo ? 0 : 1)];
    if (!nb) return null;
    const np = sc.points.filter(q => q.rail === nb[0]);
    if (!np.length) return null;
    const idx = np.map(q => q.index);
    const other = nb[1] ? Math.max(...idx) : Math.min(...idx);
    const val = np.find(q => q.index === other).number;
    return val === mine ? mine : null;
  }
  for (let i = 0; i < pts.length-1; i++)
    if (t >= pts[i][0] && t <= pts[i+1][0]){
      const k = (t - pts[i][0]) / (pts[i+1][0] - pts[i][0]);
      return pts[i][1] + k * (pts[i+1][1] - pts[i][1]);
    }
  return null;
}

// 조준선에서 수구수 · 1쿠션수 · 3쿠션수를 읽는다.
// ⚠️ 3쿠션수는 재는 게 아니라 **수구수 − 1쿠션수** 다 (CLAUDE.md 확정 공식).
// 어떤 점에서 어떤 방향으로 쏘았을 때 **프레임**(포인트가 찍힌 나무 띠)과 만나는 자리.
// ⚠️ 네 변의 연장선 중 아무거나 잡으면 안 된다. 만나는 자리가 프레임 사각형 **안**에
//    있는 것만 고른다 (코너 밖으로 나가는 교점을 잡으면 눈금이 엉뚱하게 읽힌다).
function frameHit(from, d){
  const off = T.frame_offset, n = Math.hypot(d[0], d[1]);
  if (n < 1e-9) return null;
  const dx = d[0]/n, dy = d[1]/n;
  const x0 = -off, x1 = T.width + off, y0 = -off, y1 = T.height + off, e = 1e-6;
  const cand = [];
  if (dy < -e) cand.push((y0 - from[1]) / dy);
  if (dy >  e) cand.push((y1 - from[1]) / dy);
  if (dx < -e) cand.push((x0 - from[0]) / dx);
  if (dx >  e) cand.push((x1 - from[0]) / dx);
  let best = null;
  for (const t of cand){
    if (t <= 1e-6) continue;
    const q = [from[0] + dx*t, from[1] + dy*t];
    if (q[0] < x0 - 1 || q[0] > x1 + 1 || q[1] < y0 - 1 || q[1] > y1 + 1) continue;
    if (best === null || t < best[0]) best = [t, q];
  }
  return best ? best[1] : null;
}

function systemNumbers(){
  const b = systemBase();
  if (!b) return null;
  const o = orientation();
  const from = b.from, dir = b.dir, hits = b.hits;

  // 1쿠션수 — 기준선을 앞으로 늘려 프레임과 만나는 자리
  const fw = frameHit(from, dir);
  const fa = fw ? frameParam(fold(o, fw)) : null;
  const first = fa ? readScale('first_cushion', fa.rail, fa.t) : null;

  // 수구수 — **반대쪽으로** 늘려 프레임과 만나는 자리 (코너 = 50)
  const bw = frameHit(from, [-dir[0], -dir[1]]);
  const fb = bw ? frameParam(fold(o, bw)) : null;
  const start = fb ? readScale('start', fb.rail, fb.t, true) : null;

  // ⚠️ 3쿠션수를 '수구수 − 1쿠션수' 로 계산하면 안 된다 (사용자 지적).
  //    그건 시스템이 **예상하는** 값이고, 화면에 안내해야 하는 것은 공이 실제로
  //    도착하는 자리다. 실측 반사표로 굴린 궤적의 3쿠션 접점을 쿠션 위 눈금
  //    (third_cushion, reference=rail) 에서 읽는다.
  // ⚠️ hits 가 아니라 **arrival** 에서 읽는다 — 공이 실제로 가는 경로다 (24.jpg).
  //    ★ 사용자 확정 2026-08-11: '장 하단 그린 폰트가 3쿠션 숫자입니다.'
  //      그 눈금은 장쿠션에만 있으므로, 3쿠션째 접점이 단쿠션이면 읽을 것이 없다.
  const arr = b.arrival;
  let third = null;
  if (arr && arr.length >= 3){
    const r = railParam(fold(o, arr[2].p));
    if (r) third = readScale('third_cushion', r.rail, r.t);
  }
  return {start, first, third};
}

// 카메라 버튼 위 판독창 — 수구수 / 1쿠션 / 3쿠션
function drawReadout(){
  if (!READOUT) return;
  const r = READOUT;
  // ★ 시스템에 따라 판독창 내용이 바뀐다. 탭하면 돈다 (사용자 지시 2026-08-11).
  //   파이브앤하프  수구수 | 1쿠션 | 3쿠션      출발 · 조준 · 도착
  //   2뱅크 곱셈    출발값 | 1쿠션 | 2쿠션값    〃 (1쿠션위치값 = 2쿠션값 × 출발값)
  const sys = curSystem();
  let cols;
  if (sys === 2){
    // ★ 교본 표준 1단계 — 기울기를 그대로 보여 준다 (반영계획.md).
    //   맞는지 눈으로 확인되면 여기서 두께·팁수를 낸다.
    const sl = slopes();
    // ★ 교본 더불횡단 (책 145·148쪽) —
    //     두께 = 기울기 ÷ 2  (8등분 기준)
    //     팁수 = (1적구_2적구 기울기) − (수구_1적구 기울기) + 2
    //   책의 예: 1 − 3 + 2 = 0팁
    const th  = (sl && sl.cue1 !== null) ? sl.cue1 / 2 : null;
    const tip = (sl && sl.cue1 !== null && sl.o12 !== null) ? sl.o12 - sl.cue1 + 2 : null;
    // ★ 사용자 2026-08-12: '범례가 잘리니 수 원1 원2 이렇게 표시해 주세요,
    //   동그라미 안에 숫자표시.'  수구 = 수, 1적구 = ①, 2적구 = ②
    cols = [['수 — ①', sl && sl.cue1], ['① — ②', sl && sl.o12],
            ['두께/8', th], ['팁수', tip]];
  } else if (sys === 1){
    const tb = twoBank();
    cols = [['출발값', tb && tb.start], ['1쿠션', tb && tb.first], ['2쿠션', tb && tb.second]];
  } else {
    const n = systemNumbers();
    cols = [['수구수', n && n.start], ['1쿠션', n && n.first], ['3쿠션', n && n.third]];
  }
  // ⚠️ 어두우면 안 보인다 (사용자 지적). 버튼과 같은 무게로 띄운다.
  const bg = g.createLinearGradient(0, r.y, 0, r.y + r.h);
  bg.addColorStop(0, '#6c7683'); bg.addColorStop(0.5, '#49505b'); bg.addColorStop(1, '#323841');
  g.fillStyle = bg;
  round(r.x, r.y, r.w, r.h, r.h*0.14); g.fill();
  g.strokeStyle = '#0f1114'; g.lineWidth = Math.max(2, r.h*0.06); g.stroke();
  g.strokeStyle = 'rgba(228,235,245,0.80)'; g.lineWidth = Math.max(1, r.h*0.026); g.stroke();
  g.textAlign = 'center';
  // 어느 시스템을 보고 있는지 — 탭하면 바뀐다는 표시도 겸한다.
  // 2뱅크일 때 노란 글씨라 한눈에 갈린다.
  g.textBaseline = 'top';
  g.fillStyle = sys === 2 ? '#7ee08a' : sys === 1 ? '#ffd400' : 'rgba(238,243,250,0.60)';
  g.font = '800 ' + Math.round(r.h*0.20) + 'px system-ui, sans-serif';
  g.fillText((S.sysMode ? '' : '자동 · ') + SYS_NAMES[sys] + ' ▸',
             r.x + r.w/2, r.y + r.h*0.04);
  if (sys === 1){                       // 팁 가이드 — 무회전이 기본, 안 되면 회전
    const tg = tipGuide();
    g.textAlign = 'right';
    g.font = '800 ' + Math.round(r.h*0.19) + 'px system-ui, sans-serif';
    let txt = '—', col = '#8b93a0';
    if (tg && tg.ok){                       // 지금 당점으로 닿는다
      txt = tg.tip < 0.25 ? '무회전 ○' : tg.tip.toFixed(1) + '팁 ○'; col = '#6eeb5a';
    } else if (tg && tg.tip !== null){      // 안 닿는다 — 이 팁이면 닿는다
      txt = '→ ' + (tg.tip < 0.25 ? '무회전' : tg.tip.toFixed(1) + '팁'); col = '#ffd400';
    }
    g.fillStyle = col;
    g.fillText(txt, r.x + r.w - r.h*0.10, r.y + r.h*0.04);
    g.textAlign = 'center';
  }
  cols.forEach(([lb, v], i) => {
    const cx = r.x + r.w*(i + 0.5)/cols.length;   // 칸 수는 모드마다 다르다 (기울기는 4칸)
    g.textBaseline = 'top';
    g.fillStyle = 'rgba(238,243,250,0.92)';
    // ⚠️ 범례도 칸에 안 들어가면 잘린다 (사용자 지적 2026-08-12). 값과 같은 방식으로 줄인다.
    let lf = r.h*0.19;
    for (let k = 0; k < 12; k++){
      g.font = '700 ' + Math.round(lf) + 'px system-ui, sans-serif';
      if (g.measureText(lb).width <= r.w/cols.length * 0.92 || lf < 7) break;
      lf *= 0.92;
    }
    g.fillText(lb, cx, r.y + r.h*0.30);
    g.textBaseline = 'bottom';
    g.fillStyle = v === null || v === undefined ? '#8b93a0' : '#ffffff';
    g.font = '800 ' + Math.round(r.h*0.50) + 'px system-ui, sans-serif';
    const txt = (v === null || v === undefined) ? '—'
              : (sys >= 1 ? (Math.round(v*10)/10).toFixed(1) : String(Math.round(v)));
    // ⚠️ 2뱅크는 소수점이 들어가 세 값이 붙어 '1.63.11.9' 로 읽혔다 (사용자 지적 31.jpg).
    //    칸 안에 들어갈 때까지 글자를 줄인다.
    let vf = r.h*0.50;
    for (let k = 0; k < 10; k++){
      g.font = '800 ' + Math.round(vf) + 'px system-ui, sans-serif';
      if (g.measureText(txt).width <= r.w/cols.length - r.h*0.14 || vf < 9) break;
      vf *= 0.92;
    }
    g.fillText(txt, cx, r.y + r.h*0.95);
    if (i < 2){
      g.strokeStyle = 'rgba(228,235,245,0.45)'; g.lineWidth = Math.max(1, r.h*0.022);
      g.beginPath();
      g.moveTo(r.x + r.w*(i+1)/3, r.y + r.h*0.32);
      g.lineTo(r.x + r.w*(i+1)/3, r.y + r.h*0.88); g.stroke();
    }
  });
}

function drawButtons(){
  g.textAlign = 'center'; g.textBaseline = 'middle';
  // 보정(- 0 +) 은 한 덩어리 금속 바로 보이게 뒤판을 먼저 깐다 (design.png 방향)
  const cb = BTN.filter(b => ['-','0','+'].includes(b.lb));
  if (cb.length === 3){
    const x0 = Math.min(...cb.map(b => b.x)), x1 = Math.max(...cb.map(b => b.x+b.w));
    const y0 = cb[0].y, hh = cb[0].h, pad = hh*0.14;
    const bar = g.createLinearGradient(0, y0-pad, 0, y0+hh+pad);
    bar.addColorStop(0, '#e9edf3'); bar.addColorStop(0.5, '#b9c0cb');
    bar.addColorStop(1, '#8f97a4');
    g.fillStyle = bar;
    round(x0-pad, y0-pad, x1-x0+pad*2, hh+pad*2, hh*0.30); g.fill();
    g.strokeStyle = '#0f1114'; g.lineWidth = Math.max(2, hh*0.07); g.stroke();
  }
  // ⚠️ 글자에 검은 테두리를 덧그려 굵게 보이게 한다. 캔버스 폰트 굵기는 900 이 최대라
  //    '1100' 같은 값을 쓰면 폰트 지정이 통째로 무효가 된다 (사용자 요청 반영 방식).
  const heavy = (txt, cx, cy, size, fill) => {
    g.font = '900 ' + Math.round(size) + 'px system-ui, sans-serif';
    g.lineJoin = 'round';
    g.strokeStyle = '#14161a'; g.lineWidth = Math.max(3, size*0.16);
    g.strokeText(txt, cx, cy);
    g.fillStyle = fill; g.fillText(txt, cx, cy);
  };
  for (const b of BTN){
    const cx = b.x+b.w/2, cy = b.y+b.h/2, u = Math.min(b.w, b.h);
    const armed = S.place === b.lb;
    const onBar = ['-','0','+'].includes(b.lb);
    const rnd = b.lb === 'cam' ? Math.max(b.w,b.h)*0.5 : u*0.22;   // 카메라는 원형
    if (onBar){                                    // 바 위 칸 — 살짝 눌린 느낌만
      g.fillStyle = 'rgba(255,255,255,0.55)';
      round(b.x,b.y,b.w,b.h,u*0.26); g.fill();
      g.strokeStyle = 'rgba(15,17,20,0.55)'; g.lineWidth = Math.max(1.5, u*0.035); g.stroke();
    } else {
      const face = g.createLinearGradient(0, b.y, 0, b.y+b.h);
      if (b.lb === 'cam'){ face.addColorStop(0,'#f2f5f9'); face.addColorStop(0.5,'#c6cdd8');
                           face.addColorStop(1,'#98a1af'); }
      else if (armed)    { face.addColorStop(0,'#ffeeb4'); face.addColorStop(1,'#e8c46a'); }
      else               { face.addColorStop(0,'#f4f6fa'); face.addColorStop(1,'#cfd5df'); }
      g.fillStyle = face;
      round(b.x,b.y,b.w,b.h,rnd); g.fill();
      g.strokeStyle = '#0f1114'; g.lineWidth = Math.max(2, u*0.06); g.stroke();
      if (armed){ g.strokeStyle = '#c8931a'; g.lineWidth = Math.max(2, u*0.03); g.stroke(); }
    }

    if (b.lb === 'cam'){
      if (previewOn()){                           // 미리보기 중 — 검정·빨강 셔터
        g.fillStyle = '#14161a';
        g.beginPath(); g.arc(cx, cy, u*0.36, 0, 7); g.fill();
        g.strokeStyle = '#d8322b'; g.lineWidth = Math.max(3, u*0.10);
        g.beginPath(); g.arc(cx, cy, u*0.25, 0, 7); g.stroke();
        g.fillStyle = '#d8322b';
        g.beginPath(); g.arc(cx, cy, u*0.11, 0, 7); g.fill();
      } else {
        camIcon(cx, cy, u*0.86);
        g.fillStyle = '#d8322b';                   // 셔터 표시 (design.png)
        g.beginPath(); g.arc(cx, cy + u*0.40, u*0.075, 0, 7); g.fill();
        g.strokeStyle = '#0f1114'; g.lineWidth = Math.max(1.5, u*0.02); g.stroke();
      }
      continue;
    }
    if (b.lb === 'exit'){                          // 종료 — L 과 같은 글씨체 (사용자 지시)
      heavy('X', cx, cy, u*0.60, '#e05a52');
      continue;
    }
    if (b.lb === 'reset'){                         // L / A / R — 색 그대로, 굵고 크게
      heavy(R_LABELS[S.rMode], cx, cy, u*0.66, '#e8607f');
      continue;
    }
    // ★ 세기 — 막대 셋. 탭하면 중 → 강 → 약 → 중 … (기본이 중이라 (n+1)%3 이 그 순서)
    // ★ 사용자 2026-08-11 (ss.jpg): '각각의 컬러는 넣지 말고 기본은 흰색에 검은 테두리,
    //   지정된 세기는 빨간색. 글자는 노란색에 검은 테두리로 하고 **그래프 아래에
    //   따라다니게**. 지금 핸드폰으로는 글자가 보이지도 않습니다.'
    //   → 단계별 색을 없앤다. 고른 칸만 빨강, 나머지는 흰색.
    //     글자는 고른 막대 **바로 아래**에 붙어 같이 움직인다.
    if (b.lb === 'power'){
      const n = S.power, bw2 = u*0.16, gap = u*0.09, hs = [0.20, 0.30, 0.40];
      const x0 = cx - (bw2*3 + gap*2)/2;
      const base = cy - u*0.02;                    // 막대 바닥 — 글자 자리를 아래에 비운다
      for (let i = 0; i < 3; i++){
        const hh = u*hs[i];
        g.fillStyle = (i === n) ? POWER_ON : POWER_OFF;
        round(x0 + i*(bw2+gap), base - hh, bw2, hh, bw2*0.28); g.fill();
        g.strokeStyle = '#14161a'; g.lineWidth = Math.max(1.5, u*0.035); g.stroke();
      }
      // 고른 막대 바로 아래에 글자 — 노란색 + 검은 테두리
      heavy(POWER_KR[n], x0 + n*(bw2+gap) + bw2/2, cy + u*0.28, u*0.34, POWER_TXT);
      continue;
    }
    // ★ 경로추천 — 갈라지는 경로 셋 + '추천' 글자 (사용자 지시)
    if (b.lb === 'suggest'){
      g.lineCap = 'round'; g.lineJoin = 'round';
      const sx = cx - u*0.28, sy = cy - u*0.10;
      [[[0.22,-0.20],[0.56,-0.02]], [[0.18,0.02],[0.54,-0.28]], [[0.28,0.18],[0.54,0.14]]]
        .forEach((pp, i) => {
          g.strokeStyle = '#14161a';               // 검은 테두리로 한 번 (색을 띄운다)
          g.lineWidth = Math.max(4, u*0.125);
          g.beginPath(); g.moveTo(sx, sy);
          g.lineTo(sx + u*pp[0][0], sy + u*pp[0][1]);
          g.lineTo(sx + u*pp[1][0], sy + u*pp[1][1]); g.stroke();
          g.strokeStyle = ['#1e6ff0','#ff8a00','#00b34a'][i];
          g.lineWidth = Math.max(2.5, u*0.075);
          g.stroke();
        });
      g.fillStyle = '#f2f1ea';                     // 출발 공
      g.beginPath(); g.arc(sx, sy, u*0.09, 0, 7); g.fill();
      g.strokeStyle = '#14161a'; g.lineWidth = Math.max(1.5, u*0.035); g.stroke();
      // ★ 몇 번째 경로를 보고 있는지 + 그 경로의 허용오차 (사용자 승인 2026-08-11).
      //   허용오차가 곧 난이도다 — 3.2도짜리와 0.4도짜리는 다른 샷이다.
      const rl = routesReady(), ns = rl ? Math.min(rl.length, ROUTE_SHOW) : 0;
      if (rl && S.routeIx >= 0 && rl[S.routeIx]){
        heavy((S.routeIx+1) + '/' + ns, cx, cy + u*0.24, u*0.27, '#ffd400');
        heavy(rl[S.routeIx].w.toFixed(2) + '도', cx, cy + u*0.46, u*0.22, '#f2f4f8');
      } else {
        heavy('추천', cx, cy + u*0.24, u*0.27, '#f2f4f8');
        heavy(rl ? (ns ? ns + '개' : '없음') : '', cx, cy + u*0.46, u*0.22,
              rl && !ns ? '#ff8a80' : '#9fb0c4');
      }
      continue;
    }
    if (b.lb === 'swap' || ['white','yellow','red'].includes(b.lb)){
      g.fillStyle = TONE[b.lb === 'swap' ? (S.cueWhite ? 'white' : 'yellow') : b.lb];
      g.beginPath(); g.arc(cx, cy, u*0.30, 0, 7); g.fill();
      g.strokeStyle = '#14161a'; g.lineWidth = Math.max(2, u*0.07); g.stroke();
      if (b.lb === 'swap'){                        // 수구 표시 — 바깥 링
        g.strokeStyle = '#c8931a'; g.lineWidth = Math.max(2, u*0.055);
        g.beginPath(); g.arc(cx, cy, u*0.39, 0, 7); g.stroke();
      }
      continue;
    }
    if (b.lb === '0'){                             // 보정 값 — 부호를 색으로 (사용자 확정)
      // 0 일 때는 부호가 없으므로 - + 와 같은 색으로 둔다 (사용자 지시).
      heavy(String(Math.abs(S.corr)), cx, cy, u*0.58,
            S.corr < 0 ? '#ff5fa8' : '#f2f4f8');
    } else {
      heavy(b.lb, cx, cy, u*0.62, '#f2f4f8');
    }
  }
}
function bwLine(){ return Math.round(BW * 0.05); }
function round(x,y,w,h,r){
  r = Math.max(0, Math.min(r, w/2, h/2));   // ⚠️ 음수·과대 반지름이면 arcTo 가 죽는다
  g.beginPath(); g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function camIcon(cx,cy,h){
  // 몸체 + 뷰파인더 돌출부 + 두 겹 렌즈 + 플래시. 전부 검은 선 (사용자 지시).
  const w = h*0.62, bh = h*0.42, r = h*0.09;
  const x = cx - w/2, y = cy - bh/2 + h*0.04;
  g.lineJoin = 'round';
  g.fillStyle = '#f7f9fc';
  g.strokeStyle = '#14161a'; g.lineWidth = Math.max(2, h*0.055);
  round(x + w*0.24, y - h*0.10, w*0.30, h*0.12, r*0.5); g.fill(); g.stroke();
  round(x, y, w, bh, r); g.fill(); g.stroke();
  g.beginPath(); g.arc(cx, y + bh/2, bh*0.31, 0, 7);
  g.fillStyle = '#c9d2de'; g.fill(); g.stroke();
  g.beginPath(); g.arc(cx, y + bh/2, bh*0.15, 0, 7);
  g.fillStyle = '#14161a'; g.fill();
  g.beginPath(); g.arc(x + w*0.13, y + bh*0.26, h*0.035, 0, 7);
  g.fillStyle = '#14161a'; g.fill();
}

//    (사용자 지적). 그래서 **화면 안에서 직접 촬영**한다 — 누르는 순간 찍히고

// 지금은 **기본이 진짜 카메라**다. 시험 모드로 보려면 아래 false 를 true 로 바꾼다.

//    주소에 붙인 값이 사라진다 (2026-08-09 에 이것 때문에 카메라가 켜졌다).
const TEST_MODE = false;

// (v52 에서 191914 / 192004 를 확인했고 둘 다 3개 — 이제 전부 본다)
const TEST_ONLY = [];

async function nextTestPhoto(){
  if (!TEST.list){
    const all = await fetch('test/photos/list.json').then(r => r.json());
    TEST.list = TEST_ONLY.length ? all.filter(n => TEST_ONLY.includes(n)) : all;
  }
  // ⚠️ 한 바퀴 돌면 멈춘다. 계속 반복하면 어디까지 봤는지 알 수 없다 (사용자 요청).
  if (TEST.i + 1 >= TEST.list.length){
    TEST.done = true;
    msg.style.display = 'block';
    msg.textContent = '완료 — ' + TEST.list.length + '장 다 봤습니다';

async function shoot(){
  if (TEST.on){
    if (TEST.img){ const img = TEST.img; TEST.img = null; usePhoto(img); return; }
    try { await nextTestPhoto(); }
    catch(e){ msg.style.display='block'; msg.textContent = '시험 사진을 못 읽었습니다: ' + e; }
    return;
  }
  if (CAMLIVE) { capture(); return; }             // 미리보기 중이면 찍는다
  try{
    CAMSTREAM = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: {ideal: 'environment'},
              width: {ideal: 1920}, height: {ideal: 1080}}, audio: false});
    VID.srcObject = CAMSTREAM;
    await VID.play();
    CAMLIVE = true;
    msg.style.display = 'block';
    msg.textContent = '오른쪽 흰 버튼을 누르면 찍힙니다';
    setTimeout(() => { if (CAMLIVE) { msg.textContent=''; msg.style.display='none'; } }, 2500);
  }catch(e){
    msg.style.display = 'block';
    msg.textContent = '카메라를 못 열었습니다: ' + e.name;
  }
}

function capture(){
  const cn = document.createElement('canvas');
  cn.width = VID.videoWidth; cn.height = VID.videoHeight;
  cn.getContext('2d').drawImage(VID, 0, 0);
  stopCam();
  const img = new Image();
  img.onload = () => usePhoto(img);
  img.src = cn.toDataURL('image/jpeg', 0.9);
}

function stopCam(){
  CAMLIVE = false;
  if (CAMSTREAM){ CAMSTREAM.getTracks().forEach(t => t.stop()); CAMSTREAM = null; }
}

const BALL_SCAN_W = 1400;                        // 공을 찾을 해상도 (사진 15장으로 맞춤)

// 사진에서 공을 찾아 그대로 놓는다. 픽셀은 원본에서 그대로 가져온다.
function ballsFromPhoto(img, quad){
  const sw = Math.min(img.width, BALL_SCAN_W);
  const sh = Math.max(1, Math.round(img.height / img.width * sw));
  const cn = document.createElement('canvas');
  cn.width = sw; cn.height = sh;
  const cg = cn.getContext('2d', {willReadFrequently:true});
  cg.drawImage(img, 0, 0, sw, sh);
  const k = sw / img.width;
  return ballsFromPixels(cg.getImageData(0,0,sw,sh).data, sw, sh,
                         quad.map(q => [q[0]*k, q[1]*k]),
                         T.width, T.height, T.ball_diameter);
}

// 나무 안쪽 선(천 경계) → 쿠션 날(노즈) 사각형.
// ⚠️ 천 덩어리의 바깥 경계는 노즈가 아니다. 바닥천과 쿠션천이 같은 색이라 경계는
//    **천이 나무에 물리는 자리**이고, 거기서 노즈까지가 쿠션 폭이다 (사용자 제안).
function seamToNose(quad, c){
  const W = T.width, H = T.height;
  const seam = [[-c,-c],[W+c,-c],[W+c,H+c],[-c,H+c]];        // 좌하,우하,우상,좌상
  const M = homography(seam, orderQuad(quad, PHOTO && PHOTO.width, PHOTO && PHOTO.height));
  if (!M) return quad;
  return [[0,0],[W,0],[W,H],[0,H]].map(([x,y]) => applyH(M, x, y));
}

function usePhoto(img){
  PHOTO = img;
  const t0 = performance.now();
  TABLE_HULL = findTable(img);
  DIAMOND_FIT = null;
  let found = null;
  if (TABLE_HULL && TABLE_HULL.quad){
    // ⚠️ 다이아몬드 보정(refineQuad)은 안 쓴다 — 다이아몬드는 천 평면이 아니라
    //    레일 윗면에 있어 호모그래피 하나로 같이 못 맞춘다 (2026-08-08 확인).
    //    대신 천 경계를 쿠션 폭만큼 줄여 노즈를 만든다.
    TABLE_HULL.quad = seamToNose(TABLE_HULL.quad, T.cushion_width);
    // 편 사진은 이제 안 그리므로 만들지도 않는다 (700x350 픽셀 반복이라 폰에서 느리다)
    try { found = ballsFromPhoto(img, TABLE_HULL.quad); }
    catch(e){ log('공 찾기 실패 ' + e); }
  }
  WARPED = null;

  // ⚠️ 사진을 읽어와도 궤적은 만들지 않는다 (사용자 확정). 공만 놓는다.
  let n = 0;
  if (found){
    S.balls = {}; S.aim = null;
    for (const c of ['white','yellow','red'])
      if (found[c]){                             // 겹쳐 읽혔으면 밀어낸다
        S.balls[roleOf(c)] = {p: separate(roleOf(c), found[c]), color: c}; n++; }
    if (n) blink();                            // 찍고 돌아오면 3초간 깜박인다
  }
  msg.style.display = 'block';
  const who = TEST.on && TEST.name ? TEST.name + ' · ' : '';
  const last = TEST.on && TEST.list && TEST.i + 1 >= TEST.list.length;
  msg.textContent = TABLE_HULL
    ? who + '당구대 찾음 · 공 ' + n + '개' + (last ? '  —  완료' : '')
    : who + '★당구대를 못 찾음' + (last ? '  —  완료' : '');
  setTimeout(() => { msg.textContent=''; msg.style.display='none'; }, 2500);
}

function resize(){
  // ⚠️ innerWidth/innerHeight 로 잡으면 안 된다. 폰 브라우저는 주소창이 접혔다
  //    폈다 하면서 실제 보이는 높이가 달라져 당구대가 화면 밖으로 잘린다.
  //    캔버스가 **실제로 차지한 크기**를 재서 쓴다.
  const r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * devicePixelRatio);
  cv.height = Math.round(r.height * devicePixelRatio);
  g.setTransform(1,0,0,1,0,0);
}
addEventListener('orientationchange', () => setTimeout(resize, 200));
if (window.visualViewport) visualViewport.addEventListener('resize', resize);
addEventListener('resize', resize);
const pos = e => {
  const t = e.touches ? e.touches[0] : e;
  const x = t.clientX*devicePixelRatio, y = t.clientY*devicePixelRatio;
  return ROT ? [cv.height - y, x] : [x, y];      // 눕혀 그렸으면 손가락도 되돌린다
};
// ⚠️ 끌어다 놓기가 '됐다 안 됐다' 하던 이유 (사용자 지적 2026-08-10)
//   ① touch-action 이 캔버스에 없었다 (위 CSS 참고)
//   ② 포인터를 잡아두지 않아, 손가락이 빨리 움직이면 pointermove 가 다른 데로 간다
//   ③ pointercancel 을 안 받아서, 브라우저가 제스처를 채가면 up() 이 영영 안 불린다
//      → S.pal 이 남아 다음 탭이 이상해진다. 이게 '안 될 때' 의 정체다.
cv.addEventListener('pointerdown', e => {
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
  down(...pos(e));
});
cv.addEventListener('pointermove', e => { move(...pos(e)); });
addEventListener('pointerup', e => up(...pos(e)));
// 브라우저가 가로채면 놓지 말고 **그냥 취소**한다 (엉뚱한 자리에 공이 놓이면 안 된다)
function cancelTouch(){ S.pal = null; S.drag = null; S.aiming = false; }
cv.addEventListener('pointercancel', cancelTouch);

    SEP = sep.cue_ball.by_tip.table;   // [두께, 상단3·2·1팁, 중단, 하단1·2·3팁]
    SEP_OBJ = sep.object_ball.table.map(r => [r[0], r[1]]);
    POST_CUSHIONS = spd['★_몇_쿠션까지_구르나']['★_충돌_후_그리는_쿠션'].table;
    msg.textContent = ''; msg.style.display = 'none';
    log('데이터 OK — 당구대 ' + T.width + 'x' + T.height);
    const mA = location.search.match(/[?&]a=(\d{2})/);
    if (mA && LAYOUTS[mA[1]]){
      ANSWER = mA[1];
      log('정답 배치 ' + ANSWER + ' ' + LAYOUTS[ANSWER].name);
    }
    resize(); draw();
    log('그리기 시작 · 캔버스 ' + cv.width + 'x' + cv.height);
  }catch(e){
    msg.textContent = '데이터를 못 읽었습니다: ' + e;
    log('★데이터 실패 ' + e);
  }
})();
</script>
