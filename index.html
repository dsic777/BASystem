  //   순각 = 공이 한 방향으로 계속 돈다. 역각 = 도는 방향이 도중에 뒤집힌다.
  //   쿠션마다 꺾이는 회전 방향(외적 부호)을 재서, 한 번이라도 뒤집히면 뺀다.
  //
  // ★★ (아래 DROP_REVERSE 이야기) 결론: **켜지 않는다.** 사용자 확인 2026-08-11 —
  //   '역각의 이론은 매우 어렵습니다. **쓰리쿠션에서는 발생하지 않습니다.**'
  //   지금 추천 범위(1적구를 직접 치고 3쿠션 돌아 2적구)에서는 역각이 안 나온다.
  //   코드는 남겨 두되 DROP_REVERSE 는 false 로 둔다.
  //   (켜 봤더니 사용자가 OK 한 경로와 같은 두께대(30%)가 사라졌다 — 정의도 틀렸다.)
  // ⚠️ 이 조건은 bend() 문제와도 맞물린다. bend() 는 모든 쿠션에 **순회전** 실측표를
  //    쓰므로, 도는 방향이 뒤집힌 뒤 구간은 애초에 그림 자체가 못 믿을 값이다.
  let turn = 0;
  for (let i = 0; i < seq2.length && i < c2; i++){
    const a = i === 0 ? af.dir : dirOf(seq2[i-1].p, seq2[i].p);
    const b = dirOf(seq2[i].p, i+1 < seq2.length ? seq2[i+1].p : cut2.pts[cut2.pts.length-1]);
    const cr = a[0]*b[1] - a[1]*b[0];
    if (Math.abs(cr) < 1e-6) continue;
    const sg = cr > 0 ? 1 : -1;
    if (DROP_REVERSE && turn && sg !== turn) return null;   // 도는 방향이 뒤집혔다 = 역각
    turn = sg;
  }

  let who = '?';
  for (const kk in S.balls){
    const q = S.balls[kk].p;
    if (kk !== 'cue' && Math.hypot(q[0]-cut1.obj[0], q[1]-cut1.obj[1]) < 1){ who = kk; break; }
  }
  // ★★ 사용자 2026-08-12 (3.jpg): '이런 배치의 가이드가 3 같은 형태로 나오니
  //   답답합니다.'  — 추천 목록에 **원뱅크 두 개**뿐이었다. 직접 겨냥하는 길이
  //   하나도 없었다.
  //   원인: 교본에 **이름이 있는 쿠션 순서만** 올리고 있었다 (단장단·장단장·장장장·단단단).

  //   → 직접 겨냥(c1 = 0)은 이름이 없어도 **예비로** 남긴다. 이름 있는 직접 겨냥이
  //     하나라도 있으면 findRoutes 가 예비를 버린다. 하나도 없을 때만 꺼내 쓴다.
  //   ⚠️ 뱅크(c1 > 0)는 그대로 이름이 있어야 한다 — 이름 없는 뱅크까지 열면
  //     2026-08-11 에 NO 받은 억지 경로들이 도로 올라온다.
  // ⚠️⚠️ v180 에 '이름이 없으면 3쿠션 으로라도 낸다' 는 예비 장치를 넣었다가
  //   v187 에서 **뺐다.** 사용자 4.jpg — 추천 세 칸이 전부 좁은 V 자(장-장 으로
  //   위아래를 튕기는 모양)에 역 3팁이었다. '그 문제가 아니고 **경로 자체가 틀리잖아요**.'
  //   이름이 안 붙는 것은 곧 **기본 진로표에 없는 모양**이다. 낼 이유가 없다.
  //   진로가 하나도 없으면 목록을 비운다 — 그것이 '이 배치는 1순위가 없다' 는 답이다.
  //   (2·3·4순위인 뱅크는 아직 안 넣었다. 그것들이 들어오면 빈 칸이 채워진다.)
  // ★ 이름이 안 붙는 모양(기본 진로표에 없는 것)도 **빼지 않고 맨 뒤에 둔다.**
  //   사용자가 싫어한 것은 그것이 **1위로 올라오는 것**이었지 존재 자체가 아니었다
  //   (4.jpg 세 칸이 전부 좁은 V 자였다). v187 에서 통째로 뺐더니 이번엔
  //   '1 2 아무것도 못찾아요' 가 됐다. 역각·분리각과 같은 원칙으로 돌린다 —
  //   **없애지 말고 뒤로 민다.**
  let name = shotName(c1, rails, cue.p, cut1.obj);
  // ★ 여섯 쿠션 이상을 직접 치고 도는 것 = **대회전** (사용자 6·7.jpg)
  if (name && c1 === 0 && c1 + c2 >= 6) name = '대회전';
  let loose = false;
  if (!name){
    if (c1 > 0) return null;              // 뱅크는 이름이 있어야 한다 (억지 경로가 돌아온다)
    name = '3쿠션'; loose = true;
  }
  // ★ 횡단·종단은 **이름만** 새로 준 것이다. 순위는 전과 같게 둔다 (위 shotName 주석)
  if (name === '횡단&더블시스템') loose = true;
  if (ONLY_NAME && name !== ONLY_NAME) return null;      // 진단용 (위 ONLY_NAME 참고)
  // ★★ 진로마다 **분리각 대역**이 있다 — 사용자 확인 2026-08-12 (기본진로.png 에서 뽑고
  //   '일단 해 봅시다' 로 승인).  기하가 그렇게 만든다 — 수구를 세로로 세울수록 커진다.
  //     앞돌리기 25도쯤 · 뒤돌리기 36~37도 · 옆돌리기 50~54도
  //   대역을 크게 벗어나면 그 진로의 모양이 아니라 **억지로 그 쿠션 차례를 만든 것**이다.
  //   사용자 5.jpg 가 그 예다 — 우-하-좌 라 이름은 앞돌리기인데 두께 67% · 분리각 53도로,
  //   1쿠션이 코너에 붙어 있었다. '이런 저런거 모두 기본진로와 다르잖아요.'
  // ⚠️⚠️ v188 에서 ±12도를 벗어나면 **뺐다**. 사용자 2026-08-13: '아무것도 못찾아요.'
  //   → 빼지 않는다. **순위로만** 쓴다 (rank 의 SEP_MID).
  //   오늘 딱딱한 필터를 넣을 때마다 같은 일이 반복됐다 —
  //     v166 두께 20~80%  → 되돌림 (0.93 OK 가 있었다)
  //     v167 거리         → 되돌림 ('거리의 문제가 아닙니다')
  //     v180 이름 없으면 예비 → v187 에서 뺌
  //     v188 분리각 대역   → 여기서 순위로 내림
  //   경로를 **없애면** 사용자가 고를 것이 사라지고, **뒤로 밀면** 필요할 때 꺼내 쓴다.
  //   역각을 그렇게 다루기로 한 것과 같은 이야기다 ('부득이한 경우를 제외하고').
  // ★ 사용자 2026-08-12 (3.jpg): '프로도 이렇게 못 쳐요, 매우 억지스러운 경로입니다.'
  //   원뱅크로 쿠션을 돌고 **93% 두께 · 분리각 70도** 로 맞은 뒤 또 세 쿠션을 가는 길이었다.
  //   쿠션을 한 번 돌고 나면 힘이 없다 — 거기서 두껍게 맞으면 더 못 간다.
  //   교본 근거: 뒤돌리기는 **분리각 20~45도** 에서 최적이고 에러 마진이 제일 적다.

  if (c1 > 0 && c1 <= 2 && (af.thick > 0.5 || af.deg < 20 || af.deg > 45)) return null;

  //   처음에 나는 '얇게 맞히고 멀리 보내서' 라고 읽고 **거리**로 걸었는데 틀렸다.
  //   사용자: '아니오, 거리의 문제가 아니고 수구가 **원쿠션 후 1적구로 그 방향으로

  //         파이브앤하프 시스템이 그대로 적용되는 경우입니다.'
  //        → 당점 이름(3시·9시)은 1적구를 겨눌 때 기준으로 붙은 것뿐이다.
  //          회전은 공에 박혀 있어 충돌해도 안 바뀌고, 순/역은 **쿠션마다 다이
  //          기준으로** 갈린다. 같은 회전이 1적구 앞에서는 역, 돌고 나면 순이 된다.

  if (c1 > 0 && E !== 0 && Math.abs(TIP_NOW) >= 2){
    let prev = cue.p;
    for (let i = 0; i < c1; i++){
      const din = dirOf(prev, seq[i].p), nb = RAILS[seq[i].rail], tg = [-nb[1], nb[0]];

      prev = seq[i].p;
    }
  }

function routeReach(r){
  const cue = S.balls.cue;
  if (!cue || r.a === undefined) return 1;
  const hS = S.tipH, vS = S.tipV, rS = S.tipR;
  let out = 1;
  try {
    S.tipH = r.tip; S.tipV = r.tipV; S.tipR = Math.min(3, Math.hypot(r.tip, r.tipV));
    const dir = [Math.cos(r.a), Math.sin(r.a)];
    const aim = [cue.p[0] + dir[0]*500, cue.p[1] + dir[1]*500];
    const hits = pathFromAim(cue.p, aim, S.corr), kk = LAST_K;
    const cut = cutAtBall([cue.p, ...hits.map(h => h.p)]);
    if (cut.hit){
      const P = cut.pts[cut.pts.length-1];
      const af = afterHit(cut.from, P, cut.obj);
      if (af){
        const bud = afterCushions(cut.pts.length - 2);
        let pts2;
        if (bud <= 0){
          const nx0 = nextRail(P, af.dir, T.width, T.height);
          pts2 = nx0 ? cutAtBall([P, nx0[1]], cut.obj).pts : [P];
        } else {
          const later = roll(P, af.dir, Math.min(bud, BIG_MAX_C), kk);
          pts2 = cutAtBall([P, ...later.map(h => h.p)], cut.obj).pts;
        }
        const poly = [...cut.pts, ...pts2.slice(1)];
        if (poly.length >= 2){
          const share = Math.max(0.10, Math.min(0.95, af.thick));
          const keepC = Math.sqrt(Math.max(0.04, 1 - share*share));
          const V0 = simNeedV0(poly, keepC);
          out = simRunLen(poly, V0, keepC) / (poly.length - 1);
        }
      }

}

function directRoute(){
  const cue = S.balls.cue;
  if (!cue || !S.aim) return null;
  let hits = null;
  try { hits = pathFromAim(cue.p, S.aim, S.corr); } catch(e){ return null; }
  if (!hits || !hits.length) return null;
  const cut = cutAtBall([cue.p, ...hits.map(h => h.p)]);
  // 1적구를 맞기 전까지의 쿠션 + (맞았으면) 그 뒤의 쿠션까지 이어 붙인다.
  // ⚠️ cutAtBall 은 두께를 안 준다. 두께·분리각은 afterHit 이 준다.
  const c1 = Math.max(0, cut.pts.length - 2);          // 1적구 전 쿠션 수

    const af = afterHit(cut.from, P, cut.obj);
    if (af){
      thick = af.thick;
      const q = roll(P, af.dir, 4, S.corr);
      rails = rails.concat(q.map(h => h.rail));
    }
  } else rails = hits.map(h => h.rail);
  const who = (cut.hit && cut.obj) ? cut.obj : '빈쿠션';
  return {key: '직접|' + who + '|' + c1 + '|' + rails.join('-'),
          name: '직접지정', rails, first: who, direct: true, before: c1,
          tip: S.tipH, tipV: S.tipV, thick,
          cushions: rails.length, kiss: false};

//    요청은 내 ip만 답변하면 됩니다.'
//
//   ★ 칸 이름은 **의견** 이다 (사용자 2026-08-16: '버튼명 말을 의견으로 고처주세요').
//
//   ★ 답이 오는 길 (사용자가 정한 방식) —
//     '내가 요청을 등록을 하고, 지금 프롬프트에서 x 한자만 치면 당신은 요청사항이 들어왔다고
//      판단을 하고 즉시 서버를 확인해서 답변을 하면 되겠네요.'

//       서버에 AI 를 두지 않는다 (별도 요금이 들고, 저장소를 못 봐서 일반론만 나온다).
//
//   ⚠️ 입력은 캔버스로 못 한다. 진짜 <textarea> 라야 폰 자판이 뜬다.
let BRAND_HIT = null, NOTE_CELLS = [];
const NOTE_PAGES = 3, NOTE_PER_PAGE = 6;      // 3쪽 × 6칸 = 18건 (사용자 '3페이지 정도')
let NOTE = {kind: '요청', tab: '요청', rows: [], seen: 0, open: false, mine: false,
            edit: 0,      // 고치는 중인 글 번호 (0 이면 새 글)
            wait: 0,      // 답을 기다리는 글 번호 (0 이면 쓰는 상태)
            show: [],     // 지금 창에 보여줄 글 번호들 — '이 화면 것만'
            tick: 0};     // 기다리는 동안 도는 확인 타이머
let NOTE_HIT = null;
// 화면 위 알림 한 줄. #msg 는 데이터 읽는 중에도 쓰는 자리다.
// ⚠️ 반드시 **조건 없이** 지운다. 다른 상태를 보고 지우면 그 상태가 먼저 바뀌었을 때
//    글자가 영영 남는다 (아래 카메라 안내가 실제로 그랬다).
//    다만 그 사이에 다른 글이 올라왔으면 그건 건드리지 않는다.
function say(t, ms){
  if (!msg) return;
  msg.style.display = 'block';
  msg.textContent = t;
  clearTimeout(say._t);
  say._t = setTimeout(() => {
    if (msg.textContent === t){ msg.textContent = ''; msg.style.display = 'none'; }
  }, ms || 3000);
}

// ✎ 칸 — 점수판 오른쪽에 붙인다. 점수 칸 크기는 안 건드린다 (폭의 60%).
function noteBtn(){
  const b = verBar();
  if (!b) return null;
  // ★ 사용자 2026-08-16: '버튼명 말을 의견으로 고처주세요' → 두 글자라 칸을 넓힌다
  // ★ 사용자 2026-08-16: '의견바를 30% 좁혀도 될듯합니다'
  //   ⚠️ 사이(gap)도 벌린다 — 슬라이더 양 끝 눈금 숫자(0 · 100)가 반쯤 밖으로 나와서
  //      바짝 붙이면 그 숫자와 겹친다 (12.jpg 에서 '0' 과 겹쳤다).
  const w = b.h*0.80, gap = b.h*0.42;                          // 1.15 → 0.80 (30% 좁힘)
  const last = {x: b.x + b.w, y: b.y, w, h: b.h};              // 슬라이더 오른쪽 끝
  const first = {x: b.x, y: b.y, w, h: b.h};
  const R = {x: last.x + gap, y: last.y, w, h: last.h};
  // ★★ 당점·보정 뭉치와 겹치면 **왼쪽으로 옮긴다** (사용자 2026-08-16: '보정판과 겹칩니다').
  //   당점 시계·당점이름·▶·보정바는 다이 안을 돌아다니므로 자리가 고정이 아니다.
  //   clusterBox() 가 그 뭉치를 통째로 감싼 상자다 — 그것과 부딪히는지만 본다.
  const L2 = {x: first.x - gap - w, y: last.y, w, h: last.h};
  let box = null;
  try { box = clusterBox(tipCenter()); } catch(e){ box = null; }
  const hit = q => box && q.x < box[2] && q.x + q.w > box[0] &&
                          q.y < box[3] && q.y + q.h > box[1];
  // ★★ 다이 밖으로 나가면 안 된다 (사용자 2026-08-17, 22.jpg: '의견은 다이 밖으로
  //   나갔네요'). v335 에서 점수판을 **왼쪽 끝**에 붙였더니, 왼쪽 자리(L2)가
  //   천 바깥이 되어 버튼이 반쯤 잘려 나갔다. 자리마다 천 안에 들어가는지 먼저 본다.
  const cl = L.cloth;
  const inside = q => q.x >= cl.x && q.x + q.w <= cl.x + cl.w;
  const up = {x: R.x, y: last.y - last.h * 1.15, w, h: last.h};
  if (!hit(R) && inside(R)) return R;               // 오른쪽이 제일 낫다
  if (!hit(L2) && inside(L2)) return L2;            // 막히면 왼쪽 (천 안일 때만)
  if (inside(up)) return up;                        // 둘 다 안 되면 점수판 위
  return R;
}

function drawNoteBtn(){
  const b = noteBtn();
  NOTE_HIT = b;
  if (!b) return;
  const u = Math.min(b.w, b.h);
  round(b.x, b.y, b.w, b.h, u * 0.26);
  g.save(); g.globalAlpha = VER_ALPHA; g.fillStyle = '#101318'; g.fill(); g.restore();
  g.strokeStyle = 'rgba(226,232,240,0.45)'; g.lineWidth = Math.max(2, b.h * 0.06); g.stroke();
  g.save();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  // 두 글자라 칸 폭에 맞춰 줄인다 (칸이 좁은 폰에서도 안 넘치게)
  const NM = '의견';
  let fs = b.h * 0.44;
  const fit = () => { g.font = '900 ' + Math.round(fs) + 'px system-ui, -apple-system, sans-serif';
                      return g.measureText(NM).width; };
  const room = b.w * 0.80;
  if (fit() > room) fs = Math.max(9, fs * room / fit());
  fit();
  g.lineJoin = 'round';
  g.strokeStyle = 'rgba(10,12,16,0.85)'; g.lineWidth = Math.max(2, fs * 0.22);
  g.strokeText(NM, b.x + b.w/2, b.y + b.h/2);
  g.fillStyle = '#f2f4f8'; g.fillText(NM, b.x + b.w/2, b.y + b.h/2);
  g.restore();
  // 새 답이 와 있으면 빨간 점
  if (noteUnread() > 0){
    const r = b.h * 0.13;
    g.beginPath(); g.arc(b.x + b.w - r*1.2, b.y + r*1.2, r, 0, 7);
    g.fillStyle = '#e05a52'; g.fill();
    g.strokeStyle = '#14161a'; g.lineWidth = Math.max(1.5, r*0.35); g.stroke();
  }
}
// ★★★ 요청 목록 — DSLINE 을 누르면 뜬다 (사용자 2026-08-16)
//   '누르면 요청이 있었던 건만 최근 순서부터 리스트를 추천리스트 형식으로 그림으로
//    3페이지 정도 보여주고, 누르면 해당 경로화면을 보여주세요.
//    거기서 의견을 누르면 해당화면에 대한 내용을 보여주면 됩니다.'
//   추천 목록(drawRouteList)과 같은 모양이다 — 작은 당구대 · 공 · 경로선.
//   ⚠️ 경로선은 **저장할 때 같이 넣어 둔 poly** 를 쓴다. 18칸을 매번 다시 푸는 것은
//      훑기가 42가지 당점을 도는 일이라 폰에서 감당이 안 된다.
//      그 전에 쓴 글에는 poly 가 없어서 공만 나온다.
// ★ 목록 위 두 칸 — 요청 / 평가 (사용자 2026-08-16: '위에 요청 평가 버튼을
//   두개 만들고 디폴트는 요청에 둡시다'). 기본은 요청이다.
let NOTE_TABS = [];
function noteListRows(){
  return NOTE.rows.filter(n => n.kind === (NOTE.tab || '요청'));   // 서버가 최근 순으로 준다
}
function drawNoteList(){
  NOTE_CELLS = [];
  if (!S.noteList || previewOn()) return;
  const c = L.cloth, rows = noteListRows();
  g.fillStyle = 'rgba(8,10,14,0.92)'; g.fillRect(c.x, c.y, c.w, c.h);
  const pad = Math.max(6, c.w*0.014);
  // ── 위 두 칸 (요청 / 평가)
  const th0 = c.h * 0.11, tw0 = (c.w - pad*3)/2;
  NOTE_TABS = [];
  ['요청', '평가'].forEach((k, t) => {
    const bx = c.x + pad + t*(tw0+pad), by = c.y + pad;
    NOTE_TABS.push({x:bx, y:by, w:tw0, h:th0, k});
    const on = (NOTE.tab || '요청') === k;
    const n0 = NOTE.rows.filter(q => q.kind === k).length;
    round(bx, by, tw0, th0, th0*0.28);
    g.fillStyle = on ? '#2f4a3a' : '#1a2029'; g.fill();
    g.strokeStyle = on ? '#5ec07a' : '#3a4450';
    g.lineWidth = Math.max(2, th0*0.07); g.stroke();
    g.save(); g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '900 ' + Math.round(th0*0.46) + 'px system-ui, -apple-system, sans-serif';
    g.lineJoin = 'round';
    g.strokeStyle = 'rgba(10,12,16,0.85)'; g.lineWidth = Math.max(2, th0*0.10);
    const t2 = k + '  ' + n0;
    g.strokeText(t2, bx + tw0/2, by + th0/2);
    g.fillStyle = on ? '#bff0cd' : '#c9d2e0';
    g.fillText(t2, bx + tw0/2, by + th0/2);
    g.restore();
  });
  const gy0 = c.y + pad + th0 + pad;                 // 칸이 시작되는 높이
  const cw = (c.w - pad*4)/3, chh = (c.h - (gy0 - c.y) - pad*3)/2;
  const pg = Math.max(0, Math.min(NOTE_PAGES-1, S.notePage|0));
  for (let j = 0; j < NOTE_PER_PAGE; j++){
    const i = pg*NOTE_PER_PAGE + j, n = rows[i];
    const gx = c.x + pad + (j%3)*(cw+pad), gy = gy0 + Math.floor(j/3)*(chh+pad);
    NOTE_CELLS.push({x:gx, y:gy, w:cw, h:chh, i});
    if (!n) continue;
    g.fillStyle = '#1a2029'; round(gx, gy, cw, chh, chh*0.10); g.fill();
    g.strokeStyle = n.reply ? '#3aa76d' : '#c8a23a';     // 답이 왔으면 초록, 대기면 노랑
    g.lineWidth = Math.max(2, chh*0.022); g.stroke();
    const m = chh*0.12, aw = cw - m*2, ah = chh*0.56;
    const k = Math.min(aw/T.width, ah/T.height);
    const tw = T.width*k, th = T.height*k;
    const ox = gx + (cw-tw)/2, oy = gy + m;
    const P = (x,y) => [ox + x*k, oy + (T.height-y)*k];
    g.fillStyle = '#2b3440'; g.fillRect(ox, oy, tw, th);
    g.strokeStyle = '#55606e'; g.lineWidth = 1; g.strokeRect(ox, oy, tw, th);
    const poly = n.info && n.info.poly;
    if (poly && poly.length > 1){
      g.strokeStyle = '#7ee08a'; g.lineWidth = Math.max(1.5, k*40);
      g.lineJoin = 'round'; g.lineCap = 'round';
      g.beginPath(); g.moveTo(...P(poly[0][0], poly[0][1]));
      for (let q = 1; q < poly.length; q++) g.lineTo(...P(poly[q][0], poly[q][1]));
      g.stroke();
    }
    for (const b of (n.balls || [])){
      if (!b || typeof b.x !== 'number') continue;
      const [bx,by] = P(b.x, b.y);
      g.fillStyle = TONE[b.color] || '#eee';
      g.beginPath(); g.arc(bx, by, Math.max(2, k*40), 0, 7); g.fill();
      g.strokeStyle = '#14161a'; g.lineWidth = Math.max(0.8, k*10); g.stroke();
    }
    g.save(); g.textAlign = 'left'; g.textBaseline = 'top';
    g.font = '700 ' + Math.round(chh*0.105) + 'px system-ui, -apple-system, sans-serif';
    g.fillStyle = n.reply ? '#8fe3a8' : '#e0c07a';
    g.fillText('#' + n.id + '  ' + String(n.at||'').slice(5,10) +
               (n.reply ? '  답 왔음' : '  기다리는 중'), gx + m, gy + m + th + chh*0.015);
    g.fillStyle = '#e6ecf6';
    g.font = '700 ' + Math.round(chh*0.125) + 'px system-ui, -apple-system, sans-serif';
    const one = String(n.text||'').split(String.fromCharCode(10))[0];
    let t = one;
    while (t.length > 1 && g.measureText(t + '…').width > cw - m*2) t = t.slice(0, -1);
    g.fillText(t + (t.length < one.length ? '…' : ''), gx + m, gy + m + th + chh*0.14);
    g.restore();
  }
  g.save(); g.textAlign = 'center'; g.textBaseline = 'bottom';
  g.font = '700 ' + Math.round(c.h*0.034) + 'px system-ui, sans-serif';
  g.fillStyle = '#8a94a2';
  g.fillText((NOTE.tab || '요청') + ' ' + rows.length + '건   ·   ' + (pg+1) + '/' + NOTE_PAGES +
             '   ·   좌우로 밀면 넘어갑니다   ·   바깥을 누르면 닫힙니다',
             c.x + c.w/2, c.y + c.h - 4);
  g.restore();
}
// 그 배치와 경로를 그대로 되살린다
function noteRestore(n){
  S.noteList = false;
  if (n.balls && n.balls.length){
    const nb = {};
    for (const b of n.balls) if (b && b.c && typeof b.x === 'number')
      nb[b.c] = {p: [b.x, b.y], color: b.color};
    if (nb.cue) S.balls = nb;
  }
  S.corr = (n.info && typeof n.info.corr === 'number') ? n.info.corr : 0;
  S.routeIx = -1; S.routeList = false; S.aim = null; S.snapA = null; S.listShown = null;
  // ⚠️ routesReady() 는 **이미 풀어 둔 것**만 준다. 배치가 바뀌었으니 아직 없다.
  //    먼저 풀지 않으면 늘 '경로 없음' 이 되어 공만 놓인다 (사용자 10.jpg).
  findRoutes();
  const list = routesReady() || [];
  const i = n.route_key ? list.findIndex(r => r.key === n.route_key) : -1;
  if (i >= 0){ S.routeIx = i; pickRoute(list[i]); }
  else if (n.route_key)
    // ⚠️ 그동안 반사 모델을 고쳤으면 같은 배치라도 후보가 달라진다. 숨기지 않고 알린다.
    say('그때 경로는 지금 목록에 없습니다 — 배치만 되살렸습니다', 4000);
  blink();
}
function noteUnread(){
  return NOTE.rows.filter(n => n.reply && n.id > NOTE.seen).length;
}

// 서버에서 내 것만 가져온다 (IP 로 갈린다 — 앱이 IP 를 몰라도 된다)
function noteSync(after){
  fetch(API + 'mynotes?limit=30', {cache: 'no-store'})
    .then(r => r.ok ? r.json() : null)
    .then(j => { if (j){ if (j.rows) NOTE.rows = j.rows; NOTE.mine = !!j.mine; }
                 if (after) after(); })
    .catch(() => {});
}

// ★★ 저장해도 창을 닫지 않는다 — 답이 올 때까지 **대기 상태**로 둔다.
//   사용자 요청 #3 (2026-08-16) —
//     '내가 요청사항을 쓰고 저장을 누르면 화면은 대기상태.
//      취소를 누르면 전화면으로 복귀.
//      1분 버전확인시에는 이부분 관여하지 말것.
//      내가 저장버튼을 누르고 프롬프트에서 x 를 치면
//      답변을 이 화면에 대한 내용만 보면 좋겠어요.'
//   → 저장하면 그 글 하나만 남기고 기다린다. 8초마다 답을 확인한다.
//     다른 글은 안 보여준다. 취소(닫기)를 눌러야 돌아간다.
function noteOpen(){
  const el = document.getElementById('note');
  if (!el) return;
  NOTE.open = NOTE_OPEN = true;
  NOTE.seen = NOTE.rows.reduce((m, n) => Math.max(m, n.id), NOTE.seen);
  NOTE.edit = 0;
  const sb = document.getElementById('noteSave'); if (sb) sb.textContent = '저장';
  noteKind(NOTE.kind);
  noteMode();
  el.style.display = 'block';
  noteSync(() => noteDraw());
  setTimeout(() => { const t = document.getElementById('noteTxt'); if (t) t.focus(); }, 60);
}
// ★ 닫아도 **기다리던 글은 기억한다** (사용자 2026-08-16:
//   '빠져나오면 지난번 화면으로 갈 방법이 없어요').
//   다시 '의견' 을 누르면 그 글과 답이 그대로 다시 뜬다.
//   새 글을 쓰려면 창 안에서 '새로 쓰기' 를 누른다.
function noteClose(){
  NOTE.open = NOTE_OPEN = false;
  NOTE.edit = 0;
  const sb = document.getElementById('noteSave'); if (sb) sb.textContent = '저장';
  clearInterval(NOTE.tick); NOTE.tick = 0;
  const el = document.getElementById('note');
  if (el) el.style.display = 'none';
}
// ★ 창은 늘 **이 화면의 대화**다 (사용자 2026-08-16:
//   '거기서 의견을 누르면 해당화면에 대한 내용을 보여주면 됩니다.
//    추가 내용 대화는 거기서 하면 됩니다.')
//   지금 배치(place_key)에 달린 글과 답을 위에 쌓아 보여주고, 아래에서 이어서 쓴다.
//   지난 글 목록은 DSLINE 비밀 버튼이 맡는다 — 여기서는 안 다룬다.
function noteMode(){
  const c = document.getElementById('noteCancel');
  if (c) c.textContent = NOTE.wait ? '닫기' : '취소';
  noteDraw();
}
function noteKind(k){
  NOTE.kind = k;
  const a = document.getElementById('noteKindA'), b = document.getElementById('noteKindB');
  if (a) a.className = (k === '평가' ? 'on' : '');
  if (b) b.className = (k === '요청' ? 'on' : '');
}
function noteDraw(){
  const el = document.getElementById('noteList');
  if (!el) return;
  const esc = t => String(t || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  // ★ **이 배치 · 이 경로에 달린 글만** — 오래된 것이 위, 새 것이 아래 (대화 순서)
  // ★★ 경로까지 본다 (사용자 2026-08-17, 27.jpg: '새로운 경로에서 의견을 눌렀는데
  //   지난번 다른 경로 것이 지워지지 않았음'). 배치(공 위치)로만 걸렀더니 같은 배치에서
  //   경로만 바꿔도 지난 글이 그대로 붙어 있었다.
  //   사용자 2026-08-16 원문도 '해당 **화면**에 대한 내용' 이었다 — 화면은 배치+경로다.
  //   ⚠️ 경로 없이 쓴 옛 글(route_key 가 빈 것)은 배치만 맞으면 보여준다. 지우지 않는다.
  const pk = placeKey();
  let rk = null;
  try { const r0 = curRoute(); rk = r0 ? r0.key : null; } catch(e){ rk = null; }
  const rows = NOTE.rows.filter(n => pk && n.place_key === pk &&
                (!rk || !n.route_key || n.route_key === rk)).slice().reverse();
  if (!rows.length){ el.innerHTML = ''; return; }
  // ★ 사용자 2026-08-16 —
  //   '내용을 클릭하면 수정이 가능하게 해 주세요. 내용을 입력창으로 넘기면 될것 같은데.'
  //   '하단에 답을 기다리는 중.... 은 삭제해 주세요. 지금의 안내는 요청시만 필요합니다.'
  el.innerHTML = rows.map(n =>
    '<div class="n"><div class="t">#' + n.id + '  ' + esc(n.kind) + '  ' +
    esc(String(n.at || '').slice(5, 16).replace('T', ' ')) +
    '   (눌러서 고치기)</div>' +
    '<div class="q" data-id="' + n.id + '" style="cursor:pointer">' + esc(n.text) + '</div>' +
    (n.reply ? '<div class="a">' + esc(n.reply) + '</div>'
             : (n.kind === '요청'
                ? '<div class="t" style="margin-top:6px">답을 기다리는 중…  '
                  + '프롬프트에 x 를 쳐 주세요</div>'
                : '')) + '</div>').join('');
  el.onclick = e => {
    const q = e.target.closest ? e.target.closest('.q[data-id]') : null;
    if (q) noteEdit(+q.getAttribute('data-id'));
  };
}
// ★ 그 글을 입력창으로 옮겨 고친다. 저장하면 그 글이 바뀐다 (새 글이 안 생긴다).
function noteEdit(id){
  const n = NOTE.rows.find(x => x.id === id);
  if (!n) return;
  NOTE.edit = id;
  noteKind(n.kind || '요청');
  const t = document.getElementById('noteTxt');
  if (t){ t.value = n.text || ''; t.focus(); }
  const b = document.getElementById('noteSave');
  if (b) b.textContent = '수정';
  say('#' + id + ' 을 고치는 중입니다', 2500);
}
function noteSave(){
  const t = document.getElementById('noteTxt');
  const txt = (t && t.value || '').trim();
  if (!txt){ noteClose(); return; }
  const r = curRoute();
  const body = {who: VER_WHO, app: MOBILE_VER, kind: NOTE.kind, text: txt,
                place_key: placeKey(),
                route_key: r ? r.key : null,          // 경로 하나를 가리키는 열쇠
                balls: Object.keys(S.balls).map(q =>
                         ({c: q, x: Math.round(S.balls[q].p[0]), y: Math.round(S.balls[q].p[1]),
                           color: S.balls[q].color})),
                info: r ? {name: r.name, tip: r.tip, tipV: r.tipV, corr: S.corr,
                           // ★ 목록에 그림으로 보여주려고 경로선을 같이 넣는다
                           poly: (function(){ try { const q = routePoly(r);
                             return q ? q.map(v => [Math.round(v[0]), Math.round(v[1])]) : null;
                           } catch(e){ return null; } })(),
                           thick: r.thick === undefined ? null : Math.round(r.thick*100),
                           sep: r.sep === undefined ? null : Math.round(r.sep),
                           kiss: !!r.kiss, ix: S.routeIx,
                           verdict: verGet(r) || null} : {corr: S.corr, ix: S.routeIx}};
  // ★ 고치는 중이면 새 글을 만들지 않고 그 글을 바꾼다
  if (NOTE.edit){
    const id = NOTE.edit;
    fetch(API + 'note/edit', {method: 'POST', headers: {'Content-Type': 'application/json'},
                              body: JSON.stringify({id, text: txt})})
      .then(x => x.ok ? x.json() : null)
      .then(j => {
        say(j && j.ok ? ('#' + id + ' 고쳤습니다') : '수정 실패 — 다시 눌러 주세요');
        // ★ 사용자 2026-08-16: '수정 클릭시 수정후 즉시 전화면 복귀. 다시 저장 물어보지 마세요.'
        //   고치고 나면 볼 것이 없다. 그 자리에서 닫고 화면으로 돌려보낸다.
        noteSync();                       // 다음에 열 때 바뀐 글이 보이게만 해 둔다
        noteClose();
      })
      .catch(() => say('수정 실패 — 인터넷을 확인해 주세요'));
    return;
  }
  fetch(API + 'note', {method: 'POST', headers: {'Content-Type': 'application/json'},
                       body: JSON.stringify(body)})
    .then(x => x.ok ? x.json() : null)
    .then(j => {
      if (!(j && j.id)){ say('저장 실패 — 다시 눌러 주세요'); return; }
      // ★ 평가는 답을 기다리는 자리가 아니다 — 저장하면 바로 전 화면으로 (사용자 2026-08-16)
      if (NOTE.kind === '평가'){
        NOTE.rows = [{id: j.id, at: new Date().toISOString(), kind: '평가',
                      text: txt, reply: null, place_key: body.place_key,
                    route_key: body.route_key}].concat(NOTE.rows);
        say('평가 #' + j.id + ' 저장했습니다');
        noteClose(); return;
      }
      NOTE.wait = j.id;
      NOTE.rows = [{id: j.id, at: new Date().toISOString(), kind: NOTE.kind,
                    text: txt, reply: null, place_key: body.place_key,
                    route_key: body.route_key}].concat(NOTE.rows);
      const t2 = document.getElementById('noteTxt'); if (t2) t2.value = '';
      noteMode();
      // 답이 올 때까지 8초마다 본다 (60초 주기와 따로 돈다)
      clearInterval(NOTE.tick);
      NOTE.tick = setInterval(() => {
        if (!NOTE.open || !NOTE.wait){ clearInterval(NOTE.tick); NOTE.tick = 0; return; }
        noteSync(() => {
          const n = NOTE.rows.find(x => x.id === NOTE.wait);
          noteDraw();
          if (n && n.reply){ clearInterval(NOTE.tick); NOTE.tick = 0; }
        });
      }, 8000);
    })
    .catch(() => say('저장 실패 — 인터넷을 확인해 주세요'));
}

const nowMs = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
// 깜빡이는 동안은 경로가 **잠긴다** — 손가락을 움직여도 안 바뀐다.
// ⚠️⚠️ 이름을 S.rblink 로 둔다. **S.blink 는 이미 쓰이고 있다** — 공을 놓을 때
//    반짝이는 기능이 `S.blink = Date.now() + 3000` 으로 쓰고 blinkAlpha() 가
//    시간이 지나면 **0 으로 지운다.** 처음에 S.blink 를 같이 썼더니 내가 넣은
//    performance.now() 값이 그 함수 눈에는 이미 지난 시각이라 **다음 프레임에 바로
//    지워졌다** — 그래서 궤적이 전혀 안 깜빡였다 (사용자 2026-08-12).
function blinking(){ return !!S.rblink && nowMs() - S.rblink < BLINK_MS; }
// 자동완성을 다시 살린다 — 새 배치 · 새 추천경로 (setTip 의 ★★★ 주석)
function tipAuto(){ S.tipLock = 0; S.aimSnapped = 0; }
function pickRoute(r){
  tipAuto();                               // 추천을 고르면 그 경로의 당점이 주인이다
  const cue = S.balls.cue;
  if (!cue || !r) return;
  S.lockRails = (r.rails || []).join('-');   // 당점을 바꿔도 이 회로를 지킨다
  S.rblink = nowMs();
  // ★ 사용자 UI 안: '누르면 공의 진행을 시뮬레이션 보여주기'
  //   ⚠️ 충돌 뒤 속도가 없으므로 **시간을 흉내내지 않는다.** 수구가 지나간 길을
  //      차례대로 **그려 나가기만** 한다 — 순서는 맞고, 빠르기는 주장하지 않는다.
  // ⚠️ 경로를 고를 때 자동으로 굴리지 않는다 (사용자 2026-08-13:
  //    '추천경로에서 시뮬레이션은 제거'). 시뮬레이션 공을 눌러야 굴러간다.
  // ★★ 사용자 2026-08-12 정정 —
  //   '옆돌리기는 조금 고민이 되네요. 지금과 같은 이론도 있지만 **우리는 파이브앤하프
  //    기준으로 하거든요.** 수구수는 40초반, 1구수는 ?, 3구수는 28 이런 기준으로 칩니다.
  //    지금 다이의 팁수는 **짧은각 긴각 기준**인 것 같고.'
  //   → 옆돌리기도 **파이브앤하프**로 읽는다. 앞·뒤돌리기와 같아진다.
  //     교본도 이 셋을 5&하프로 푼다 (책 102·92쪽) — 위 주석에 이미 그렇게 적혀 있었는데
  //     내가 옆돌리기만 격자 판독창(구역·기울기·팁수)으로 빼놨던 것이다.
  //   ⚠️ 옆돌리기 격자(AR)를 지우지는 않는다. 상황판을 탭해 직접 고르면 나온다.
  //     다만 **자동으로는 안 간다** — 다이 위의 팁수 격자도 같이 안 뜬다.
  S.sysMode = (r.name === '횡단샷') ? 3 : /돌리기/.test(r.name || '') ? 1 : 0;
  // ★ 그 경로를 찾은 **당점**으로 옮긴다 — 그래야 그려지는 궤적이 그 경로가 된다
  if (r.tip !== undefined){
    // ★ 좌우만 그 경로의 값으로 바꾸고 **상하는 사용자가 준 것을 지킨다.**
    //   훑기도 상하를 그대로 두고 찾으므로 그래야 그림과 계산이 같아진다.
    //   ⚠️ tipH·tipV 를 정확한 값으로 두고, 화면 표시용 tipDir·tipR 만 눈금에 맞춘다.
    //      (눈금에 맞춰 되돌리면 좌우 값이 흔들려 경로가 어긋난다)
    S.tipH = Math.max(-3, Math.min(3, r.tip));
    if (r.tipV !== undefined) S.tipV = r.tipV;      // 상하도 그 경로를 찾은 값으로 (v193)
    S.tipR = Math.min(3, Math.hypot(S.tipH, S.tipV));
    S.tipDir = ((Math.round(Math.atan2(S.tipH, S.tipV) / (Math.PI/12)) % 24) + 24) % 24;
  }
  const len = S.aim ? Math.hypot(S.aim[0]-cue.p[0], S.aim[1]-cue.p[1]) : 2000;
  S.aim = S.lastAim = [cue.p[0] + Math.cos(r.a)*len, cue.p[1] + Math.sin(r.a)*len];
}

// ─────────────────────────────── 자석 (사용자 지시 2026-08-11)
// '경로를 설정하고 손을 놓으면 지맘대로 경로가 변해버려요. 또 자석 같은 기능이
//  없나요 — 경로가 맞으면 붙여주는 기능.'
//
// ⚠️ 처음엔 ±8도를 훑어 '목표 공에 제일 가까운 각' 으로 옮겼다. 두 가지가 틀렸다 —
//    ① 8도는 너무 넓다. 손댄 곳에서 멀리 끌려가니 '지맘대로' 로 느껴진다.
//    ② 붙이는 대상이 **득점하는 길인지를 안 봤다.** 공에 가깝기만 하면 붙였다.
// 지금은 findRoutes() 가 찾아 둔 **득점 경로에만** 붙는다. 그 안에 없으면
// 손댄 각을 그대로 둔다. 붙으면 추천 버튼에 몇 번째 경로인지 뜬다.
const MAGNET_DEG = 1.5;   // 이 안에 들어와야 붙는다. 경로 폭이 0.2~0.6도라 이만하면 넉넉하다

// ★★ 2026-08-12 전면 교체 —
//   전에는 **추천 목록에 있는 경로에만** 붙었다. 그 목록은 오늘 넣은 필터를 다 통과한
//   것들이라(키스 · 역회전 뱅크 · 교본에 이름 있는 진로만 · 순위), 사용자가 눈으로
//   만든 3쿠션이 거기 없으면 **붙을 대상 자체가 없었다.**
//   사용자 15.jpg: '붙였는데 블링크가 없어요. 한참을 좌우로 움직였어요.
//                   그리고 우측 안내도 그대로네요, 포인트도.'
//   → 판독창도 그대로였다는 것이 곧 **붙이는 함수가 아예 안 불렸다**는 증거다.
//
//   이제 '3쿠션이 형성되는가' 를 **직접** 판정한다. 추천 필터를 안 거친다.
//   ⚠️ 당점은 **안 바꾼다.** 사용자가 지금 준 당점 그대로 득점하는 각을 찾는다.
//      (추천 목록에서 고를 때는 pickRoute 가 당점까지 옮긴다 — 그건 그대로 둔다.)

// 지금 당점·보정으로 이 방향이 득점하나. 1적구를 맞고 3쿠션 이상 돌아 2적구까지.
function scoresAt(a, k){
  const cue = S.balls.cue;
  if (!cue) return false;
  const dir = [Math.cos(a), Math.sin(a)];
  const E = englishSideFor(cue.p, dir);
  const seq = roll(cue.p, dir, SWEEP_C_NOW, k, E);
  if (!seq.length) return false;
  const cut1 = cutAtBall([cue.p, ...seq.map(h => h.p)]);
  if (!cut1.hit) return false;
  const c1 = cut1.pts.length - 2;
  const P = cut1.pts[cut1.pts.length-1];
  const af = afterHit(cut1.from, P, cut1.obj);
  if (!af) return false;
  const budget = afterCushions(c1);
  if (budget <= 0) return false;
  const seq2 = roll(P, af.dir, Math.min(budget, SWEEP_C_NOW - c1), k, E);
  const cut2 = cutAtBall([P, ...seq2.map(h => h.p)], cut1.obj);
  if (!cut2.hit) return false;
  const c2 = cut2.pts.length - 2;
  if (c2 > budget) return false;
  if (c1 + c2 < 3) return false;                     // ★ 3쿠션 미달
  const rails = seq.slice(0,c1).map(h=>h.rail).concat(seq2.slice(0,c2).map(h=>h.rail));
  return {c1, c2, rails, name: shotName(c1, rails, cue.p, cut1.obj),
          thick: af.thick, kiss: !!kissAt(P, af, cut2.pts, cut1.obj)};
}

// ★★★ 경로를 **직접 지정**하면 항상 순회전 2시30분 / 9시30분 (사용자 2026-08-15)
//
//   '경로 직접지정으로 경로를 설정하면 자동으로 순회전으로 되었어야 하는데
//    역회전으로 설정이 되어 있었고, 팁을 조정하니 정상으로 되었습니다.
//    경로설정시 항상 순회전 2시30분이나 9시30분으로 가야 합니다.
//    도는 방향에 따라 자동으로 설정을 하고, 직접 팁수를 조정하면 그것도 반영을 하면 됩니다.'
//   (13.jpg — 앱이 '2시 3팁' 을 물고 있었다. 2시30분도 아니었고 방향도 역이었다)
//   ⚠️ **추천과는 무관하다** (사용자 확인: '직접지정이었으니 추천과 관계 없습니다').
//      훑기(sweep)의 42가지 당점 조합은 그대로 둔다. 순위에 안 닿는다.
//
//   ★ 자리는 둘뿐이다. 도는 쪽만 보고 고른다 —
//        첫 쿠션을 **왼쪽**으로 흐르면  →  9시30분 (tipDir 19)  좌회전
//        첫 쿠션을 **오른쪽**으로 흐르면 →  2시30분 (tipDir  5)  우회전
//      (앱 좌표의 접선 부호로 말하면 sIn>0 이 2시30분이다)
//      팁수는 3. 파이브앤하프의 기준 당점이다.
//
//   ★ 왜 그것이 순회전인가 — 순방향 = 회전이 미는 쪽(e = tipH 부호)이 공이 흐른 쪽과 같은 것.
//     물리로도 그렇다: 상단 쿠션을 오른쪽으로 흐르는 공은 3시가 순이다.
//     파이브앤하프가 2시30분을 쓰는 자리가 바로 그 자리다.
//     2026-08-15 에 실측 영상 셋으로 확인했다 —
//       0808 · 2순위   반시계로 돈다 · 9시30분 → 순
//       원쿠션걸어치기  시계로 돈다  · 2시30분 → 순
//
//   ⚠️ v284 는 '쿠션마다 흐른 쪽이 다르면 손대지 않는다' 로 좁혀 두었다 (7.jpg 때문).
//      사용자가 '경로설정시 **항상**' 으로 정리해 주셨으므로 그 제한을 뺀다.
//      지그재그 길에 다른 팁을 쓰고 싶으면 **직접 팁을 돌리면 된다** — 그건 그대로 남는다.
//      이 함수는 조준을 새로 잡을 때(snapAim)만 걸리고, 팁을 돌릴 때는 안 걸린다.
function autoTipSide(){
  const cue = S.balls.cue;
  if (!cue || !S.aim) return false;
  if (S.tipLock) return false;             // ★ 손으로 만진 뒤로는 안 건드린다 (setTip 주석)
  let hits = null;
  try { hits = pathFromAim(cue.p, S.aim, S.corr); } catch(e){ return false; }
  if (!hits || !hits.length) return false;
  const cut = cutAtBall([cue.p, ...hits.map(h => h.p)]);
  // 공을 먼저 맞히는 길이면 **충돌 뒤 첫 쿠션**으로 본다 — 거기서부터 도는 것이다
  let from = cue.p, first = hits[0];
  if (cut.hit && cut.pts.length === 2){
    const P = cut.pts[1], af = afterHit(cut.from, P, cut.obj);
    if (!af) return false;
    const q = roll(P, af.dir, 1, 0);
    if (!q.length) return false;
    from = P; first = q[0];
  }
  const n = RAILS[first.rail], tg = [-n[1], n[0]];
  const d = [first.p[0]-from[0], first.p[1]-from[1]];
  const want = (d[0]*tg[0] + d[1]*tg[1]) >= 0 ? 1 : -1;   // 첫 쿠션에서 흐른 쪽
  const dir = want > 0 ? 5 : 19;                          // 2시30분 · 9시30분
  if (S.tipDir === dir && S.tipR === 3) return false;
  S.tipDir = dir; S.tipR = 3;
  S.tipV = S.tipR * Math.cos(S.tipDir * Math.PI/12);
  S.tipH = S.tipR * Math.sin(S.tipDir * Math.PI/12);
  return true;
}

function snapAim(){
  const cue = S.balls.cue;
  if (!cue || !S.aim) return false;
  // ★★★★ 자석은 **배치마다 한 번만** 붙는다 (사용자 2026-08-17):
  //   '3과 4 사이를 직접지정할수 없어요' · '5.jpg 겨우 잡았네요'
  //   못 맞히는 각에 놓으면 1.5도 안의 득점 각으로 계속 끌어가서, 일부러 그 자리를
  //   겨누려 해도 손을 떼는 순간 도로 끌려갔다. 2뱅크 곱셈처럼 **득점이 아니라
  //   정해진 포인트를 겨누는** 시스템에서는 아예 조준을 못 한다.
  //   ⚠️ 자석은 사장님이 요청하신 것이다 (2026-08-11). 없애지 않는다 —
  //      처음 한 번은 길을 잡아 주고, 그 뒤로는 손에 맡긴다. 당점 자동완성과 같은 규칙.
  //   다시 사는 때 — 새 배치 · 추천 경로 고르기 (tipAuto).
  if (S.aimSnapped) return false;
  const d0 = [S.aim[0]-cue.p[0], S.aim[1]-cue.p[1]];
  const len = Math.hypot(d0[0], d0[1]);
  if (len < 1e-6) return false;
  let k0 = 0;
  try { pathFromAim(cue.p, S.aim, S.corr); k0 = LAST_K; } catch(e){ k0 = 0; }
  const a0 = Math.atan2(d0[1], d0[0]);
  // ★★ 사용자 2026-08-14: '자석기능 때문에 미세조정이 잘 안되요. 마지막 각을 만들려면
  //   당점조정과 경로를 미세하게 조정을 해야 하는데, 경로조정후 클릭을 하면 위치가
  //   지맘대로 위 또는 아래로 변경이 됩니다. 편법으로 공을 살짝 움직일때도 있어요.'
  //   → **이미 득점하는 각이면 그대로 둔다.** 전에는 늘 득점 구간 한가운데로 끌어당겨,
  //     0.05도씩 다듬어 놓아도 손만 떼면 가운데로 도로 갔다.
  //     못 맞히는 자리에서만 가까운 득점 각으로 붙인다 — 자석의 원래 뜻은 그것이다.
  {
    const here = scoresAt(a0, k0);
    if (here){
      S.lockRails = (here.rails || []).join('-');
      S.snapA = a0;                  // 이 근처에서는 다시 안 붙는다
      S.routeIx = -1;
      return true;                   // 깜빡이지도 않는다 — 다듬는 중이니 잠그면 안 된다
    }
  }
  const R = MAGNET_DEG * Math.PI/180, STEP = 0.05 * Math.PI/180;   // ±1.5도를 0.05도로
  // a0 에서 가까운 쪽부터 훑는다 — 손댄 곳에서 제일 가까운 득점 각에 붙는다
  let hitA = null, got = null;
  for (let d = 0; d <= R + 1e-12; d += STEP){
    for (const sgn of (d === 0 ? [0] : [1,-1])){
      const a = a0 + sgn*d, r = scoresAt(a, k0);
      if (r){ hitA = a; got = r; break; }
    }
    if (hitA !== null) break;
  }
  if (hitA === null){ S.routeIx = -1; return false; }
  // 득점하는 구간의 **가운데**로 옮긴다 (제일 관대한 자리)
  // ⚠️ 넓히는 폭을 R 로 묶는다. 안 묶으면 한 번 움직일 때 scoresAt 을 수백 번 불러
  //    폰에서 손가락이 끊긴다 (경로 폭은 보통 0.2~0.6도라 이만하면 충분하다).
  let lo = hitA, hi = hitA, n = 0;
  while (n++ < 30 && scoresAt(lo - STEP, k0)) lo -= STEP;
  n = 0;
  while (n++ < 30 && scoresAt(hi + STEP, k0)) hi += STEP;
  const a = (lo + hi)/2;
  S.aim = S.lastAim = [cue.p[0] + Math.cos(a)*len, cue.p[1] + Math.sin(a)*len];
  S.snapA = a;                       // 이 각에서 벗어나야 다시 붙는다
  S.aimSnapped = 1;                  // ★ 이 배치에서는 이제 안 붙는다 (위 ★★★★ 주석)
  autoTipSide();                     // ★ 도는 방향에 맞춰 좌우 팁을 잡는다 (위 주석)
  S.lockRails = (got.rails || []).join('-');   // 당점을 바꿔도 이 회로를 지킨다
  S.rblink = nowMs();                // ★ 3초 깜빡임
  S.routeIx = -1;
  // 판독창을 그 진로에 맞춘다 (pickRoute 와 같은 규칙, 당점은 안 건드린다)
  // 앞·옆·뒤돌리기는 모두 파이브앤하프 (사용자 2026-08-12 · pickRoute 주석 참고)
  S.sysMode = (got.name === '횡단샷') ? 3 : /돌리기/.test(got.name || '') ? 1 : 0;
  return true;
}

  if (KISSFIX.key === key) return KISSFIX.val;
  let out = null;
  const hS = S.tipH, vS = S.tipV, rS = S.tipR;
  try {
    const a0 = Math.atan2(S.aim[1]-cue.p[1], S.aim[0]-cue.p[0]);
    const aimAt = a => [cue.p[0] + Math.cos(a)*200, cue.p[1] + Math.sin(a)*200];
    const now = planShot(cue.p, aimAt(a0));
    if (now && kissRun(now.dir, now.V0, now.kk, englishSideFor(cue.p, now.dir)).kiss){
      const nowThick = now.af.thick;
      const tryOne = (a, tp, tv) => {
        S.tipH = tp; S.tipV = tv; S.tipR = Math.min(3, Math.hypot(tp, tv));
        const r0 = scoresAt(a, now.kk);
        if (!r0 || (r0.rails||[]).join('-') !== S.lockRails) return null;   // 같은 회로만
        const pl = planShot(cue.p, aimAt(a));
        if (!pl) return null;
        const k = kissRun(pl.dir, pl.V0, pl.kk, englishSideFor(cue.p, pl.dir));
        if (k.kiss || !k.score) return null;
        return {thick: pl.af.thick, now: nowThick, tipH: tp, tipV: tv,
                tipChanged: (tp !== hS || tv !== vS)};
      };
      const RG = 4*Math.PI/180;
      for (let dd = 0.1*Math.PI/180; dd <= RG && !out; dd += 0.1*Math.PI/180)   // 1단계
        for (const sg of [1,-1]){ const r = tryOne(a0 + sg*dd, hS, vS); if (r){ out = r; break; } }
      if (!out){                                                                // 2단계
        const S2 = 0.4*Math.PI/180;
        for (const tv of [3, 0.78, -3]){
          for (const tp of [-3,-2,-1,0,1,2,3]){
            if (tp === hS && tv === vS) continue;
            for (let dd = 0; dd <= RG && !out; dd += S2)
              for (const sg of (dd === 0 ? [1] : [1,-1])){
                const r = tryOne(a0 + sg*dd, tp, tv); if (r){ out = r; break; }
              }
            if (out) break;
          }
          if (out) break;
        }
      }
    }
  } catch(e){ out = null; }
  S.tipH = hS; S.tipV = vS; S.tipR = rS;
  KISSFIX = {key, val: out};
  return out;
}
function drawGrid(){

  g.save();
  g.strokeStyle = 'rgba(255,255,255,0.20)';      // 0.09 → 0.13 → 0.20 (사용자 '조금만 더 진하게' 세 번)
  g.lineWidth = Math.max(1, L.cloth.h*0.0040);

    const [ax,ay] = toPx(T.width*i/8, 0), [bx,by] = toPx(T.width*i/8, T.height);
    g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by); g.stroke();

  for (let j = 1; j <= 3; j++){

  }
  // ★ 다이 바닥이 여기까지다 — 테두리도 격자로 두른다 (사용자 2026-08-14)
  //   '격자무니 다이 테두리에도 넣으세요. 다이바닥이 여기까지다를 표시하세요.'
  //   전에는 안쪽 줄(세로 7 · 가로 3)만 그려 쿠션 코가 어디인지 안 보였다.
  //   ⚠️ 처음엔 진하고 굵게 그렸는데 사용자가 '격자와 같은 두께로. 더 두꺼워 보여요'
  //      (2026-08-14) → 안쪽 줄과 **똑같이** 그린다. 색도 굵기도 위에서 정한 그대로 쓴다.
  const c0 = toPx(0,0), c1 = toPx(T.width,0), c2 = toPx(T.width,T.height), c3 = toPx(0,T.height);

function drawZoneGrid(){
  if (curSystem() !== 4 || previewOn()) return;
  const cue = S.balls.cue, o1 = S.balls.obj1;
  if (!cue) return;
  const fromLeft = cue.p[0] <= T.width/2, dia = T.width/8;
  const xAt = n => fromLeft ? dia*n/10 : T.width - dia*n/10;   // 눈금 n 의 자리
  const upperTop = (cue.p[1] <= T.height/2);   // 수구 반대쪽 절반이 '위쪽 줄'
  g.save();
  // ★ 사용자 2026-08-12: '가로 3 세로 7 줄을 표시하는 것이 격자 아닌가요.'
  //   맞다 — 다이아 격자다. 장쿠션 8칸이면 세로줄 7개, 단쿠션 4칸이면 가로줄 3개.
  //   구역 경계(눈금 10·20·40·60)는 이 격자선 위에 그대로 얹힌다.
  // 격자는 drawGrid() 가 늘 깔아 둔다. 여기서는 **구역 경계만** 얹는다.
  g.strokeStyle = 'rgba(226,170,198,0.42)';
  g.lineWidth = Math.max(1.5, L.cloth.h*0.005);
  let a = toPx(0, T.height/2), b = toPx(T.width, T.height/2);
  g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke();
  for (const n of [10, 20, 40, 60]){
    const x = xAt(n);
    if (x < 1 || x > T.width-1) continue;
    a = toPx(x, 0); b = toPx(x, T.height);
    g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke();
  }
  // 칸마다 팁수 — 위쪽 줄과 아래쪽 줄이 다르다
  const UP = [[0,10,'무회전'],[10,20,'1팁'],[20,40,'2팁'],[40,60,'3팁'],[60,80,'4팁']];
  const DN = [[0,20,'무회전'],[20,40,'1팁'],[40,60,'2팁'],[60,80,'3팁']];
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '800 ' + Math.round(L.cloth.h*0.055) + 'px system-ui, sans-serif';
  for (const [rows, isUp] of [[UP, true], [DN, false]]){
    const yMid = (isUp === upperTop) ? T.height*0.75 : T.height*0.25;
    for (const [lo, hi, lb] of rows){
      const x0 = xAt(lo), x1 = xAt(hi);
      const cx = (Math.max(0, Math.min(T.width, x0)) + Math.max(0, Math.min(T.width, x1)))/2;
      if (Math.abs(x0 - x1) < 5) continue;
      const [px, py] = toPx(cx, yMid);
      g.fillStyle = 'rgba(240,215,228,0.34)';
      g.fillText(lb, px, py);
    }
  }
  // 1적구가 든 칸을 살짝 밝힌다
  if (o1){
    const v = (fromLeft ? o1.p[0] : T.width - o1.p[0]) / dia * 10;
    const up = (o1.p[1] > T.height/2) !== (cue.p[1] > T.height/2);
    const rows = up ? UP : DN;
    for (const [lo, hi] of rows) if (v >= lo && v < hi){
      const x0 = xAt(lo), x1 = xAt(hi);
      const yA = (o1.p[1] > T.height/2) ? T.height : 0;
      const p0 = toPx(Math.max(0,Math.min(T.width,x0)), T.height/2);
      const p1 = toPx(Math.max(0,Math.min(T.width,x1)), yA);
      g.fillStyle = 'rgba(226,170,198,0.10)';
      g.fillRect(Math.min(p0[0],p1[0]), Math.min(p0[1],p1[1]),
                 Math.abs(p1[0]-p0[0]), Math.abs(p1[1]-p0[1]));
      break;
    }
  }
  g.restore();
}

// ★★★ 1쿠션이 **우측 단쿠션**인가 (사용자 자문 2026-08-17)
//   '1쿠션이 우측 단쿠션일 때만' 그 쿠션에 눈금을 그린다.
//   ⚠️ 화면 방향의 기준은 언제나 **수구가 향하는 쪽**이다 — 1적구든 1쿠션이든.
//      사용자: '항상 강조를 하지만 … 이 기준 한번도 바뀐적이 없어요.'
//      번호표는 다이 좌표로 두고 fold() 가 화면에 맞춘다. 그 접힌 자리에서
//      화면 우측 단쿠션은 데이터의 **left** 레일이다.
function firstOnShortRail(){
  const b = systemBase();
  if (!b || !b.hits || !b.hits.length) return false;
  const rp = railParam(fold(orientation(), b.hits[0].p));
  return !!rp && rp.rail === 'left';
}
// ★★★ 횡단&더블시스템의 눈금 — **레일 칸수** (사용자 2026-08-17, 20.jpg '포인트 그대로네요')
//   '상단과 하단의 포인트는 0~8 까지로 하고 좌측 단다이는 0~4. 방향이 반대면 반대로.'
//   파이브앤하프 눈금(프레임 0~110)과 전혀 다른 자라, 이 시스템일 때는 통째로 갈아입는다.
//   ⚠️ 방향은 fold() 가 접는다 — 번호표는 언제나 수구가 향하는 쪽 기준이다.
//   ⚠️ 색은 한 가지로 둔다. 파이브앤하프처럼 쿠션마다 역할(수구수·1쿠션·3쿠션)이
//      정해진 눈금이 아니라 **자리를 세는 자** 하나이기 때문이다.
function drawNumbersCross(){
  const o = orientation();
  const fs = Math.round(L.cloth.h * 0.062);
  g.save();
  g.font = 'bold ' + fs + 'px sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#e8eef7'; g.strokeStyle = '#101014';
  g.lineWidth = Math.max(3, fs * 0.28);
  const put = (rail, i, n) => {
    const lg = (rail === 'top' || rail === 'bottom');
    const t = i / (lg ? 8 : 4);
    let mm = lg ? [T.width*t, rail === 'top' ? T.height : 0]
                : [rail === 'right' ? T.width : 0, T.height*t];
    mm = fold(o, mm);
    let [x, y] = toPx(...mm);
    const r2 = foldRail(o, rail);
    if (r2 === 'top')    y += fs * 0.20;
    if (r2 === 'bottom') y -= fs * 0.06;
    if (r2 === 'left' || r2 === 'right')
      x = r2 === 'right' ? (L.cloth.x + L.cloth.w + L.rail.x + L.rail.w) / 2
                         : (L.rail.x + L.cloth.x) / 2;
    g.strokeText(String(n), x, y); g.fillText(String(n), x, y);
  };
  for (let i = 0; i <= 8; i++){ put('top', i, i); put('bottom', i, i); }
  for (let i = 0; i <= 4; i++){ put('left', i, i); put('right', i, i); }
  g.restore();
}
function drawNumbers(){
  if (curSystem() === 1){ drawNumbers2Bank(); return; }
  if (curShotName() === '횡단&더블시스템'){ drawNumbersCross(); return; }
  const o = orientation();
  for (const sc of SCALES){
    // 단쿠션 1쿠션 눈금은 **거기가 1쿠션일 때만** 나온다 (위 firstOnShortRail)
    if (sc.name === 'first_cushion_short' && !firstOnShortRail()) continue;
    const third = sc.name === 'third_cushion';
    // 숫자도 화면에 비례시킨다. 17/20px 고정이면 폰에서 안 보인다.
    const fs = Math.round(L.cloth.h * (third ? 0.055 : 0.065));   // 천 높이 기준
    g.font = 'bold ' + fs + 'px sans-serif';
    g.fillStyle = sc.color; g.textAlign = 'center'; g.textBaseline = 'middle';
    const seen = [];
    for (const pt of sc.points){
      // ⚠️ 100 뒤의 110·120 은 **판독창 전용**이다 (사용자 확정). 다이에는 안 그린다.
      if (pt.readout_only) continue;
      let mm = railPoint(sc, pt.rail, pt.index);
      const rail = foldRail(o, pt.rail);
      mm = fold(o, mm);
      let [x,y] = toPx(...mm);
      // ⚠️ 단쿠션(좌·우) 숫자는 레일 **가운데**에 정렬한다. 프레임 포인트 자리에
      //    그대로 두면 레일 한쪽에 치우쳐 보인다 (사용자 지적).
      //    화면이 좌우로 뒤집혀도(fold) 같이 따라가야 하므로 접은 뒤의 레일로 판단한다.
      // ⚠️ 위쪽 레일 숫자는 화면 맨 위에 붙어 잘려 보인다 (사용자 지적).
      //    글자 높이의 20% 만큼 안쪽으로 내린다.
      if (rail === 'top')    y += fs * 0.20;
      if (rail === 'bottom') y -= fs * 0.06;
      if (rail === 'left' || rail === 'right'){
        const railMid = rail === 'right'
          ? (L.cloth.x + L.cloth.w + L.rail.x + L.rail.w) / 2
          : (L.rail.x + L.cloth.x) / 2;
        x = railMid;
      }
      if (seen.some(s => s.n === pt.number && Math.hypot(s.x-x, s.y-y) < fs*6)) continue;
      seen.push({n:pt.number, x, y});
      // ⚠️ 다이아몬드 **반칸**에 걸린 숫자는 밝기를 30% 낮춘다 (사용자 지시).
      //    상단 60·80·100 / 우측 80·100 / 하단(3쿠션) 50·70·90 이 여기 해당한다.
      g.fillStyle = pt.index % 1 ? dim(sc.color, 0.7) : sc.color;
      g.strokeStyle = '#101014'; g.lineWidth = Math.max(3, fs * 0.28);
      g.strokeText(String(pt.number), x, y); g.fillText(String(pt.number), x, y);
    }
  }
}
// 2뱅크 눈금 — 그 샷의 레일 배정대로 세 줄을 그린다. **레일 포인트** 기준이라
// 프레임이 아니라 쿠션 날 위에 찍는다.
// ★ 팁 가이드 — 사용자 2026-08-11: '무회전을 기본으로 하고 각이 안 나올 경우
//   회전을 가이드 하는 겁니다.'
//   목표는 **2적구**다. 0팁(무회전)부터 0.5씩 올려가며 2적구에 닿는 팁을 찾는다.
//   ⚠️ 순회전만 본다. reflect() 가 0~3팁으로 묶여 있고, 역회전 표는 아직 없다
//      (오전 촬영에서 7샷 20접점뿐). 역회전이 필요한 배치는 '못 만듦' 으로 나온다.
function segNear(a, b, q, r){
  const vx = b[0]-a[0], vy = b[1]-a[1], wx = q[0]-a[0], wy = q[1]-a[1];
  const L = vx*vx + vy*vy;
  const t = L < 1e-9 ? 0 : Math.max(0, Math.min(1, (wx*vx + wy*vy)/L));
  return Math.hypot(a[0]+vx*t-q[0], a[1]+vy*t-q[1]) <= r;
}
function reaches(tip, cue, tgt, d){
  const save = S.tipH; S.tipH = tip;
  const pts = [cue.p, ...roll(cue.p, d, 5, 0).map(h => h.p)];
  S.tipH = save;
  for (let i = 0; i < pts.length-1; i++)
    if (segNear(pts[i], pts[i+1], tgt.p, T.ball_diameter)) return true;
  return false;
}
// ⚠️ 전에는 '0팁부터 훑어 닿는 가장 작은 팁' 을 보여줬다. 0팁이 닿으면 당점을
//    뭘로 바꿔도 늘 '무회전' 이라 무슨 뜻인지 알 수 없었다 (사용자 지적 35·36.jpg).
//    → **지금 당점으로 닿는지**를 먼저 보고, 안 닿으면 닿는 팁을 권한다.
function tipGuide(){
  const cue = S.balls.cue;
  const tgt = S.balls.obj2 || S.balls.obj1;
  if (!cue || !S.aim || !tgt) return null;
  const d = [S.aim[0]-cue.p[0], S.aim[1]-cue.p[1]];
  const now = Math.max(0, Math.min(3, S.tipH));
  if (reaches(now, cue, tgt, d)) return {ok:true, tip:now};
  for (let t = 0; t <= 3.001; t += 0.5)
    if (reaches(t, cue, tgt, d)) return {ok:false, tip:t};
  return {ok:false, tip:null};
}

function drawNumbers2Bank(){
  const tb = twoBank();

  g.font = 'bold ' + fs + 'px sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  if (!tb){                                     // 아직 조준 전 — 안내만

    return;

  for (const v of [2,3,4]){
    const dia = (5 - v) / (isLong(tb.r2) ? 0.5 : 1);

  for (let k = 1; k <= n1; k++) put(tb.r1, tb.cF, k, String(k*10), TWOBANK_FIRST);
}

function railPoint(sc, rail, idx){
  const off = sc.reference === 'rail' ? 0 : T.frame_offset;
  const n = (rail === 'bottom' || rail === 'top') ? 8 : 4;
  const t = idx/n;
  if (rail === 'bottom') return [T.width*t, -off];
  if (rail === 'top')    return [T.width*t, T.height+off];
  if (rail === 'left')   return [-off, T.height*t];
  return [T.width+off, T.height*t];
}

// 궤적이 적구에 닿으면 거기서 끊는다.
// ⚠️ 닿은 뒤의 경로는 두께·당점·스트로크에 따라 완전히 달라진다 — 아직 재지 않은
//    영역이다. 그대로 이어 그리면 없는 것을 보여주게 된다 (사용자 지시).
//    수구 중심이 적구 중심에서 **지름**만큼 떨어지는 순간이 접촉이다.
// 반환: {pts, hit}  hit=true 면 마지막 점이 적구에 닿은 자리
function cutAtBall(pts, except){
  // ⚠️ except — 방금 맞은 그 공은 빼야 한다. 충돌 직후 수구는 아직 그 공에서
  //    지름 거리에 있고, 얇게 맞으면 계속 다가가므로 **즉시 다시 맞았다고** 나온다
  //    (사용자 지적, 2.jpg 에서 충돌 후 궤적이 몇 px 만 그려졌다).
  const objs = [];
  for (const k in S.balls){
    const q = S.balls[k].p;
    if (k === 'cue') continue;
    if (except && Math.hypot(q[0]-except[0], q[1]-except[1]) < 1) continue;
    objs.push(q);
  }
  if (!objs.length) return {pts, hit:false};
  const D = T.ball_diameter, out = [pts[0]];
  for (let i = 0; i < pts.length-1; i++){
    const a = pts[i], b = pts[i+1];
    const dx = b[0]-a[0], dy = b[1]-a[1], ll = dx*dx + dy*dy;
    let t0 = null, hitObj = null;
    if (ll > 1e-9) for (const o of objs){
      const fx = a[0]-o[0], fy = a[1]-o[1];
      const B = 2*(fx*dx + fy*dy), C = fx*fx + fy*fy - D*D;
      const disc = B*B - 4*ll*C;
      if (disc < 0) continue;
      const sq = Math.sqrt(disc);
      for (const t of [(-B-sq)/(2*ll), (-B+sq)/(2*ll)])
        if (t > 1e-3 && t <= 1 && (t0 === null || t < t0)){ t0 = t; hitObj = o; }
    }
    if (t0 !== null){
      out.push([a[0]+dx*t0, a[1]+dy*t0]);
      return {pts:out, hit:true, obj:hitObj, from:a};
    }
    out.push(b);
  }
  return {pts:out, hit:false};
}



// 1적구가 나가는 각. **수구의 진행 방향** 을 0 으로 보고, 적구가 있는 **같은 쪽**으로 꺾인다.
// (수구는 반대쪽으로 꺾인다 — data/separation.json 참고)
function objectAngle(thick){
  if (!SEP_OBJ.length) return null;
  const t = Math.max(0, Math.min(1, thick));
  const a = SEP_OBJ.slice().sort((x,y) => x[0]-y[0]);
  if (t <= a[0][0]) return a[0][1];
  if (t >= a[a.length-1][0]) return a[a.length-1][1];
  for (let i = 0; i < a.length-1; i++)
    if (t >= a[i][0] && t <= a[i+1][0]){
      const k = (t - a[i][0]) / (a[i+1][0] - a[i][0]);
      return a[i][1] + k * (a[i+1][1] - a[i][1]);
    }
  return null;
}

// 회전 없는 거울반사로 굴린다.
// ⚠️ 1적구에 실측 반사표(measured_bounce)를 쓰면 안 된다. 그 표는 **큐로 3팁을 준
//    수구** 로 잰 것이고, 1적구는 큐에 안 맞아 회전이 없다.
function rollPlain(start, d, cushions){
  const n = Math.hypot(d[0], d[1]);
  if (n < 1e-9) return [];
  let p = start.slice(), dir = [d[0]/n, d[1]/n], out = [];
  for (let i = 0; i < cushions; i++){
    const nx = nextRail(p, dir, T.width, T.height);
    if (!nx) break;
    const [rail, q] = nx, nb = RAILS[rail];
    const dot = dir[0]*nb[0] + dir[1]*nb[1];
    dir = [dir[0] - 2*dot*nb[0], dir[1] - 2*dot*nb[1]];
    out.push({rail, p: q});
    p = q;
  }
  return out;
}

// ---------------------------------------------------------------- 충돌 후
// 적구를 맞은 뒤 수구가 꺾이는 각 (분리각). data/separation.json 의 표를 보간한다.
// ⚠️ 이 표는 **당점 2시30분~3시 3팁 · 사용자의 평소 속도** 에서만 맞는다
//    (실측 쿠션표와 같은 조건). 속도·거리·당점 높낮이는 아직 안 넣었다.
// 두께와 **상하 당점**으로 분리각을 낸다.
//   tip  +3 = 상단 3팁(12시) · 0 = 중단 · −3 = 하단 3팁(6시)
// ⚠️ 좌우 회전(사이드)은 여기가 아니라 쿠션 반사(reflect)를 바꾼다.
//    사용자 확인: '중단 2~3팁(옆회전만)' 이 무회전과 값이 같다 → 분리각은 좌우와 무관.
function separationAngle(thick, tip){
  if (!SEP.length) return null;
  const t = Math.max(0, Math.min(1, thick));
  const v = Math.max(-3, Math.min(3, tip === undefined ? S.tipV : tip));
  // 한 줄에서 상하 당점으로 값을 뽑는다.
  // 표는 일곱 칸: [두께, +3, +2, +1, 0, −1, −2, −3] — 사용자 제공 실측값이라
  // 상단↔중단↔하단이 직선이 아니다. 이웃한 두 칸 사이만 보간한다.
  const byTip = r => {
    const f = Math.max(0, Math.min(5.999, 3 - v));   // +3→0 · 0→3 · −3→6
    const i = Math.floor(f);
    return r[1+i] + (f - i) * (r[2+i] - r[1+i]);
  };
  if (t >= SEP[SEP.length-1][0]) return byTip(SEP[SEP.length-1]);  // 더 두꺼워도 안 늘린다
  for (let i = 0; i < SEP.length-1; i++)
    if (t >= SEP[i][0] && t <= SEP[i+1][0]){
      const k = (t - SEP[i][0]) / (SEP[i+1][0] - SEP[i][0]);
      return byTip(SEP[i]) + k * (byTip(SEP[i+1]) - byTip(SEP[i]));
    }
  return null;
}

// 적구에 닿는 순간의 두께와, 그 뒤 수구가 갈 방향.
//   두께 = (지름 − 중심선까지 거리) / 지름     (정면 1.0 · 반두께 0.5 · 스침 0)
//   꺾이는 쪽은 적구가 있는 **반대쪽**이다.
// ★★★ 충돌 결과를 **한 곳에서만** 낸다 (사용자 2026-08-13:
//   '추천경로를 보여줬으면 공이 맞아야죠? 키스가 난 경우도 아니고').
//   ⚠️⚠️ v231 에서 시뮬레이션 쪽(simHit)에만 '멀어지게 하는 보정' 을 걸었더니
//      **충돌 모델이 두 개**가 됐다 —
//        추천·그리기 afterHit  두께 0.05 → 분리각  4.8도
//        시뮬레이션  simHit    두께 0.05 → 분리각 15.3도
//      얇을수록 10도씩 어긋나서, 추천한 길과 공이 실제로 가는 길이 달라졌다.
//      Node 로 재 보니 두께 0.02~0.14 짜리 추천이 엔진에서 **공 하나만 맞혔다.**
//   → 두 쪽이 이 함수 하나를 같이 쓴다. 그림·추천·시뮬레이션이 늘 같은 값이 된다.
//   ★ 두께 0.30 이상은 이미 멀어지므로 **값이 하나도 안 바뀐다** (v231 표 참고).
//     바뀌는 것은 표가 물리적으로 불가능한 값을 주던 얇은 구간뿐이다.
//   dx,dy = 때린 공의 진행 단위벡터 · ox,oy = 때린 공 → 맞는 공 (길이 = 공 지름)
//   돌려주는 것은 **들어온 속도를 1 로 본** 두 공의 속도.
function hitOut(dx, dy, ox, oy, thick, deg, od){
  const side = dx*oy - dy*ox, sgn = Math.sign(side || 1);
  const r  = -sgn * deg * Math.PI/180;               // 때린 공은 반대쪽으로
  const ro =  sgn * od  * Math.PI/180;               // 맞은 공은 같은 쪽으로
  const keep = Math.sqrt(Math.max(0.04, 1 - thick*thick));
  let a = [(dx*Math.cos(r)  - dy*Math.sin(r))  * keep,
           (dx*Math.sin(r)  + dy*Math.cos(r))  * keep];
  let b = [(dx*Math.cos(ro) - dy*Math.sin(ro)) * thick,
           (dx*Math.sin(ro) + dy*Math.cos(ro)) * thick];
  const nn = Math.hypot(ox, oy);
  if (nn > 1e-9){
    const nx = ox/nn, ny = oy/nn;
    const closing = (a[0]-b[0])*nx + (a[1]-b[1])*ny;   // >0 이면 아직 다가간다
    if (closing > 0){                                  // 그만큼 서로 밀어낸다
      a = [a[0]-nx*closing, a[1]-ny*closing];
      b = [b[0]+nx*closing, b[1]+ny*closing];
    }
  }
  return {a, b};
}
function afterHit(from, to, obj){
  const D = T.ball_diameter;
  let dx = to[0]-from[0], dy = to[1]-from[1];
  const L = Math.hypot(dx, dy);
  if (L < 1e-9) return null;
  dx /= L; dy /= L;
  const ox = obj[0]-to[0], oy = obj[1]-to[1];
  const side = dx*oy - dy*ox;                    // 적구가 왼쪽(+)인가 오른쪽(−)인가
  const perp = Math.abs(side);                   // 접촉 순간 중심선까지 거리
  const thick = Math.max(0, Math.min(1, (D - perp) / D));
  const deg = separationAngle(thick);
  if (deg === null) return null;
  const sgn = Math.sign(side || 1);
  const r = -sgn * deg * Math.PI/180;                    // 수구는 적구 반대쪽으로
  const od = objectAngle(thick);
  // ★ 위 hitOut 하나로 낸다 — 시뮬레이션과 같은 값이어야 한다
  const o = hitOut(dx, dy, ox, oy, thick, deg, od === null ? 0 : od);
  const na = Math.hypot(o.a[0], o.a[1]), nb = Math.hypot(o.b[0], o.b[1]);
  const dir = na > 1e-9 ? [o.a[0]/na, o.a[1]/na] : [dx, dy];
  // 화면에 적는 분리각도 **보정된 값**으로. 안 그러면 글자와 그림이 다르다.
  const degOut = Math.acos(Math.max(-1, Math.min(1, dir[0]*dx + dir[1]*dy))) * 180/Math.PI;
  return {thick, deg: degOut, objDeg: od, degRaw: deg,
          dir,
          objDir: (od === null || nb <= 1e-9) ? null : [o.b[0]/nb, o.b[1]/nb]};
}

// 1적구를 맞은 뒤 수구 경로를 몇 쿠션까지 그리나.
// data/speed.json ★_충돌_후_그리는_쿠션 의 표 그대로. 표에 없는 값은 마지막 줄을 쓴다.
function afterCushions(used){
  if (!POST_CUSHIONS.length) return 7;
  const u = Math.max(0, used);
  const row = POST_CUSHIONS.find(r => r[0] === u);
  return row ? row[1] : POST_CUSHIONS[POST_CUSHIONS.length-1][1];
}

// ★★ 공이 굴러가는 시뮬레이션 (사용자 2026-08-13: '충돌 부분과 같이 공이 움직이는
//   시뮬레이션을 보고 싶습니다.')
//
// ⚠️⚠️ **빠르기는 근사다.** 충돌 뒤 속도를 우리는 안 재 봤다 (data/speed.json).
//    쓴 것 두 가지 —
//      ① 쿠션마다 31% 느려진다               ← speed.json 실측
//      ② 충돌에서 1적구가 가져가는 몫 = 두께  ← 중심선 성분(물리 기본)의 근사.
//         두꺼울수록 1적구가 많이 가져간다.
//    ★ 그러므로 **이 그림으로 키스를 판정하면 안 된다.** 길은 맞고 시각은 모른다.
// ★★ 사용자 2026-08-13: '마지막에는 공들의 속도가 각각 **자연스럽게 줄어들면서
//   정지**해야 하는데.'  → 마찰 감속을 넣는다.
//   전에는 구간마다 속도가 일정하고 쿠션에서만 31% 떨어져서 **끝에서 뚝 멈췄다.**
//   이제 굴러가는 내내 일정하게 느려지고, 힘이 다하면 그 자리에 선다.
//     v(t) = v0 − a·t        구르는 마찰은 감속이 거의 일정하다
//
// ★★ 사용자 2026-08-13 정정 — '**쿠션을 만나면 속도가 줄어들지 않고 오히려 증가합니다.**
//   그래서 공이 힘이 실리는 겁니다. 바닥을 굴러갈 때는 힘을 점점 잃어가다가
//   쿠션을 만나면 공의 **회전 때문에 조금 더** 굴러가는 겁니다.'
//
//   ⚠️⚠️ 내가 **이중으로 깎고 있었다.** speed.json 을 다시 읽어 보니 —
//     '수구가 n번 쿠션을 나온 뒤 그 **구간의 평균 속도**. 쿠션 하나 지날 때마다
//      다음 구간 평균속도가 0.687배. 297쌍 중앙값.'
//   그 31% 는 **바닥을 굴러가며 잃은 것**이지 쿠션에서 잃은 것이 아니다.
//   그런데 나는 마찰 감속을 넣고 **거기에 또 쿠션마다 0.69 를 곱했다.**
//
//   → 마찰만으로 **구간 평균속도가 0.687 배**가 되게 감속을 잡고,
//     쿠션에서는 깎지 않고 오히려 조금 준다.
//   ★ 숫자로 풀었다 — 출발 2600mm/s · 구간 1500mm 로 놓고 감속을 훑어
//     네 구간 평균비가 0.687 에 제일 가까운 값을 골랐다.
//        쿠션 ×1.00 이면  a = 500
//        쿠션 ×1.06 이면  a = 620   ← 이걸 쓴다 (평균비 0.687, 5구간까지 굴러감)
//        쿠션 ×1.12 이면  a = 740
//     그래서 CUSHION_GAIN 을 얼마로 잡든 **실측 31% 는 지켜진다.** 사용자가
//     '쿠션에서 얼마나 붙는지' 숫자를 주면 위 표에서 짝을 골라 같이 바꾸면 된다.
//   ⚠️ 1.06 은 내 짐작이다. 크기는 아직 못 받았다.
// ★ 사용자 2026-08-13: '공 3개 모두 현재 속도에서 30% 더 내려 자연스럽게.'
//   '30% 내리라고 한것은 **시물레이션 속도**를 말하는 겁니다. 공이 진행하는 힘은 그냥두세요.'
//   ⚠️ 기준이 바뀌었다. 옛 모델(등감속 500)은 공이 2.7초 만에 죽어서 0.5 로 봐도 빨랐다.
//      실측 마찰을 넣은 지금은 **한 샷이 실제처럼 10초쯤** 간다 (영상도 8.2초였다).
//      0.35 로 보면 30초짜리가 된다. 그래서 **실제 다이보다 30% 느리게** 로 다시 잡는다.
//   보는 속도만 늦춘다 — 가는 거리와 서는 자리는 그대로다.
// ★ 사용자 2026-08-13: '시뮬레이션 속도도 10% 올려보세요.'  0.70 × 1.10 = 0.77
//   다시 '스피드 10씩 더 올려주세요' · '모두 올려주세요' → 0.70 × 1.1³ = 0.94
//   ★ 0.94 는 사실상 **실제 다이와 같은 속도**다. 더 올리면 실제보다 빨라진다.
const PLAY_RATE = 0.94;
// ★ 초구 뿌리기 보는 속도 (물리는 안 바뀐다). 사용자 2026-08-14:
//   '공이 너무 빨리 날라다닙니다. 마지막에 서서히 멈추게 해 주세요.'
//   → 2.6배 고정이던 것을 **속도에 따라** 2.2 → 1.4 로 내린다.
//     빠를 때 덜 빠르고, 느려질수록 더 천천히 보여 자연스럽게 선다.
//   던지기 60개로 잰 화면 시간: 2.6고정 4.2초 · 1.4~2.2 **7.6초** · 1.0~1.8 10.5초
const SCATTER_HI = 2.2, SCATTER_LO = 1.4, SCATTER_V = 1500;
// ★ 사용자 2026-08-14: '마지막에 정지할때 조금만 더 자연스러우면 좋겠어요.
//   천천히 멈추게 각 3개가 각자.'
//   → 엔진 기본은 150mm/s 에서 뚝 세운다. 뿌리기만 50 으로 낮춰 각자 미끄러져 선다.
//   ★★ 2026-08-16 — 그래도 남아 있었다. 사용자: '초구배치도 자세히 보니 마지막에
//      약간 급하게 공들이 정지하네요.' 50mm/s 는 화면에서 아직 보이는 속도다.
//      재생과 **같은 자리**의 문제였다 — 끊는 값이 있으면 거기서 얼어붙는다.
//      → 5 로 내린다. 마지막 150mm/s 는 accelPlay 가 이어서 0 까지 데려간다.
//      ⚠️ 이 값은 **공이 서는 자리**도 정한다 (배치를 뽑을 때 같은 값을 쓴다).
//         5 로 내리면 공이 조금 더 굴러가 선다 — 화면과 자리가 같이 움직이므로 맞다.
const SCATTER_STOP = 5;
// ★★ 사용자 2026-08-13: '수구가 3쿠션 후 다이에서 **가속도가 붙습니다.**'
//   ⚠️ 내가 **모든 꺾임점마다** 쿠션 이득(×1.06)을 걸고 있었다. 쿠션이 아닌 곳
//      (1적구·2적구 충돌점, 연장 구간)에서도. 구간이 짧으면 마찰로 잃는 것보다
//      1.06 이 커져서 **속도가 올라간다** —
//        구간 600mm 씩: 1675 1522 1329 1071 673  (정상)
//        구간 150mm 씩: 1852 1910 1972 2040 2113  (가속!)
//   → 꺾임점이 **쿠션 위인지** 보고 건다. 공에 부딪힌 자리에서는 오히려 잃는다.
function onRail(p){
  const e = 8;                            // mm — 쿠션 날에 닿았다고 볼 여유
  return p[0] < e || p[0] > T.width - e || p[1] < e || p[1] > T.height - e;
}
const BALL_KEEP = 0.55;                   // 공에 부딪히면 남는 몫 (넘겨준 만큼 잃는다)
const V_STOP = 150;                       // mm/s — 이보다 느려지면 선 것으로 본다

            h.p[1] < e || h.p[1] > T.height - e) h.v = 0;
        else { const nv = h.v - accelAt(h.v)*dt; h.v = nv < SIM_PLAY_STOP ? 0 : nv; }

      if (!mv || mv.v <= 0) continue;

      if (dd >= D) continue;

      const L = dd || 1;
      h.dir = [(h.p[0]-q[0])/L, (h.p[1]-q[1])/L];   // 중심선 방향으로 밀려난다
      h.v = Math.max(250, mv.v * 0.85);

      //    적게 잃는 쪽으로 둔다 (사용자 2026-08-16: '너무 차이가 납니다').
      mv.v *= 0.70;

function playMoving(pl){
  return (pl.cue && pl.cue.v > 0) || (pl.obj && pl.obj.v > 0) ||
         (pl.rest || []).some(h => h.on && h.v > 0);
}

// ★★★ 굴러가는 공을 **놓인 공과 똑같이** 그린다 (사용자 2026-08-16 발견:
//   '배치된 공은 빛이 나는데 시뮬레이션시 공은 단색임. 움직임이 끝나면 빛나는 공으로 변함')
//   ⚠️ 여기가 '부자연스럽다' 의 절반이었다. 물리가 아니라 **그림**이 달랐다.
//      납작한 원이 굴러가다 멈추는 순간 갑자기 구슬로 바뀌니 딴 공처럼 보인다.
//   → 그림자 · 구(球) 그러데이션 · 테두리를 drawBalls 와 같은 값으로 맞춘다.
//     수구의 금색 링도 그대로 달고 굴러간다 — 어느 것이 내 공인지 계속 보인다.
function simBall(p, color, R, isCue){
  const [x,y] = toPx(...p);
  g.save();
  g.fillStyle = 'rgba(0,0,0,0.45)';
  g.beginPath(); g.ellipse(x+R*0.12, y+R*0.30, R*0.95, R*0.42, 0, 0, 7); g.fill();
  g.restore();
  const base = TONE[color] || '#fff';
  const sph = g.createRadialGradient(x-R*0.34, y-R*0.38, R*0.05, x, y, R*1.06);
  sph.addColorStop(0,   '#ffffff');
  sph.addColorStop(0.30, base);
  sph.addColorStop(1,   shade(base, 0.42));
  g.fillStyle = sph;
  g.beginPath(); g.arc(x,y,R,0,7); g.fill();
  g.strokeStyle = '#14141a'; g.lineWidth = Math.max(1.5, R*0.12); g.stroke();
  if (isCue){
    // ★ 수구 금색 링을 **1/3로** 줄인다 (사용자 2026-08-17: '시뮬레이션시 수구 테두리
    //   3/1로 줄이세요. 너무 큰 공이 움직이는 것 같아서 현실감이 떨어져요').
    //   굵은 링이 공 바깥에 붙으니 공이 그만큼 커 보였다. 놓인 공(drawBalls)의 링은
    //   **어느 것이 내 공인지** 알려 주는 표시라 그대로 두고, 굴러갈 때만 줄인다.
    g.save();
    g.strokeStyle = '#ffdd33'; g.lineWidth = Math.max(1, R*0.14);
    g.beginPath(); g.arc(x, y, R + g.lineWidth*0.7, 0, 7); g.stroke();
    g.restore();
  }
}
function drawPath(){
  const cue = S.balls.cue;

  if (!hits.length) return;
  const full = [cue.p, ...hits.map(h => h.p)];
  const cut = cutAtBall(full);
  const cols = [COL.aim, COL.c12, COL.c23, COL.after, COL.after, COL.after];

  const el = S.rblink ? (nowMs() - S.rblink) : 1e9;

  // ★★★★ 여기서부터 그리는 선은 **엔진이 낸 것**이다 (사용자 2026-08-16: '그냥 3으로')

  //   화면에 **긋는 좌표만** 엔진 것으로 바꾼다. 그러면 그린 선 = 굴러갈 길이다.
  //   ⚠️ 엔진이 길을 못 내면(planShot 실패 등) 예전 기하 선으로 그대로 그린다.
  //   ⚠️ 공이나 조준을 **끌고 있는 동안**에는 엔진을 안 돌린다. 한 번에 10~25ms 라

  //   대회전(28.jpg)은 흐린 선을 따라가면 7쿠션까지 보인다.
  // ⚠️ 지저분해 보이는 것은 결국 **띠(공 두께 폭)** 때문이다. 6쿠션부터 띠를 빼면 된다.

  // ⚠️ 1~5쿠션에 띠를 넣는 이유: 어디로 지나가는지 폭까지 봐야 키스가 보인다.

  //   연장궤적이 그려져야** 합니다.' 득점이 되는지가 거기서 갈리므로, 표대로 끊더라도

    g.moveTo(kx-kr, ky-kr); g.lineTo(kx+kr, ky+kr);

  //   ⚠️⚠️ 범인이 여기였다. 옛 코드는 반쯤 그린 점을 **pts2 에 되썼다** —

      //   → 2적구까지 이어 붙이는 구간도 얇은 선이 아니라 **띠(공 두께 폭)** 로 그린다.
      //   득점이 되는 길이라 폭까지 보여야 한다 — 키스도 여기서 보인다.
      seg(qa, qb, band, 0.22, c);
      seg(qa, qb, thin, 0.95, c);
    }
  }

  drawCushionDots(pts2, Math.min(BAND_UPTO, pts2.length - 1 - (post.hit ? 1 : 0)));
  // 마지막 쿠션 다음 **방향**만 절반 길이로. 제일 흐리게.
  // ⚠️ 그 안에서 공에 맞았으면 그리지 않는다 — '공에 닿으면 이후는 지운다'.

    const tail = cutAtBall([aN, half], cut.obj);
    for (let i = 0; i < tail.pts.length-1; i++)
      seg(tail.pts[i], tail.pts[i+1], thin, 0.20, COL.after);
  }

  // 1적구는 회전·당점의 영향을 안 받고 두께로만 방향이 정해지므로 계산할 수 있다.
  if (a.objDir){
    // ★ 사용자 지시 2026-08-10: '1적구 경로를 **3쿠션까지만** 보여줍시다, 힘에
    //   관계없이. 공에 맞았을 경우입니다. 안 맞았을 경우 4쿠션까지 연장합니다.'
    //   → 3쿠션 안에서 공에 맞으면 거기서 끊고, 아무 공에도 안 맞으면 4쿠션까지.
    // ⚠️ 얼마나 굴러가는지는 아직 모른다 — 1적구가 받는 **충격량**을 안 재서다.
    //    전에 6쿠션까지 그렸더니 34% 얇은 두께에도 다이 전체를 덮었다 (3.jpg).
    //    이제는 '힘에 관계없이 몇 쿠션' 이라는 사용자 기준을 그대로 쓴다.
    let oq = cutAtBall([cut.obj, ...rollPlain(cut.obj, a.objDir, 3).map(h => h.p)], cut.obj);
    if (!oq.hit)
      oq = cutAtBall([cut.obj, ...rollPlain(cut.obj, a.objDir, 4).map(h => h.p)], cut.obj);
    let op = oq.pts;
    if (EP && EP.obj && EP.obj.p.length > 1){
      let rails = 0, end = 0, ballHit = false;
      for (let i = 1; i < EP.obj.p.length; i++){
        if (EP.obj.k[i] === 'ball'){ end = i; ballHit = true; break; }
        if (EP.obj.k[i] === 'rail' && ++rails > 3) break;
        end = i;
      }
      if (!ballHit && rails <= 3){                    // 아무 공에도 안 맞으면 4쿠션까지
        for (let i = end + 1; i < EP.obj.p.length; i++){
          if (EP.obj.k[i] === 'ball') break;
          if (EP.obj.k[i] === 'rail' && ++rails > 4) break;
          end = i;
        }
      }
      if (end > 0) op = EP.obj.p.slice(0, end + 1);
    }
    // ⚠️ 수구의 1→2쿠션 구간도 노란색이라 1적구 궤적과 헷갈린다. 점선으로 갈라 준다.
    g.save(); g.setLineDash([Math.max(8, thin*4), Math.max(6, thin*3)]);
    for (let i = 0; i < op.length-1; i++){
      seg(op[i], op[i+1], band, 0.18, COL.obj);
      seg(op[i], op[i+1], Math.max(2, thin*0.8), 0.95, COL.obj);
    }
    g.restore();
    // ★★ 시뮬레이션 — 공 3개를 **객체로** 굴린다 (엔진은 위 simStep 참고)
    //   ⚠️⚠️ 사용자 2026-08-13: '수구 1적구 모두 원쿠션에서 2번 출발을 합니다.'
    //     옛 코드는 여기서 **매 프레임** needV0 로 세기를 다시 풀었다. 그런데 위
    //     궤적선 애니메이션이 pts2 를 깎아 놓아서 프레임마다 경로가 달라졌고,
    //     세기가 1867~2344 를 오르내리며 공이 뒤로 밀렸다. (그 되쓰기는 없앴다)
    //   → 이제 **▶ 누른 뒤 첫 프레임에 딱 한 번**만 풀고 상태로 들고 간다.
    //     그 뒤로는 공이 스스로 굴러간다 — 길을 미리 알 필요가 없다.
    if (S.anim){
      const R = Math.max(4, T.ball_diameter*L.sc*0.5);
      if (!S.sim){
        // ★★★ 재생은 **물리 엔진**이다 (사용자 2026-08-16:
        //   '공은 초구배치 움직이듯이 돌아다녀야 합니다. 반드시.')
        //   초구 뿌리기와 같은 엔진이라 구르고, 부딪히고, 천천히 선다.
        //   ⚠️ 궤적과 어긋나던 뿌리는 simStep 에서 뽑았다 — 재생에서는 엔진도
        //      bend 를 **속도 없이** 부른다. 그리는 쪽과 같은 반사각이 나온다.
        const share = Math.max(0.10, Math.min(0.95, a.thick));
        const keepC = Math.sqrt(Math.max(0.04, 1 - share*share));
        // ★ 그린 선을 낸 그 세기 그대로. 엔진이 이미 '2적구에 닿을 만큼 × 110%' 로 풀었다.
        const V0 = (EP && EP.V0) ? EP.V0
                 : simNeedV0([...before, ...pts2.slice(1)], keepC) * SIM_PLAY_BOOST;
        S.sim = simInit(dirOf(cue.p, S.aim), V0, kk, englishSide());
        S.sim.sameAsPath = 1;                    // 그리는 쪽과 같은 반사각으로
        S.sim.stop = SIM_PLAY_STOP;              // 2적구를 맞고도 조금 더 구른다
        S.simLast = performance.now();
        S.simRest = S.simLast;
        S.simAcc  = 0;
      }
      const now = performance.now();
      // 본 시간 → 물리 시간. PLAY_RATE 만큼 느리게 **보기만** 한다.
      // ⚠️ 창을 가렸다 돌아오면 dt 가 몇 초씩 튄다. 0.20 초로 막는다.
      S.simAcc += Math.min(0.20, Math.max(0, (now - S.simLast)/1000)) * PLAY_RATE;
      S.simLast = now;
      if (S.simAcc > 0.20) S.simAcc = 0.20;
      while (S.simAcc >= SIM_DT){ simStep(S.sim, SIM_DT); S.simAcc -= SIM_DT; }
      for (const b of S.sim.balls) simBall(b.p, b.color, R, b.key === 'cue');
      // ★ 사용자 2026-08-13: '시뮬레이션 종료 후 공이 멈추고 1초 후 전 상태로.'
      const moving = S.sim.balls.some(b => b.v[0] || b.v[1]);
      if (moving) S.simRest = now;
      if (!moving && now - S.simRest > SIM_TAIL*1000){ S.anim = 0; S.sim = null; }
    }
    for (let i = 1; i < op.length - (oq.hit ? 1 : 0); i++){
      const [x,y] = toPx(...op[i]);
      g.fillStyle = COL.obj; g.beginPath(); g.arc(x,y,4,0,7); g.fill();
      g.strokeStyle = '#14141a'; g.lineWidth = 2; g.stroke();
    }
  }

  if (scoreHit){                                  // 다음 공에 맞은 자리 = 득점
    const [x,y] = toPx(...pts2[pts2.length-1]);
    g.fillStyle = '#6eeb5a'; g.beginPath(); g.arc(x,y,11,0,7); g.fill();
    g.strokeStyle = '#14141a'; g.lineWidth = 3; g.stroke();
  }
  // 두께·분리각을 접촉점 옆에 적는다.
  // ⚠️ 접촉점 **바로 위**에 적으면 1적구가 덮는다 (사용자 지적, ss.jpg).
  //    draw() 가 경로를 먼저 그리고 공을 나중에 그려서 글자가 공 밑으로 들어간다.
  //    '32%  35°' 의 가운데가 가려져 각도 두 개처럼 보였다.
  //    → 1적구 **반대쪽**으로 민다. 공이 어디 있든 자동으로 반대편에 붙는다.
  g.save();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const fs = Math.max(11, L.cloth.h*0.045);
  g.font = '800 ' + Math.round(fs) + 'px system-ui, sans-serif';
  g.lineJoin = 'round'; g.strokeStyle = '#14161a'; g.lineWidth = Math.max(3, fs*0.28);
  const txt = Math.round(a.thick*100) + '%  ' + Math.round(a.deg) + '°';
  const [obx, oby] = toPx(...cut.obj);
  let vx = hx - obx, vy = hy - oby;
  const vn = Math.hypot(vx, vy) || 1;
  vx /= vn; vy /= vn;
  const off = ballR()*2.0 + fs*0.9;
  const half = g.measureText(txt).width/2 + fs*0.3;
  const c2 = L.cloth;
  // 천 밖으로 나가지 않게 잡아 둔다
  const tx = Math.min(Math.max(hx + vx*off, c2.x + half), c2.x + c2.w - half);
  const ty = Math.min(Math.max(hy + vy*off, c2.y + fs*0.7), c2.y + c2.h - fs*0.7);
  g.strokeText(txt, tx, ty); g.fillStyle = COL.hit;
  g.fillText(txt, tx, ty);
  g.restore();
}

function drawCushionDots(pts, upto){

    const [x,y] = toPx(...pts[i]);
    g.fillStyle = COL.c23; g.beginPath(); g.arc(x,y,6,0,7); g.fill();
    g.strokeStyle = '#14141a'; g.lineWidth = 2; g.stroke();
  }
}
// ★ 뿌리는 장면 — 다 설 때까지 보여 주고, 서면 그 자리를 배치로 굳힌다.
//   돌아가는 동안에는 공을 여기서 그리므로 drawBalls() 는 건너뛴다.
// 뿌리는 중에 화면을 누르면 기다리지 않고 끝까지 굴려 확정한다.
function scatterFinish(){
  const sc = S.scatter;
  if (!sc) return;
  let n = 0;
  while (n++ < 90000 && sc.sim.balls.some(b => b.v[0] || b.v[1])) simStep(sc.sim, SIM_DT);
  const q = sc.sim.balls;
  S.balls = {cue:  {p: q[0].p.slice(), color:'white'},
             obj1: {p: q[1].p.slice(), color:'yellow'},
             obj2: {p: q[2].p.slice(), color:'red'}};
  S.scatter = null;
}

function drawScatter(){
  if (!S.scatter) return false;
  const sc = S.scatter, now = performance.now();
  // ★ 뿌리기는 다 서는 데 11초쯤 걸린다 (200판 중앙값) — 보기엔 너무 길다.
  //   **보는 속도만** 빠르게 한다. 물리는 그대로라 서는 자리는 안 바뀐다.
  const spNow = Math.max(...sc.sim.balls.map(b => Math.hypot(b.v[0], b.v[1])));
  const rate = Math.max(SCATTER_LO, Math.min(SCATTER_HI, spNow / SCATTER_V));
  sc.acc += Math.min(0.20, Math.max(0, (now - sc.last)/1000)) * rate;
  sc.last = now;
  if (sc.acc > 0.20) sc.acc = 0.20;
  while (sc.acc >= SIM_DT){ simStep(sc.sim, SIM_DT); sc.acc -= SIM_DT; }
  const R = ballR();
  // ★ 뿌리는 동안은 **수구 표시를 안 한다** (사용자 2026-08-16:
  //   '초구 시물레이션시는 수구표시하지 마세요. 정지후 표시하면 됩니다.')
  //   뿌리기는 어느 것이 내 공인지 아직 정해지기 전이다. 금색 링은 다 서고 나서
  //   drawBalls 가 그린다. v323 에서 굴러가는 공에 링을 달면서 여기까지 따라왔다.
  for (const b of sc.sim.balls) simBall(b.p, b.color, R, false);
  const moving = sc.sim.balls.some(b => b.v[0] || b.v[1]);
  if (moving) sc.rest = now;
  else if (now - sc.rest > 500){                 // 다 서고 잠깐 뒤 확정
    const q = sc.sim.balls;
    S.balls = {cue:  {p: q[0].p.slice(), color:'white'},
               obj1: {p: q[1].p.slice(), color:'yellow'},
               obj2: {p: q[2].p.slice(), color:'red'}};
    S.scatter = null;
  }
  return true;
}

function drawBalls(){
  // ★ 사용자 2026-08-13: '시뮬레이션이 시작되면 **배치 전 공은 지워져야** 하고
  //   실제 시뮬레이션을 하고 있는 공만 보여져야 합니다. 둘 다 보이니 이상합니다.'
  if (S.anim) return;
  for (const k in S.balls){
    const b = S.balls[k], [x,y] = toPx(...b.p), rr = ballR();
    // ⚠️ 검은 천에서는 검은 테두리가 안 보인다. 하이라이트와 접지 그림자로 띄운다.
    g.save();
    g.fillStyle = 'rgba(0,0,0,0.45)';
    g.beginPath(); g.ellipse(x+rr*0.12, y+rr*0.30, rr*0.95, rr*0.42, 0, 0, 7); g.fill();
    g.restore();
    const base = TONE[b.color] || '#fff';
    const sph = g.createRadialGradient(x-rr*0.34, y-rr*0.38, rr*0.05, x, y, rr*1.06);
    sph.addColorStop(0,   '#ffffff');
    sph.addColorStop(0.30, base);
    sph.addColorStop(1,   shade(base, 0.42));
    g.fillStyle = sph;
    g.beginPath(); g.arc(x,y,rr,0,7); g.fill();
    // ⚠️ 폰에서 공이 작아 얇은 테두리는 안 보인다. 수구는 **공 바깥에 굵은 링**을
    //    따로 그려 확실히 구분한다 (사용자 지적: 수구 테두리가 안 보인다).
    const r = ballR();
    g.strokeStyle = '#14141a'; g.lineWidth = Math.max(1.5, r*0.12); g.stroke();
    // 수구는 금색 링을 **계속** 유지한다. 나머지는 방금 놓였을 때만 잠깐 깜박인다
    // (사용자 지시: 3초간 금색 테두리 블링크 후 지우기).
    const on = k === 'cue' ? 1 : blinkAlpha();
    if (on > 0){
      g.save();
      g.globalAlpha = on;
      g.strokeStyle = '#ffdd33';
      g.lineWidth = Math.max(3, r * 0.42);
      g.beginPath(); g.arc(x, y, r + g.lineWidth*0.7, 0, 7); g.stroke();
      g.restore();
    }
  }
}

// 방금 공이 놓이거나 움직였으면 3초간 깜박인다. 0 이면 안 그린다.
function blinkAlpha(){
  if (!S.blink) return 0;
  const left = S.blink - Date.now();
  if (left <= 0){ S.blink = 0; return 0; }
  return 0.35 + 0.65 * Math.abs(Math.sin(left / 1000 * Math.PI * 2));
}
// ⚠️ const 화살표로 두면 선언 전에 불릴 때 화면이 통째로 죽는다 (전에 겪었다).
//    함수 선언으로 둬서 끌어올려지게 한다.
function blink(){ S.blink = Date.now() + 3000; }
// ─────────────────────────────── 경로 리스트 (사용자 UI 안 · 2026-08-11)
// '3칸 세로 2칸 해서 6개를 보여주면 어떨까요 (직접조준도 있으니 5개네요)'
// '리스트 마지막에 직접조준'
// 미리보기는 작으니 **큰 것 하나 + 색 하나** 만 넣는다 —
//   가운데에 그 경로, 아래에 진로 이름. 키스가 나면 테두리를 빨갛게.
const ROUTE_CELLS_PAGE = 6;   // 한 페이지 칸 수 (2행 × 3열 — 지금 그대로)
const ROUTE_PAGES = 2;
const ROUTE_SHOW_CELLS = ROUTE_CELLS_PAGE * ROUTE_PAGES;   // 12 = 경로 11 + 직접조준
let ROUTE_CELLS = [];
// 한 경로의 궤적을 점 목록으로 (미리보기용)
// ★★ 사용자 2026-08-13: '미리보기 궤적이 정교하지 않습니다. 보여준 것과 실제 경로가
//   차이가 납니다.'  원인은 자석 때와 같았다 —
//     ① 미리보기가 **그 경로의 당점이 아니라 화면에 켜져 있는 당점**으로 다시 굴렸다
//        (englishSideFor 가 S.tipH 를 읽는다). 훑기는 당점 42가지를 돌려 보므로
//        그 경로를 만든 당점과 화면 당점이 거의 늘 다르다.
//     ② **보정(S.corr)을 안 걸었다** — roll 에 k=0 을 넘기고 있었다.
//   그 경로의 당점을 잠깐 씌우고 굴린 뒤 되돌린다.
function routePoly(r){
  const cue = S.balls.cue;
  if (!cue || !r) return null;
  const hS = S.tipH, vS = S.tipV, rS = S.tipR;
  if (r.tip !== undefined){
    S.tipH = r.tip;
    if (r.tipV !== undefined) S.tipV = r.tipV;
    S.tipR = Math.min(3, Math.hypot(S.tipH, S.tipV));
  }
  let k = 0;
  if (S.corr){
    const len = 2000, aim = [cue.p[0]+Math.cos(r.a)*len, cue.p[1]+Math.sin(r.a)*len];
    try { pathFromAim(cue.p, aim, S.corr); k = LAST_K; } catch(e){ k = 0; }
  }
  const d = [Math.cos(r.a), Math.sin(r.a)];
  const E = englishSideFor(cue.p, d);
  let out;
  const mc = (r.cushions >= 6) ? BIG_MAX_C : SWEEP_MAX_C;
  const seq = roll(cue.p, d, mc, k, E);
  const c1 = cutAtBall([cue.p, ...seq.map(h => h.p)]);
  if (!c1.hit) out = [cue.p, ...seq.map(h => h.p)];
  else {
    const P = c1.pts[c1.pts.length-1], af = afterHit(c1.from, P, c1.obj);
    if (!af) out = c1.pts;
    else {
      const s2 = roll(P, af.dir, mc, k, E);
      const c2 = cutAtBall([P, ...s2.map(h => h.p)], c1.obj);
      out = [...c1.pts, ...c2.pts.slice(1)];
    }
  }
  S.tipH = hS; S.tipV = vS; S.tipR = rS;
  return out;
}
function drawRouteList(){
  ROUTE_CELLS = [];
  if (!S.routeList || previewOn()) return;
  const c = L.cloth;
  g.fillStyle = 'rgba(8,10,14,0.88)';
  g.fillRect(c.x, c.y, c.w, c.h);
  const list = routesReady() || [];
  const pad = Math.max(6, c.w*0.014);
  const cw = (c.w - pad*4)/3, chh = (c.h - pad*3)/2;
  const pg = Math.max(0, Math.min(ROUTE_PAGES-1, S.routePage|0));
  for (let j = 0; j < ROUTE_CELLS_PAGE; j++){
    const i = pg*ROUTE_CELLS_PAGE + j;                    // 목록 전체에서의 번호
    const gx = c.x + pad + (j%3)*(cw+pad), gy = c.y + pad + Math.floor(j/3)*(chh+pad);
    ROUTE_CELLS.push({x:gx, y:gy, w:cw, h:chh, i});
    const last = (i === ROUTE_SHOW_CELLS-1);
    const r = last ? null : list[i];
    if (!last && !r) continue;                       // 경로가 모자라면 빈칸
    const on = last ? (S.routeIx < 0) : (S.routeIx === i);
    g.fillStyle = last ? '#242a33' : '#1a2029';
    round(gx, gy, cw, chh, chh*0.10); g.fill();
    // ★ 판정 (사용자 2026-08-14) — 불가면 테두리와 딱지로 바로 보인다
    const vv = r ? verGet(r) : undefined;
    g.strokeStyle = vv === '0' ? '#e05a52'
                  : (r && r.kiss) ? '#ff3b30' : on ? '#ffd400' : '#3a4450';
    g.lineWidth = Math.max(2, chh*(on || vv === '0' || (r&&r.kiss) ? 0.035 : 0.018));
    g.stroke();
    // ★ 사용자 2026-08-12: '3쿠션이 성공할 수 있는 두께와 당점을 제공해 주세요.'
    // 글자는 진로와 두께까지. **당점은 글자가 아니라 공 그림으로** 낸다 (아래).
    const label = last ? '직접 조준'
      : (r.name || '') + '  8/' + thick8(r.thick*8);
    if (!last){
      // 작은 당구대 — 2:1 로 넣고 그 안에 공과 길을 그린다
      const m = chh*0.14, aw = cw - m*2, ah = chh*0.62;
      const k = Math.min(aw/T.width, ah/T.height);
