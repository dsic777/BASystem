// 진단 패널 — 본 스크립트가 죽어도 이건 살아 있어야 하므로 따로 둔다.

if (location.search.indexOf('debug') >= 0) D.style.display = 'block';
function log(t){ D.textContent += t + String.fromCharCode(10); }
log('BASystem 진단 v8');
log('URL ' + location.href);
log('화면 ' + innerWidth + 'x' + innerHeight + ' dpr ' + devicePixelRatio);
addEventListener('error', function(e){
  var t = '★ERR ' + (e.message||e.type) + ' @' + (e.lineno||'?') + ':' + (e.colno||'?');
  log(t);
  // ⚠️ 진단 패널은 평소 숨겨져 있다. 오류만은 **항상 보이는 곳**에도 띄운다.
  //    폰에서는 주소를 칠 수 없어 ?debug 를 붙일 방법이 없다.
  var m = document.getElementById('msg');
  if (m) { m.style.display = 'block'; m.textContent = t; }
});
addEventListener('unhandledrejection', function(e){ log('★REJ ' + e.reason); });
if ('serviceWorker' in navigator)
  navigator.serviceWorker.getRegistrations().then(function(rs){
    log('서비스워커 ' + rs.length + '개' + (rs.length ? ' → 삭제' : ''));
    rs.forEach(function(r){ r.unregister(); });
    if (rs.length) log('※ 삭제됨. 한 번 더 새로고침 하세요');
  });
if (window.caches)
  caches.keys().then(function(ks){
    log('캐시 ' + ks.length + '개' + (ks.length ? ' → 삭제' : ''));
    ks.forEach(function(k){ caches.delete(k); });
  });
['data/table_medium.json','data/five_half_numbers.json','data/measured_bounce.json','data/english.json']
  .forEach(function(u){
    fetch(u + '?t=' + Date.now()).then(function(r){ log('fetch ' + u + ' → ' + r.status); })
      .catch(function(e){ log('★fetch ' + u + ' 실패 ' + e); });
  });

<script>
// ⚠️ 버전 관리 — jbpro2.2 와 같은 방식.
//    코드를 고치면 **이 상수와 version.json 의 mobile 값을 같이 N+1** 한다.
//    안 올리면 폰에 캐시된 옛 화면이 계속 나온다.
const MOBILE_VER = 367;
var NOTE_OPEN = false;        // 요청 창이 열려 있나 (열려 있으면 새로고침을 미룬다)
function checkVersion(){
  fetch('version.json?t=' + Date.now())
    .then(r => r.json())
    // ★ 사용자 요청 #3 (2026-08-16): '1분 버전확인시에는 이부분 관여하지 말것'
    //   글을 쓰는 중에 새로고침이 걸리면 쓰던 글이 통째로 날아간다.
    //   창이 닫히면 다음 확인(60초)에서 알아서 새로고침된다.
    //   ⚠️ NOTE 는 let 이라 window 에 안 올라간다. var 로 따로 든다 (호이스팅돼서
    //      checkVersion 이 먼저 돌아도 안전하다).
    .then(v => { if (v.mobile > MOBILE_VER && !NOTE_OPEN) location.reload(true); })
    .catch(() => {});
}
checkVersion();
setInterval(checkVersion, 60000);
// ★ 답이 왔는지 60초마다 본다 (위 NOTE 주석). 창이 열려 있으면 화면도 새로 그린다.
setInterval(() => { noteSync(); if (NOTE.open) noteDraw(); }, 60000);
window.addEventListener('load', () => {
  const on = (id, fn) => { const e = document.getElementById(id); if (e) e.onclick = fn; };
  on('noteKindA', () => noteKind('평가'));
  on('noteKindB', () => noteKind('요청'));
  on('noteCancel', noteClose);
  on('noteSave', noteSave);
  noteSync();
});
// 파이브앤하프 모바일 — 윈도우판(ui/app.py)과 같은 두뇌를 쓴다.
// 값(규격·번호표·실측 반사표)은 data/ 를 그대로 읽는다. 두 벌로 나누지 않는다.
// ⚠️ 저장소 뿌리에 둔다. 서버가 /basystem/ 을 이 폴더로 바로 서비스하므로
//    주소가 /basystem/ 하나로 끝난다 (사용자 확정).
const cv = document.getElementById('c'), g = cv.getContext('2d');
const msg = document.getElementById('msg');
let T, SCALES, BOUNCE, SEP = [], SEP_OBJ = [], POST_CUSHIONS = [];

const RAILS = {bottom:[0,1], right:[-1,0], top:[0,-1], left:[1,0]};   // 안쪽 법선
const COL = {aim:'#fafafa', c12:'#ffd600', c23:'#6eeb5a', after:'#ebf0fa',
             hit:'#ff78be',    // 수구가 적구에 닿은 자리 · 그 뒤 경로
             obj:'#ff2f22'};   // 1적구 궤적 — 공 색과 무관하게 늘 적색 (사용자 확정)
// 다이 색 — 파란 천에서 **차콜**로 (design.png 방향). 배경을 무채색으로 내리면
// 남는 색이 전부 정보가 된다 (궤적·눈금·공).
// 다이 색 — 파란 천에서 **차콜**로 (design.png 방향). 배경을 무채색으로 내리면
// 남는 색이 전부 정보가 된다 (궤적·눈금·공).
// ★★ 2026-08-17 — 녹색 · 짙은 파랑 · 0808 실제 파랑(#449cea)까지 셋을 다 해 보고
//   **차콜로 되돌렸다.** 사용자: '당구장은 파란색이에요' → 실제 색으로 갔더니
//   '더 안보여요. 돌아갑시다.'  당구장처럼 보이는 것보다 **눈금이 읽히는 것**이 먼저다.
//   재 본 대비 (4.5:1 이면 통과) —
//     차콜 #24272c   수구수 12.6 · 1쿠션 8.0 · 3쿠션 9.9 · 오렌지 6.5 · 핑크 5.7
//     실제 파랑      수구수  2.8 · 1쿠션 1.5 · 3쿠션 1.9 · 오렌지 1.3 · 핑크 1.1
//   ⚠️ 1쿠션 하늘색은 파란 천과 **같은 계열**이라 특히 안 보인다 (1.5:1).
//      천을 파랑으로 다시 가려면 그 색부터 바꿔야 한다.
const FELT = '#24272c', FELT_HI = '#31353c', FELT_EDGE = '#15171a';
// #rrggbb 를 k 배로 어둡게
function shade(hex, k){
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.round(v*k);
  return 'rgb(' + f(n>>16 & 255) + ',' + f(n>>8 & 255) + ',' + f(n & 255) + ')';
}
const TONE = {white:'#f6f5ee', yellow:'#f0be28', red:'#d6342c'};

// ---------------------------------------------------------------- 실측 반사표
// 입사각 → 반사각. 표는 **좌우 2팁**으로 잰 것이다 (data/measured_bounce.json 의 by_tip).
//   실측 45도 벌어짐 +11.0  ↔  사용자 가이드 2팁 +10~12  → 표 = 2팁으로 확정
// 팁이 바뀌면 벌어짐(반사−입사)을 팁/2 배 한다. 0팁이면 벌어짐 0 = 거울반사.
// 쿠션에 먹는 좌우 회전의 상한 (팁). 위 reflect() 주석 참고 — 실측으로 2 에서 포화한다.
const TIP_CAP = 2;

function reflect(a, tip){
  const t = BOUNCE, x = Math.abs(a);
  if (t.length < 2) return x;
  let p, q;
  if (x <= t[0][0]) { p = t[0]; q = t[1]; }
  else if (x >= t[t.length-1][0]) { p = t[t.length-2]; q = t[t.length-1]; }
  else for (let i = 0; i < t.length-1; i++)
    if (t[i][0] <= x && x <= t[i+1][0]) { p = t[i]; q = t[i+1]; break; }
  const y = p[1] + (q[1]-p[1]) * (x-p[0]) / (q[0]-p[0] || 1);
  // ⚠️ 팁의 **크기**만 쓴다. 왼쪽/오른쪽은 englishSide() 가 정한다.
  //    전에는 max(0,...) 이라 역회전(음수)이 0 이 돼 궤적이 안 바뀌었다.
  //
  // ★★★ 팁은 2에서 포화한다 — 실측 (2026-08-15, 사용자 승인)
  //   순회전 촬영 넷을 부호 축으로 모아 보니 **3팁 칸이 2팁 칸보다 안 벌어졌다.**
  //         입사구간        순2팁          순3팁
  //          0~15도    +18.6 (85)    +22.4 (14)
  //         15~25도   +20.1 (145)    +20.1 (28)
  //         45~55도    +9.4 (322)     +5.9 (14)
  //         55~90도    +7.2 (147)     +8.3 (23)
  //   실효 팁도 어느 촬영에서나 2를 크게 못 넘었다 —
  //     원쿠션걸어치기 2.07/1.98/1.97 · 3차실사 2순위 2.34~2.42 · 역각55 1쿠션 2.55
  //   그런데 옛 규칙(팁/2)은 3팁을 2팁의 **1.5배**로 그렸다. 그래서 3쿠션이 벌어졌다 —
  //   원쿠션걸어치기 24샷에서 다이계수 0.6~0.8 (2팁으로 계산하면 0.87~1.18 로 1 에 붙는다).
  //
  //   ⚠️ 사용자: '다이상태가 별로라 크게 반응을 안했을수도 있어요.
  //              그냥 3시는 포기, 2시30분이었다고 생각하고 궤적은 실측이니 그대로 갑시다.'
  //      → 다이 상태 탓일 수 있다. 좋은 다이에서 다시 재면 이 상한을 올린다.
  //        값 하나(TIP_CAP)만 바꾸면 된다.
  const h = Math.min(TIP_CAP, Math.abs(tip === undefined ? S.tipH : tip));
  return Math.max(x, Math.min(x + (y - x) * (h/2), 89.9));
}

// ★★★ 무회전이어도 쿠션에서 회전이 생긴다 (자연회전 / Running Spin)
//   사용자 2026-08-13: '거기는 **정회전이 작용할 자리**입니다.'
//   ⚠️⚠️ 지금까지 무회전(좌우 0팁)이면 bend() 의 e 가 0 이라 실측표가 통째로 안 걸리고
//      **완전한 거울반사**가 됐다. 영상(15-55-33)의 대회전이 일곱 쿠션 전부 입사=반사였다.
//   → 무회전으로 들어가도 쿠션 고무·라사와의 접선 마찰로 순회전이 생기고, 그만큼 넓어진다.
//
//   ⚠️ 출처 — 사용자 제공 AI 정리본 2026-08-13. **CLAUDE.md 값의 무게 ④번**이다
//      (인터넷·AI 자료. 혼자서는 근거가 못 된다). 받아들인 근거 두 가지 —
//        ① 0808 실측표는 '당점 2시30분 고정' 이라 **무회전 자료가 아예 없다.**
//           우리 실측과 부딪히지 않고 빈 칸을 채운다.
//        ② '입사각이 클수록(누울수록) 덜 먹는다' 가 사용자 관찰과 일치한다.
//      실측으로 바뀌면 이 표를 갈아 끼운다.
//
//   입사각(법선 기준) → 무회전일 때 넓어지는 각
const NAT_SPIN = [
  // ★★★ 우리 실측으로 갈아 끼운다 (2026-08-13) — 3차실사 '1순위_충돌 12시 2팁'
  //   좌우 무회전(12시)으로 친 63샷 102접점. track.py 로 입사·반사각을 뽑았다.
  //     입사구간   개수   입사평균   반사평균   더해진 각   속도
  //      0~15°      22     6.4°     22.9°     +17.1°    1342mm/s
  //     15~25°      18    20.8°     31.4°     +16.5°    1227
  //     25~35°      16    28.8°     34.8°      +6.9°     877
  //     35~45°       9    39.4°     47.3°      +7.7°     778
  //     45~55°      19    50.5°     59.1°     +10.2°     881
  //     55~90°      18    68.7°     67.0°      +3.8°    1116
  //   102접점 중 79개가 벌어졌다. **좌우 무회전이어도 크게 벌어진다.**
  //
  //   ⚠️ 전에 있던 값은 사용자 제공 AI 정리본(④)이었다 — 15°:4.0 · 30°:4.0 · 45°:3.5
  //      · 55°:2.5 · 65°:1.5 · 80°:0.5. 실측보다 **3~4배 작았다.**
  //      그래서 무회전 대회전이 거의 거울반사로 그려졌다 (사용자 15-55-33.mp4 지적).
  //   ⚠️ 0° 와 90° 두 점만 실측이 아니라 경계조건이다 —
  //      0° 는 정면이라 흐를 쪽이 없고, 90° 는 레일과 나란해 쿠션을 안 탄다.
  //   ⚠️ 이 표는 **좌우 회전을 안 준 공** 것이다. 2팁 이상 준 길은 이 값이 커져도
  //      안 바뀐다 — add = max(0, 실측표 − 입사 − nat) 이라 합이 실측표 그대로다.
  [0, 0], [6.4, 17.1], [20.8, 16.5], [28.8, 6.9],
  [39.4, 7.7], [50.5, 10.2], [68.7, 3.8], [90, 0]
];
// ★★★★ 무회전은 **거울**로 간다 (사용자 2026-08-17)
//   '무회전은 입사반사가 거의 같습니다. 단 각이 커질수록 1쿠션에서 자동회전이
//    발생하기 때문에 약간의 오차가 생깁니다. 실측을 하는것이 정확합니다.
//    또 속도에 따라 다릅니다.'

  //   사용자 2026-08-12: '추정을 전제로 합니다. 다이마다 다르고 힘에 따라 다르겠지만
  //     그것은 측정이 불가능하고, 2쿠션에서 3쿠션으로 나갈 때 역회전이 걸리는 것은
  //     사실이니 **입사각 대비 25% 정도로 반사각이 나온다**고 추정하고 경로를 잡아봅시다.'
  //   ⚠️ 실측이 아니라 **추정**이다. data/measured_bounce.json 의 ★_역회전_반사 참고.
  //   0팁이 거울인 것은 지켜야 하므로 팁수로 잇는다 — 0팁 100% · 1팁 75% · 2팁 50% · 3팁 25%.
  //
  //   ⚠️ 정면(입사 ≈ 0)은 여기서 뺀다. 흐른 쪽이 없어 순/역을 가릴 수 없고,
  //      '3시로 정면을 치면 우측으로' (2026-08-11 확인) 를 지켜야 한다.
  //      입사각 2도에 걸쳐 부드럽게 넘긴다.
  const AIN_HEADON = 2.0, REV_KEEP = 0.25;
  if (e !== 0 && e * sIn < 0 && ain > 1e-9){   // 역회전 — 회전이 흐른 쪽과 반대다
    // ★★ 여기도 **실측 상한(TIP_CAP)** 을 지킨다 (사용자 2026-08-17, 22.jpg:
    //   '3쿠션 반사각이 과도합니다').
    //   반사표는 2팁에서 잘리는데(reflect) 이 줄만 3까지 써서, 같은 배치에서
    //   3팁이 2팁보다 더 꺾였다 — 45도 입사에서 2팁 55도 · 3팁 60도.
    //   실측이 '3팁은 2팁보다 더 안 벌어진다' 이므로 여기서도 2에서 자른다.
    const tp   = Math.min(TIP_CAP, Math.abs(S.tipH));
    // ★ 남은 힘만큼만 건다 (위 revStrength 주석 참고).
    //     역각 100% 일 때의 keep 을 먼저 구하고, 거기에 r(0~0.5) 만큼만 다가간다.
    //     r=0   → keep 1     → 입사각 = 반사각 (1포인트)
    //     r=0.5 → 3팁이면 keep 0.625 (3포인트 이상)
    //   r > 0 이면 좁아지고(역각), r < 0 이면 벌어진다(순각으로 넘어간다).
    const r    = revStrength(vIn, ain);
        //   ⚠️ 나누는 값은 **3 그대로** 둔다. TIP_CAP 으로 바꿨더니 2팁이 '완전 역회전'
    //      자리가 되어 오히려 더 꺾였다 (45도 입사 55 → 60). 여기서 고칠 것은
    //      '3팁이 2팁을 넘는 것' 하나뿐이다 — 위에서 tp 를 자른 것으로 끝난다.
    const full = Math.max(0, 1 - (1 - REV_KEEP) * tp / 3);
    const keep = 1 - (1 - full) * r;
    const w    = Math.min(1, ain / AIN_HEADON);          // 정면이면 0
    signed = sIn * ain * keep * w + signed * (1 - w);
  }
  // ★ 다이 계수 — 거울에서 벗어난 몫에 곱한다 (위 RAIL_G 주석 참고).
  //   실측 = 거울 + (앱이 낸 벗어남) × 계수.  그래서 이 한 줄로 실측을 그대로 낸다.
  const sOut0 = signed >= 0 ? 1 : -1;
  const mag0 = Math.min(Math.abs(signed), 89.9);
  const mag = Math.max(0, Math.min(89.9, ain + (mag0 - ain) * railGain(ain)));
  const sOut = sOut0;
  const r = mag * Math.PI/180;
  return [[n[0]*Math.cos(r) + tg[0]*sOut*Math.sin(r),
           n[1]*Math.cos(r) + tg[1]*sOut*Math.sin(r)], ain, mag];
}

// E — 이 샷의 회전 쪽. 안 주면 화면의 지금 조준으로 정한다.
//     ⚠️ 충돌 뒤 구간도 **그 샷의 조준**으로 정한 값을 그대로 이어 써야 한다.
//        회전은 공에 붙어 있고 충돌로 바뀌지 않는다.
// v0 를 주면 쿠션마다 **남은 힘**을 계산해 역각 세기에 쓴다 (위 revStrength 주석).
//   안 주면 지금까지처럼 최대(50%)로 본다.
// 코너에서 옆 쿠션까지 반사시킨다 (위 roll 의 ★★★ 주석). 코너가 아니면 그대로 둔다.
// ★★★ 코너는 **되돌아 나간다.** 그것이 물리다 (2026-08-17 결론).
//   사장님 정리 세 마디로 여기까지 왔다 —
//     '동시에 맞으면 똥창. 랜덤으로 한쪽에 1도를 더해 튕겨내세요'   → v351 에서 넣었다
//     '현실적으로는 동시에 맞을 확률 없어요'
//     '직접지정시 넘겨버리세요 진행 방향으로'                        → 넣어 봤다
//     '손으로 정확하게 거기에 멈출 방법 없어요. 당신이 잡는거지'
//   ⚠️ '진행 방향으로 넘기기' 는 공이 쿠션을 따라 미끄러지는 그림이 됐다.
//      코너로 들어간 공은 되나올 수밖에 없어서, 넘기려면 없는 그림을 그리게 된다.
//      1도 비틀기도 뺐다 — 실제로 일어나지 않는 일에 흉내를 얹을 이유가 없다.
//   → 두 쿠션을 다 반사시킨다. 경로가 안 끊기고(그것이 애초에 고친 것) 그림도 정직하다.
//   ★ 애초에 이 자리는 **앱이 조준을 코너에 붙여서** 생긴다. 손으로는 못 세운다.
function cornerBend(q, nd, rail, k, E, v){
  const EPS = 1.0;                       // mm — 이 안이면 코너에 닿은 것으로 본다
  const lg = (rail === 'top' || rail === 'bottom');
  const other = lg
    ? (Math.abs(q[0]) < EPS ? 'left' : (Math.abs(q[0]-T.width)  < EPS ? 'right' : null))
    : (Math.abs(q[1]) < EPS ? 'bottom' : (Math.abs(q[1]-T.height) < EPS ? 'top'  : null));
  if (!other) return nd;
  const n2 = RAILS[other];               // 안쪽 법선
  if (nd[0]*n2[0] + nd[1]*n2[1] >= 0) return nd;   // 이미 안쪽으로 나간다
  return bend(nd, other, k, E, v)[0];
}
function roll(start, d, cushions, k, E, v0){
  const n = Math.hypot(d[0], d[1]);
  if (n < 1e-9) return [];
  let p = start.slice(), dir = [d[0]/n, d[1]/n], out = [], v = v0;
  for (let i = 0; i < cushions; i++){
    const nx = nextRail(p, dir, T.width, T.height);
    if (!nx) break;
    const [rail, q] = nx;
    if (v !== undefined){                       // 이 구간을 굴러온 만큼 힘이 준다
      const L = Math.hypot(q[0]-p[0], q[1]-p[1]);
      const A0 = DRAG_A0 * DRAG_TABLE, KV = DRAG_KV / DRAG_TABLE;
      const u = (A0 + v*v/KV) * Math.exp(-2*L/KV) - A0;
      v = u > 0 ? Math.sqrt(u*KV) : 0;
    }
    let [nd] = bend(dir, rail, k, E, v);
    // ★★★ 코너는 **두 쿠션을 동시에 맞은 것**이다 (사용자 2026-08-17, 6.jpg:
    //   '무조건 반사를 시켜야 하는거 아닌가요').
    //   한쪽만 반사시키면 나머지 한쪽으로 **다이 밖으로 빠져나간다.** 그러면
    //   다음 쿠션을 못 찾아 경로가 거기서 끊긴다 — 6.jpg 의 노란 토막이 그것이다.
    //   (nextRail 이 t > 0 인 쿠션만 보므로, 코너에 붙은 쿠션은 t = 0 이라 안 잡힌다)
    //   → 나가는 방향이 아직 옆 쿠션 **바깥**을 향하면 그 쿠션도 반사시킨다.
    nd = cornerBend(q, nd, rail, k, E, v);
    out.push({rail, p: q});
    if (v !== undefined) v *= CUSHION_KEEP;     // 쿠션에서 잃는다
    dir = nd; p = q;
  }
  return out;
}

const STEP_MM = 30.6;   // 보정 한 눈금. 단쿠션 1224/40 = 장쿠션 2448/80

// 보정은 **모든 쿠션의 반사각**에 같은 양(k도)을 더한다. 실측표가 이 당구대에서
// 안 맞는 것이라면 한 쿠션만 안 맞을 리가 없다 (윈도우판과 같은 방식).
// ★ 사용자 확정 2026-08-11: '보정은 공간의 충돌로 인한 각도 변경과는 관계가 없습니다.
//   쿠션에 부딪힐 때만 적용하는 겁니다.' 그리고 '충돌 뒤 쿠션 보정이 걸립니다.'
//     1적구와 부딪혀 꺾이는 각      보정 안 걸린다 (공끼리라 다이와 무관)
//     쿠션                          충돌 전이든 후든 **다 걸린다**
//   → 풀린 k 를 LAST_K 에 남겨서, 충돌 뒤 구간도 같은 k 로 굴린다.
//     ⚠️ pathFromAim 을 부른 **직후**에 읽어야 한다. 다른 조준으로 또 부르면 덮인다.
let LAST_K = 0;
// ★★ 사용자 2026-08-13 (8.jpg): '경로가 계속 이어져야 하는데 5에서 끊어지네요.
//   이어지면 7쿠션이 되잖아요.'
//   ⚠️ 여기가 **5 로 박혀 있었다.** data/speed.json 은 충돌 전 0쿠션이면 7쿠션까지
//      허락하는데, 조준 경로를 그 전에 5에서 잘라 버렸다.
//      빈쿠션으로 여섯·일곱 쿠션을 돌아 공에 닿는 길이 통째로 안 그려졌다.
const AIM_MAX_C = 7;
// 조준선에서 1쿠션 수를 읽는다 (판독창과 같은 눈금).
function firstNumFor(cue, d){
  const o = orientation();
  const fw = frameHit(cue, d);
  if (!fw) return null;
  const fa = frameParam(fold(o, fw));
  return fa ? readScale('first_cushion', fa.rail, fa.t) : null;
}

// ★★★ 보정은 **조준(1쿠션)** 을 옮긴다 — 사용자 2026-08-14
//
//   전에는 조준을 그대로 둔 채 **모든 쿠션의 반사각을 비틀어** 2쿠션 도착점만
//   30.6mm 씩 옮겼다. 1쿠션 자리는 보정을 아무리 돌려도 한 자리였다 —
//   1.jpg 로 확인: 보정 −2~+2 에서 1쿠션 (1446,0) 고정, 2쿠션만 321→199 로 이동.
//
//   ⚠️ 그러면 **화면만 맞고 공은 안 맞는다.** 사용자 지적 그대로다 —
//      '1쿠션 제시 계산각이 39인데 실제 처보니 짧게 지나갔다면 38 이하로 보정을
//       해야 공이 맞을텐데, 수구와 1쿠션을 조종할수 없다면 논리가 틀리는거 아닙니까'
//      39 를 겨냥해 치면 실제 쿠션은 실제대로 반사한다. 앱이 비튼 대로 안 튕긴다.
//
//   수구는 못 옮긴다 (공이 그 자리에 놓여 있다). 그러나 **1쿠션은 옮길 수 있다** —
//   걸어치기·빈쿠션에서 1쿠션은 위치가 아니라 **어디를 겨냥하느냐**이고,
//   조준은 우리가 제시하는 값이다. 그래서 보정이 조준을 옮기게 바꾼다.
//
//   보정 +1 → 1쿠션 수가 한 눈금(STEP_MM = 30.6mm) 커지는 쪽으로 조준을 옮긴다.
//   −1 이면 작아지는 쪽. 그러면 판독창의 1쿠션 수가 같이 움직인다.
//
//   ⚠️ 앞돌리기처럼 **공을 먼저 맞히는 길**은 1쿠션이 분리각으로 정해져 이 손잡이가
//      직접 닿지 않는다. 그쪽은 두께를 옮겨야 한다 — 아직 안 만들었다.
//   ⚠️ LAST_K 는 이제 늘 0 이다. 반사 모델을 비틀지 않는다.
function pathFromAim(cue, aim, shift){
  const d = [aim[0]-cue[0], aim[1]-cue[1]];
  LAST_K = 0;
  const base = roll(cue, d, AIM_MAX_C, 0);
  if (!shift || !base.length) return base;
  // ★★ 공을 먼저 맞히는 길(앞돌리기·뒤돌리기)은 1쿠션이 **분리각**으로 정해진다.
  //   조준을 옮기면 1쿠션이 따라오지 않고 **두께**가 바뀌어 분리각이 바뀐다.
  //   사용자 2026-08-14: '원쿠션 앞돌리기 ... 공 반개정도가 짧아지는 현상이 계속'
  //   → 그래서 이쪽은 **충돌 뒤 1쿠션 점**을 한 눈금(STEP_MM)씩 옮기도록 조준을 돌린다.
  //   ⚠️ 표(data/separation.json)는 안 건드린다. 영상에서 두께 측정이 깨져 있어
  //      (1적구 각과 안 맞는다) 그 값으로 표를 고치면 근거 없는 숫자가 된다.
  //      다이마다 다른 몫이기도 하므로 손잡이로 두는 것이 맞다.
  {
    const h0 = cutAtBall([cue, ...base.map(x => x.p)]);
    if (h0.hit && h0.pts.length === 2){                 // 쿠션 전에 적구를 맞는다
      const P0 = h0.pts[1], a0 = afterHit(cue, P0, h0.obj);
      const r0 = a0 ? roll(P0, a0.dir, 1, 0) : [];
      if (r0.length){
        const rl = r0[0].rail, nn = RAILS[rl], tt = [-nn[1], nn[0]];
        const p0 = r0[0].p;
        const fwd = ((p0[0]-P0[0])*tt[0] + (p0[1]-P0[1])*tt[1]) >= 0 ? 1 : -1;
        const want = shift * STEP_MM * fwd;             // + 는 진행 쪽으로 = 길게
        // 지금 적구가 조준선의 어느 쪽에 있나 — 이 쪽이 바뀌면 수구가 반대로 꺾인다
        const sideOf = (dd, P, ob) => Math.sign(dd[0]*(ob[1]-P[1]) - dd[1]*(ob[0]-P[0]));
        const nd0 = Math.hypot(d[0], d[1]);
        const side0 = sideOf([d[0]/nd0, d[1]/nd0], P0, h0.obj);
        const off = ang => {
          const c = Math.cos(ang), si = Math.sin(ang);
          const dd = [d[0]*c - d[1]*si, d[0]*si + d[1]*c];
          const rr = roll(cue, dd, AIM_MAX_C, 0);
          if (!rr.length) return null;
          const h = cutAtBall([cue, ...rr.map(x => x.p)]);
          if (!h.hit || h.pts.length !== 2) return null;
          const P = h.pts[1], a2 = afterHit(cue, P, h.obj);
          if (!a2) return null;
          // ⚠️ 적구를 넘어가면 꺾이는 쪽이 뒤집혀 1쿠션이 통째로 튄다. 같은 쪽만 쓴다.
          const un = Math.hypot(dd[0], dd[1]);
          if (sideOf([dd[0]/un, dd[1]/un], P, h.obj) !== side0) return null;
          const q = roll(P, a2.dir, 1, 0);
          if (!q.length || q[0].rail !== rl) return null;
          // ⚠️ 두께 90% 를 넘으면 표가 되레 줄어(0.75→50도 · 0.875→48도) 방향이
          //    되돌아온다. 그 구간은 빼야 손잡이가 헛돌지 않는다.
          if (a2.thick < 0.05 || a2.thick > 0.88) return null;
          return (q[0].p[0]-p0[0])*tt[0] + (q[0].p[1]-p0[1])*tt[1];
        };
        // ⚠️ 이분법은 못 쓴다 — 위 이유로 오프셋이 각도에 대해 단조롭지 않다.
        //    조준을 적구 폭 안에서 촘촘히 훑어 **want 에 제일 가까운 각**을 고른다.
        const L = Math.max(1, Math.hypot(P0[0]-cue[0], P0[1]-cue[1]));
        const R = T.ball_diameter * 0.5 / L;
        let bestA = null, bestE = Infinity;
        for (let i = 0; i <= 80; i++){
          const ang = -R + 2*R*i/80, v = off(ang);
          if (v === null) continue;
          const e = Math.abs(v - want);
          if (e < bestE){ bestE = e; bestA = ang; }
        }
        if (bestA !== null && bestE < Math.abs(want)*0.5 + STEP_MM*0.35){
          const c = Math.cos(bestA), si = Math.sin(bestA);
          const out2 = roll(cue, [d[0]*c - d[1]*si, d[0]*si + d[1]*c], AIM_MAX_C, 0);
          if (out2.length) return out2;
        }
      }
      return base;                                      // 못 풀면 그대로 둔다
    }
  }
  const rail = base[0].rail, n = RAILS[rail], tg = [-n[1], n[0]];
  const aimAt = s => {
    const q = [base[0].p[0] + tg[0]*s, base[0].p[1] + tg[1]*s];
    return [q[0]-cue[0], q[1]-cue[1]];
  };
  // ★ 한 눈금 = **1쿠션 수 1** 이다 (사용자가 '39 → 38' 로 세신다).
  //   레일을 따라 얼마를 옮겨야 눈금이 1 움직이는지는 자리마다 다르므로 풀어서 찾는다.
  const n0 = firstNumFor(cue, d);
  let off = null;
  if (n0 !== null){
    const want = n0 + shift;
    const f = s => { const v = firstNumFor(cue, aimAt(s)); return v === null ? null : v - want; };
    let lo = -600, hi = 600;
    const flo = f(lo), fhi = f(hi);
    if (flo !== null && fhi !== null && flo * fhi < 0){
      if (flo > 0){ const t = lo; lo = hi; hi = t; }        // f(lo) < 0 이 되게
      for (let i = 0; i < 40; i++){
        const mid = (lo+hi)/2, g = f(mid);
        if (g === null) break;
        if (g < 0) lo = mid; else hi = mid;
      }
      off = (lo+hi)/2;
    }
  }
  if (off === null){                                        // 눈금을 못 읽으면 거리로 옮긴다
    const np = firstNumFor(cue, aimAt(STEP_MM));
    const sgn = (n0 !== null && np !== null && np < n0) ? -1 : 1;
    off = sgn * shift * STEP_MM;
  }
  const out = roll(cue, aimAt(off), AIM_MAX_C, 0);
  return out.length ? out : base;
}

// ---------------------------------------------------------------- 당구대 찾기
// 파이썬(vision/table_detect.py)에서 검증된 방식을 그대로 옮긴다.
//   천 색으로 영역을 따고 → 가장 큰 덩어리 → 볼록껍질 → 사각형 4점
// 1단계: 찾은 영역 테두리를 화면에 그려 제대로 잡는지 눈으로 확인한다.
// data/vision.json 과 같은 값.
// ⚠️ 상한이 110 이면 안 된다. 천은 H 106~109 라 아슬아슬하고, 그늘진 쿠션 면이
//    조금만 벗어나면 통째로 빠져 경계가 노즈로 튄다 — 그러면 먼 쪽과 가까운 쪽
//    경계가 서로 다른 것을 가리킨다. 넓히니 원근 복원 비율이 1.44~2.40 →
//    1.89~1.96 (참값 1.93) 으로 모였다 (사진 15장, 2026-08-09).
const CLOTH_LO = [95, 60, 60], CLOTH_HI = [125, 255, 255];
let TABLE_HULL = null;          // 찾은 당구대 외곽 (사진 픽셀 좌표)

function rgb2hsv(r, g_, b){
  const mx = Math.max(r,g_,b), mn = Math.min(r,g_,b), d = mx - mn;
  let h = 0;
  if (d){
    if (mx === r) h = ((g_-b)/d + (g_ < b ? 6 : 0));
    else if (mx === g_) h = (b-r)/d + 2;
    else h = (r-g_)/d + 4;
    h *= 30;                                    // OpenCV 는 0~179
  }
  return [h, mx ? d/mx*255 : 0, mx];
}

function findTable(img){
  // 사진을 줄여서 훑는다 (폰에서 원본 그대로 돌리면 느리다)
  // ⚠️ 240 이면 안 된다. 1px 이 12mm 이라 껍질이 모서리를 잘라먹어 코너가 최대
  //    140mm 안쪽으로 들어오고, 그 자리에 있던 공이 다이 밖으로 밀려나 사라진다
  //    (2026-08-09, 191914 / 192004 두 장이 공을 하나밖에 못 찾았다).
  //    480 으로 올리니 15장 전부 3개를 찾는다. 720 도 같은 결과라 480 이면 충분하다.
  const W = 480, H = Math.max(1, Math.round(img.height / img.width * W));
  const cn = document.createElement('canvas');
  cn.width = W; cn.height = H;
  const cg = cn.getContext('2d', {willReadFrequently:true});
  cg.drawImage(img, 0, 0, W, H);
  const px = cg.getImageData(0, 0, W, H).data;

  const m = new Uint8Array(W*H);
  for (let i = 0, j = 0; i < m.length; i++, j += 4){
    const [h,s,v] = rgb2hsv(px[j], px[j+1], px[j+2]);
    m[i] = (h >= CLOTH_LO[0] && h <= CLOTH_HI[0] &&
            s >= CLOTH_LO[1] && v >= CLOTH_LO[2]) ? 1 : 0;
  }
  // 잡티 제거 (열기) — 가느다란 연결을 끊는다
  const er = new Uint8Array(W*H);
  for (let y = 1; y < H-1; y++) for (let x = 1; x < W-1; x++){
    let ok = 1;
    for (let dy = -1; dy <= 1 && ok; dy++) for (let dx = -1; dx <= 1; dx++)
      if (!m[(y+dy)*W + x+dx]) { ok = 0; break; }
    er[y*W+x] = ok;
  }

  // 가장 큰 덩어리
  const lab = new Int32Array(W*H).fill(-1);
  let best = null, id = 0;
  const qx = new Int32Array(W*H), qy = new Int32Array(W*H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
    if (!er[y*W+x] || lab[y*W+x] >= 0) continue;
    let head = 0, tail = 0, n = 0;
    qx[tail] = x; qy[tail] = y; tail++; lab[y*W+x] = id;
    const pts = [];
    while (head < tail){
      const cx = qx[head], cy = qy[head]; head++; n++;
      pts.push([cx, cy]);
      for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx = cx+dx, ny = cy+dy;
        if (nx<0||ny<0||nx>=W||ny>=H) continue;
        if (!er[ny*W+nx] || lab[ny*W+nx] >= 0) continue;
        lab[ny*W+nx] = id; qx[tail] = nx; qy[tail] = ny; tail++;
      }
    }
    if (!best || n > best.n) best = {n, pts};
    id++;
  }
  if (!best || best.n < W*H*0.02) return null;

  const k = img.width / W;                       // 원본 크기로 되돌리는 배율
  const hull = convexHull(best.pts).map(q => [q[0]*k, q[1]*k]);
  return {hull, quad: hullToQuad(hull), area: best.n / (W*H)};
}


function convexHull(pts){
  const p = pts.slice().sort((a,b) => a[0]-b[0] || a[1]-b[1]);
  const cross = (o,a,b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = [], up = [];
  for (const q of p){ while (lo.length>1 && cross(lo[lo.length-2],lo[lo.length-1],q)<=0) lo.pop(); lo.push(q); }
  for (let i=p.length-1;i>=0;i--){ const q=p[i];
    while (up.length>1 && cross(up[up.length-2],up[up.length-1],q)<=0) up.pop(); up.push(q); }
  lo.pop(); up.pop();
  return lo.concat(up);
}


// 볼록껍질 → 사각형 4점. 넓이가 가장 큰 네 점을 고른다.
// ⚠️ 파이썬은 approxPolyDP 를 썼지만 여기선 직접 짠다. 껍질 점이 수백 개라
//    4중 반복은 느리므로, 먼저 껍질을 성기게 줄인 뒤(최대 40점) 고른다.
function hullToQuad(hull){
  let h = hull;
  if (h.length > 40){
    const step = h.length / 40, out = [];
    for (let i = 0; i < 40; i++) out.push(h[Math.floor(i*step)]);
    h = out;
  }
  const n = h.length;
  if (n < 4) return null;
  const area2 = (a,b,c) => Math.abs((b[0]-a[0])*(c[1]-a[1]) - (b[1]-a[1])*(c[0]-a[0]));
  let best = null, bestA = 0;
  for (let i = 0; i < n-3; i++)
   for (let j = i+1; j < n-2; j++)
    for (let k = j+1; k < n-1; k++)
     for (let l = k+1; l < n; l++){
       const A = area2(h[i],h[j],h[k]) + area2(h[i],h[k],h[l]);
       if (A > bestA){ bestA = A; best = [h[i],h[j],h[k],h[l]]; }
     }
  if (!best) return null;
  // 무게중심 기준 각도로 순환 정렬 (스스로 교차하지 않는 사각형이 된다)
  const c = best.reduce((a,q) => [a[0]+q[0]/4, a[1]+q[1]/4], [0,0]);
  return best.slice().sort((a,b) =>
    Math.atan2(a[1]-c[1], a[0]-c[0]) - Math.atan2(b[1]-c[1], b[0]-c[0]));
}


// ---------------------------------------------------------------- 원근보정
// 4점 → 4점 호모그래피. 8x8 선형계를 가우스 소거로 푼다.
function homography(src, dst){
  const A = [], b = [];
  for (let i = 0; i < 4; i++){
    const [x,y] = src[i], [u,v] = dst[i];
    A.push([x,y,1,0,0,0,-u*x,-u*y]); b.push(u);
    A.push([0,0,0,x,y,1,-v*x,-v*y]); b.push(v);
  }
  for (let c = 0; c < 8; c++){                    // 부분 피벗 가우스 소거
    let piv = c;
    for (let r = c+1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[piv][c])) piv = r;
    if (Math.abs(A[piv][c]) < 1e-12) return null;
    [A[c],A[piv]] = [A[piv],A[c]]; [b[c],b[piv]] = [b[piv],b[c]];
    for (let r = 0; r < 8; r++){
      if (r === c) continue;
      const f = A[r][c] / A[c][c];
      if (!f) continue;
      for (let k2 = c; k2 < 8; k2++) A[r][k2] -= f*A[c][k2];
      b[r] -= f*b[c];
    }
  }
  const h = b.map((v,i) => v / A[i][i]);
  return [h[0],h[1],h[2], h[3],h[4],h[5], h[6],h[7],1];
}

// 사진을 당구대 모양으로 편다. 결과는 캔버스로 들고 있다가 천 자리에 그린다.
function warpPhoto(img, quad, outW, outH){
  // quad 는 순환 순서. 좌하 → 우하 → 우상 → 좌상 으로 맞춘다.
  const src = orderQuad(quad, img.width, img.height);   // 좌하, 우하, 우상, 좌상
  const dst = [[0,outH],[outW,outH],[outW,0],[0,0]];
  const H = homography(dst, src);                 // 결과 픽셀 → 원본 픽셀
  if (!H) return null;

  const cn = document.createElement('canvas');
  cn.width = outW; cn.height = outH;
  const cg = cn.getContext('2d', {willReadFrequently:true});
  const out = cg.createImageData(outW, outH);

  const sw = Math.min(img.width, 1280);
  const sh = Math.round(img.height / img.width * sw);
  const tmp = document.createElement('canvas');
  tmp.width = sw; tmp.height = sh;
  const tg = tmp.getContext('2d', {willReadFrequently:true});
  tg.drawImage(img, 0, 0, sw, sh);
  const sp = tg.getImageData(0, 0, sw, sh).data;
  const kx = sw / img.width;

  for (let y = 0; y < outH; y++) for (let x = 0; x < outW; x++){
    const w2 = H[6]*x + H[7]*y + H[8];
    const sx = Math.round((H[0]*x + H[1]*y + H[2]) / w2 * kx);
    const sy = Math.round((H[3]*x + H[4]*y + H[5]) / w2 * kx);
    const o = (y*outW + x) * 4;
    if (sx < 0 || sy < 0 || sx >= sw || sy >= sh){ out.data[o+3] = 0; continue; }
    const q = (sy*sw + sx) * 4;
    out.data[o] = sp[q]; out.data[o+1] = sp[q+1];
    out.data[o+2] = sp[q+2]; out.data[o+3] = 255;
  }
  cg.putImageData(out, 0, 0);
  return cn;
}


// ---------------------------------------------------------------- 코너 보정
// ⚠️ 천 색으로 찾은 코너는 **천 경계**라 쿠션 날과 다르다. 그대로 쓰면 좌표가 밀린다.
//    다이아몬드(레일 위 흰 점)는 규격상 장쿠션 8등분·단쿠션 4등분 자리에 있으므로
//    그것을 자로 삼아 코너를 밀어 맞춘다. 파이썬에서도 다이아몬드가 진실 원천이었다.
function refineQuad(img, quad){
  const W = 900, H = 450, PAD = 90;               // 편 그림 + 레일이 보이도록 여백
  const cn = document.createElement('canvas');
  cn.width = W + PAD*2; cn.height = H + PAD*2;
  const cg = cn.getContext('2d', {willReadFrequently:true});

  const src = orderQuad(quad, img.width, img.height);
  const dst = [[PAD, H+PAD],[W+PAD, H+PAD],[W+PAD, PAD],[PAD, PAD]];
  const Hm = homography(dst, src);
  if (!Hm) return quad;

  const sw = Math.min(img.width, 1280), sh = Math.round(img.height/img.width*sw);
  const tmp = document.createElement('canvas');
  tmp.width = sw; tmp.height = sh;
  const tg = tmp.getContext('2d', {willReadFrequently:true});
  tg.drawImage(img, 0, 0, sw, sh);
  const sp = tg.getImageData(0,0,sw,sh).data, kx = sw/img.width;

  // 레일 띠에서 밝은 점(다이아몬드)을 찾는다
  const found = {top:[], bottom:[], left:[], right:[]};
  const probe = (rail) => {
    const list = [];
    const N = 260;
    for (let i = 0; i <= N; i++){
      const t = i/N;
      let x, y;
      if (rail === 'top')    { x = PAD + W*t; y = PAD - PAD*0.45; }
      else if (rail==='bottom'){ x = PAD + W*t; y = H+PAD + PAD*0.45; }
      else if (rail === 'left'){ x = PAD - PAD*0.45; y = PAD + H*t; }
      else                   { x = W+PAD + PAD*0.45; y = PAD + H*t; }
      const w2 = Hm[6]*x + Hm[7]*y + Hm[8];
      const sx = Math.round((Hm[0]*x + Hm[1]*y + Hm[2])/w2*kx);
      const sy = Math.round((Hm[3]*x + Hm[4]*y + Hm[5])/w2*kx);
      if (sx<0||sy<0||sx>=sw||sy>=sh){ list.push(0); continue; }
      const q = (sy*sw+sx)*4;
      list.push((sp[q]+sp[q+1]+sp[q+2])/3);
    }
    // 국소 최대 = 흰 점
    const peaks = [];
    const avg = list.reduce((a,b)=>a+b,0)/list.length;
    for (let i = 3; i < list.length-3; i++){
      if (list[i] < avg*1.20) continue;
      let top = true;
      for (let d = -3; d <= 3; d++) if (list[i+d] > list[i]) { top = false; break; }
      if (top && (!peaks.length || i - peaks[peaks.length-1] > 5)) peaks.push(i);
    }
    return peaks.map(i => i/N);                   // 0~1 위치
  };
  ['top','bottom','left','right'].forEach(r => found[r] = probe(r));

  // 찾은 점들이 n등분 자리와 얼마나 어긋나는지 → 양끝을 늘이거나 줄인다
  const fix = (pts, n) => {
    if (pts.length < 3) return null;
    // 가장 잘 맞는 (a, b): t' = a + b*t 가 되도록 최소제곱
    const ideal = pts.map(t => Math.round(t*n)/n);
    let sx=0, sy=0, sxx=0, sxy=0;
    for (let i = 0; i < pts.length; i++){
      sx += pts[i]; sy += ideal[i]; sxx += pts[i]*pts[i]; sxy += pts[i]*ideal[i];
    }
    const m = pts.length, den = m*sxx - sx*sx;
    if (Math.abs(den) < 1e-9) return null;
    const b = (m*sxy - sx*sy)/den, a = (sy - b*sx)/m;
    if (!isFinite(a) || !isFinite(b) || b < 0.7 || b > 1.4) return null;
    return {a, b};                                 // 이상적 위치 = a + b*관측
  };
  const fx = fix(found.top.concat(found.bottom), 8);
  const fy = fix(found.left.concat(found.right), 4);
  if (!fx && !fy) return quad;

  // 편 그림 좌표에서 사각형을 늘였다 줄인 뒤, 원본으로 되돌린다
  const inv = (u,v) => {
    const w2 = Hm[6]*u + Hm[7]*v + Hm[8];
    return [(Hm[0]*u + Hm[1]*v + Hm[2])/w2, (Hm[3]*u + Hm[4]*v + Hm[5])/w2];
  };
  // t=0,1 이 어디로 가야 하는지 (역함수: 관측 = (이상 - a)/b)
  // ⚠️ 다이아몬드는 쿠션 날이 아니라 그보다 frame_offset(90mm) **바깥**의 프레임
  //    선에 있다. 다이아몬드를 0~1 에 맞추면 사각형이 프레임까지 커져 레일을 문다
  //    (실기기에서 좌우에 나무색 띠가 보였다). 그만큼 안쪽으로 되돌린다.
  //      가로 2448/(2448+180) = 0.9315,  세로 1224/(1224+180) = 0.8718
  const off = T.frame_offset;
  const rx = T.width  / (T.width  + 2*off);
  const ry = T.height / (T.height + 2*off);
  const shrink = (t0, t1, r) => {                 // 0~1 구간을 가운데 기준으로 r 배
    const m = (t0+t1)/2, half = (t1-t0)/2*r;
    return [m-half, m+half];
  };
  let gx0 = fx ? (0 - fx.a)/fx.b : 0, gx1 = fx ? (1 - fx.a)/fx.b : 1;
  let gy0 = fy ? (0 - fy.a)/fy.b : 0, gy1 = fy ? (1 - fy.a)/fy.b : 1;
  if (fx) [gx0, gx1] = shrink(gx0, gx1, rx);
  if (fy) [gy0, gy1] = shrink(gy0, gy1, ry);
  const X0 = PAD + W*gx0, X1 = PAD + W*gx1;
  const Y0 = PAD + H*gy0, Y1 = PAD + H*gy1;
  DIAMOND_FIT = {nx: found.top.length + found.bottom.length,
                 ny: found.left.length + found.right.length};
  // ⚠️ 다이아몬드는 천 평면이 아니라 **레일 윗면**에 있다. 호모그래피 하나로는
  //    두 평면을 같이 못 맞추므로 이 보정은 크게 틀릴 수 있다 (2026-08-08 확인).
  //    많이 옮기자고 하면 믿지 않는다 — 당구대가 줄어들면 쿠션에 붙은 공이
  //    사각형 밖으로 밀려나 통째로 사라진다 (사용자 지적: 가장자리 공을 못 찾는다).
  const MOVE = 0.04;                              // 변 길이의 이 비율까지만 허용
  if (Math.abs(gx0) > MOVE || Math.abs(gx1-1) > MOVE ||
      Math.abs(gy0) > MOVE || Math.abs(gy1-1) > MOVE){
    DIAMOND_FIT = null;
    log('다이아몬드 보정 무시 (' + [gx0,gx1,gy0,gy1].map(v=>v.toFixed(3)).join(' ') + ')');
    return quad;
  }
  return [inv(X0, Y1), inv(X1, Y1), inv(X1, Y0), inv(X0, Y0)];   // 좌하,우하,우상,좌상
}
let DIAMOND_FIT = null;

// 사진 속 사각형이 원래 직사각형이었다면 그 가로세로비가 얼마인가.
// ⚠️ 화면상 변 길이로 장쿠션을 고르면 안 된다. 비스듬히 가까이서 찍으면 먼 쪽
//    장쿠션이 짜부라져 단쿠션보다 짧아 보인다. 그러면 당구대를 90도 눕혀서 펴게 된다.
//    직사각형의 사진이라는 사실만으로 초점거리와 진짜 비를 풀 수 있다 (Zhang & He, 2003).
//    주점은 화면 중앙, 픽셀은 정사각형이라고 본다.
//    q 는 순환 순서 4점. q0→q1 변이 가로일 때의 가로/세로. 못 구하면 null.
function rectAspect(q, sw, sh){
  const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const dot = (a,b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
  const u0 = sw/2, v0 = sh/2;
  const m1 = [q[0][0],q[0][1],1], m2 = [q[1][0],q[1][1],1];
  const m3 = [q[3][0],q[3][1],1], m4 = [q[2][0],q[2][1],1];
  const d2 = dot(cross(m2,m4), m3), d3 = dot(cross(m3,m4), m2);
  if (Math.abs(d2) < 1e-9 || Math.abs(d3) < 1e-9) return null;
  const k2 = dot(cross(m1,m4), m3)/d2, k3 = dot(cross(m1,m4), m2)/d3;
  const n2 = [k2*m2[0]-m1[0], k2*m2[1]-m1[1], k2*m2[2]-m1[2]];
  const n3 = [k3*m3[0]-m1[0], k3*m3[1]-m1[1], k3*m3[2]-m1[2]];
  const den = n2[2]*n3[2];
  if (Math.abs(den) < 1e-12) return null;
  const f2 = -((n2[0]-n2[2]*u0)*(n3[0]-n3[2]*u0)
             + (n2[1]-n2[2]*v0)*(n3[1]-n3[2]*v0)) / den;
  if (!isFinite(f2) || f2 <= 1) return null;
  const inv = [[1/f2, 0, -u0/f2], [0, 1/f2, -v0/f2],
               [-u0/f2, -v0/f2, (u0*u0 + v0*v0)/f2 + 1]];
  const quad3 = n => {
    let s = 0;
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) s += n[i]*inv[i][j]*n[j];
    return s;
  };
  const a = quad3(n2), b = quad3(n3);
  if (a <= 0 || b <= 0) return null;
  return Math.sqrt(a/b);
}

function orderQuad(quad, sw, sh){
  const c = quad.reduce((a,q)=>[a[0]+q[0]/4, a[1]+q[1]/4],[0,0]);
  const by = quad.slice().sort((a,b) =>
    Math.atan2(a[1]-c[1], a[0]-c[0]) - Math.atan2(b[1]-c[1], b[0]-c[0]));
  // ⚠️ 네 변 전부에서 고르면 안 된다. 당구대가 화면에서 많이 돌아가 있으면
  //    **단쿠션**이 제일 아래로 와서 그걸 하단 장쿠션으로 착각한다. 그러면 좌표가
  //    통째로 돌아간다 (2026-08-08 사진 15장 중 5장). 먼저 장쿠션 쌍으로 좁힌다.
  let lp = null;
  if (sw && sh){                                   // 원근을 되돌린 진짜 비로 정한다
    const r = rectAspect(by, sw, sh);
    if (r !== null && (r > 1.35 || r < 0.74)) lp = r > 1 ? 0 : 1;
  }
  if (lp === null){                                // 못 구하면 화면상 길이로
    const side = [0,1,2,3].map(i => Math.hypot(by[(i+1)%4][0]-by[i][0],
                                               by[(i+1)%4][1]-by[i][1]));
    lp = side[0] + side[2] >= side[1] + side[3] ? 0 : 1;
  }
  const cand = [lp, lp+2];
  // 긴 변 둘 중 화면 아래쪽(카메라에 가까운) 것이 하단 장쿠션이다
  const base = cand[0] === undefined ? 0 :
    ((by[cand[0]][1] + by[(cand[0]+1)%4][1]) >= (by[cand[1]][1] + by[(cand[1]+1)%4][1])
      ? cand[0] : cand[1]);
  const idx = by[base][0] > by[(base+1)%4][0]
    ? [(base+1)%4, base, (base+3)%4, (base+2)%4]
    : [base, (base+1)%4, (base+2)%4, (base+3)%4];
  return idx.map(i => by[i]);
}


// ---------------------------------------------------------------- 공 찾기
// ⚠️ **편 그림이 아니라 원본 사진에서** 찾는다. 카메라가 낮으면 먼 쪽 쿠션이 심하게
//    눌려 있고, 그걸 펴는 순간 공이 3배로 늘어난 타원이 되어 크기·모양 조건에 전부
//    걸린다 (2026-08-08 당구장 사진 15장 중 7장이 이것). 원본에서 공은 동그랗다.
//    늘어나지 않는 것은 **점 하나**뿐이므로 중심만 원근변환으로 옮긴다.
//
// 색 규칙은 data/vision.json 과 같아야 한다. 파이썬(vision/ball_detect.py)과 같은 값.
const BALL_RULES = [
  {name:'white',  s_max:120, v_min:120},
  {name:'yellow', h_min:10,  h_max:45,  s_min:85},
  {name:'red',    h_min:0,   h_max:9,   s_min:85},
  {name:'red',    h_min:160, h_max:179, s_min:85}];
const RED_LO = 9, RED_HI = 160;   // 이 밖이면 빨강 (vision.json 과 동일)
// 사각형을 이 비율만큼 넓혀서 훑는다. ⚠️ 넓히면 쿠션 나무가 더 들어와
// 빨간공 자리를 뺏는다 — 0.06 으로 키웠더니 15장 중 15→13 으로 나빠졌다.
const QUAD_PAD = 0.02;

function hitRule(h, s, v, r){
  return s >= (r.s_min ?? 0) && s <= (r.s_max ?? 255)
      && v >= (r.v_min ?? 0) && v <= (r.v_max ?? 255)
      && h >= (r.h_min ?? 0) && h <= (r.h_max ?? 179);
}

function applyH(H, x, y){
  const w = H[6]*x + H[7]*y + H[8];
  return [(H[0]*x + H[1]*y + H[2])/w, (H[3]*x + H[4]*y + H[5])/w];
}

// 사진의 그 자리에서 공이 몇 px 로 보이는지. 공은 구(球)라 사진에서 언제나 동그랗고
// 크기는 거리로만 정해진다. mm 로 공 지름만큼 떨어진 두 방향을 사진으로 되돌려 재고
// **긴 쪽**을 쓴다 (짧은 쪽은 원근으로 눌린 깊이 방향이라 겉보기 크기가 아니다).
function localBallPx(Hf, Hi, x, y, ballMm){
  const q = applyH(Hf, x, y);
  const a = applyH(Hi, q[0] + ballMm, q[1]);
  const b = applyH(Hi, q[0], q[1] + ballMm);
  return Math.max(Math.hypot(a[0]-x, a[1]-y), Math.hypot(b[0]-x, b[1]-y));
}

// 사각형 안쪽만 남기는 마스크. 쿠션에 붙은 공은 몸통이 사각형 밖으로 나가므로 조금 넓힌다.
function quadInside(quad, pad){
  const c = quad.reduce((a,q)=>[a[0]+q[0]/4, a[1]+q[1]/4],[0,0]);
  const big = quad.map(q => [c[0] + (q[0]-c[0])*(1+pad), c[1] + (q[1]-c[1])*(1+pad)]);
  return (x, y) => {
    let pos = 0, neg = 0;
    for (let i = 0; i < 4; i++){
      const [ax,ay] = big[i], [bx,by] = big[(i+1)%4];
      const s = (bx-ax)*(y-ay) - (by-ay)*(x-ax);
      if (s > 0) pos++; else if (s < 0) neg++;
    }
    return pos === 0 || neg === 0;
  };
}


// 노즈 사각형 → 카메라 위치 (다이 좌하단 원점, mm). 못 구하면 null.
// 직사각형의 사진이라는 사실만으로 초점거리가 풀리고 (rectAspect 와 같은 방법),
// 거기서 카메라 자세가 나온다. 주점은 화면 중앙, 픽셀은 정사각형으로 본다.
function cameraPos(quad, sw, sh, tw, th){
  const cr = (a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const dt = (a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const c0 = quad.reduce((a,q)=>[a[0]+q[0]/4, a[1]+q[1]/4],[0,0]);
  const p = quad.slice().sort((a,b)=>Math.atan2(a[1]-c0[1],a[0]-c0[0])
                                   - Math.atan2(b[1]-c0[1],b[0]-c0[0]));
  const u0 = sw/2, v0 = sh/2;
  const m1=[p[0][0],p[0][1],1], m2=[p[1][0],p[1][1],1];
  const m3=[p[3][0],p[3][1],1], m4=[p[2][0],p[2][1],1];
  const d2 = dt(cr(m2,m4),m3), d3 = dt(cr(m3,m4),m2);
  if (Math.abs(d2)<1e-9 || Math.abs(d3)<1e-9) return null;
  const k2 = dt(cr(m1,m4),m3)/d2, k3 = dt(cr(m1,m4),m2)/d3;
  const n2=[k2*m2[0]-m1[0], k2*m2[1]-m1[1], k2*m2[2]-m1[2]];
  const n3=[k3*m3[0]-m1[0], k3*m3[1]-m1[1], k3*m3[2]-m1[2]];
  const den = n2[2]*n3[2];
  if (Math.abs(den)<1e-12) return null;
  const f2 = -((n2[0]-n2[2]*u0)*(n3[0]-n3[2]*u0)
             + (n2[1]-n2[2]*v0)*(n3[1]-n3[2]*v0)) / den;
  if (!isFinite(f2) || f2 <= 1) return null;
  const f = Math.sqrt(f2);

  const H = homography([[0,0],[tw,0],[tw,th],[0,th]], quad);   // mm → 사진
  if (!H) return null;
  const Ki = [[1/f,0,-u0/f],[0,1/f,-v0/f],[0,0,1]];
  const A = [0,1,2].map(r => [0,1,2].map(c =>
      Ki[r][0]*H[c] + Ki[r][1]*H[3+c] + Ki[r][2]*H[6+c]));   // A = K⁻¹H (열 = A[*][c])
  const col = c => [A[0][c], A[1][c], A[2][c]];
  const n = v => Math.hypot(v[0],v[1],v[2]);
  const s = 2 / (n(col(0)) + n(col(1)));
  const r1 = col(0).map(v=>v*s), r2 = col(1).map(v=>v*s), tv = col(2).map(v=>v*s);
  const r3 = cr(r1, r2);
  // C = -Rᵀt  (R 의 열이 r1,r2,r3 이므로 Rᵀt 는 각 열과의 내적)
  const C = [-dt(r1,tv), -dt(r2,tv), -dt(r3,tv)];
  return C[2] > 100 ? C : null;
}

// 공 중심이 노즈 평면보다 얼마나 아래인가 (mm, 음수).
//   노즈(천 이음새) = 바닥에서 40mm (사용자 제공: 쿠션 높이)
//   공 중심        = 바닥에서 지름의 절반
// ⚠️ 우리 원근변환은 노즈 평면 것인데 공 중심은 그보다 9mm 아래다. 카메라가 낮으면
//    그 9mm 가 먼 쪽에서 수십 mm 로 벌어지고 **각도가 바뀌면 방향도 바뀐다** —
//    같은 배치를 다른 각도로 찍으면 좌표가 안 맞던 원인이 이것이다
//    (2026-08-09: 흩어짐 중앙값 16.6 → 12.5mm). 맞춘 값이 아니라 규격에서 나온다.
function dropToBallPlane(p, C, drop){
  if (!C) return p;
  const k = (C[2] - drop) / C[2];
  return [C[0] + (p[0]-C[0])*k, C[1] + (p[1]-C[1])*k];
}

// 원시 픽셀에서 공을 찾는다. 캔버스를 안 쓰므로 그대로 시험할 수 있다.
//   px: RGBA Uint8, sw×sh / quad: 그 그림에서의 당구대 4코너 / 결과: mm 좌표
function ballsFromPixels(px, sw, sh, quad, tw, th, ballMm){
  const src = orderQuad(quad, sw, sh);            // 좌하, 우하, 우상, 좌상
  const mm  = [[0,0],[tw,0],[tw,th],[0,th]];
  const Hf = homography(src, mm), Hi = homography(mm, src);
  if (!Hf || !Hi) return [];
  const CAM = cameraPos(src, sw, sh, tw, th);
  const DROP = ballMm/2 - 40;                    // 공 중심 − 노즈 높이 (음수)
  const inside = quadInside(src, QUAD_PAD);

  // ★ 색깔별로 따로 찾는다. 한 마스크에 다 넣으면 빨간공과 노란공이 닿아 있을 때
  //   (특히 초점이 나간 사진) 한 덩어리가 되어 크기 조건에 걸려 둘 다 사라진다.
  const groups = {};
  for (const r of BALL_RULES) (groups[r.name] = groups[r.name] || []).push(r);

  const lab = new Int32Array(sw*sh);
  const stack = new Int32Array(sw*sh);
  const found = [];

  for (const name in groups){
    const rules = groups[name];
    const mask = new Uint8Array(sw*sh);
    for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++){
      const i = y*sw + x, o = i*4;
      if (!inside(x, y)) continue;
      const [h,s,v] = rgb2hsv(px[o], px[o+1], px[o+2]);
      for (const r of rules) if (hitRule(h, s, v, r)){ mask[i] = 1; break; }
    }
    lab.fill(0);
    for (let seed = 0; seed < sw*sh; seed++){
      if (!mask[seed] || lab[seed]) continue;
      let sp = 0, n = 0, sx = 0, sy = 0, sr = 0, sg = 0, sb = 0;
      let x0 = sw, x1 = -1, y0 = sh, y1 = -1;
      stack[sp++] = seed; lab[seed] = 1;
      while (sp){
        const i = stack[--sp], x = i % sw, y = (i - x) / sw, o = i*4;
        n++; sx += x; sy += y; sr += px[o]; sg += px[o+1]; sb += px[o+2];
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
        if (x > 0    && mask[i-1]  && !lab[i-1] ){ lab[i-1]  = 1; stack[sp++] = i-1; }
        if (x < sw-1 && mask[i+1]  && !lab[i+1] ){ lab[i+1]  = 1; stack[sp++] = i+1; }
        if (y > 0    && mask[i-sw] && !lab[i-sw]){ lab[i-sw] = 1; stack[sp++] = i-sw; }
        if (y < sh-1 && mask[i+sw] && !lab[i+sw]){ lab[i+sw] = 1; stack[sp++] = i+sw; }
      }
      const cx = sx/n, cy = sy/n;
      const d = localBallPx(Hf, Hi, cx, cy, ballMm);
      if (d < 4) continue;
      const bw = x1-x0+1, bh = y1-y0+1;
      if (n < d*d*0.2 || n > d*d*3.0) continue;
      if (bw < d*0.4 || bw > d*2.2 || bh < d*0.4 || bh > d*2.2) continue;
      if (bw/bh < 0.5 || bw/bh > 2.0) continue;    // 사진 속 공은 동그랗다
      const p = dropToBallPlane(applyH(Hf, cx, cy), CAM, DROP);
      // 공 중심은 쿠션 날에서 최소 반지름만큼 안쪽에 있다. 그보다 밖이면 쿠션 나무다.
      // ⚠️ 여기를 지름만큼 풀고 안으로 끌어당겨 봤더니, 나무 덩어리가 통과해서
      //    코너에 공으로 붙었다 (2026-08-09). 밖으로 나간 것은 그냥 버린다.
      const m = ballMm/2*0.2;
      if (p[0] < m || p[0] > tw-m || p[1] < m || p[1] > th-m) continue;
      const [hh,ss,vv] = rgb2hsv(sr/n, sg/n, sb/n);
      found.push({p, area:n, hsv:[hh,ss,vv]});
    }
  }

  // 겹쳐 잡힌 조각은 한 공으로 본다. 초점이 나가거나 반사광이 있으면 공 하나가 둘로
  // 갈라지고 조각마다 평균색이 달라지므로 **색은 안 본다**.
  // ⚠️ 붙어 있는 두 공은 중심이 정확히 지름만큼 떨어져 있으므로 기준은 그보다 작아야 한다.
  found.sort((a,b) => b.area - a.area);
  const kept = [];
  for (const b of found)
    if (!kept.some(a => Math.hypot(a.p[0]-b.p[0], a.p[1]-b.p[1]) < ballMm*0.75))
      kept.push(b);

  // 3구는 흰·노·빨 하나씩이다. 반사광이나 큐대로 조각이 더 잡히면 큰 것만 남긴다.
  const isRed = b => (b.hsv[0] <= RED_LO || b.hsv[0] >= RED_HI) && b.hsv[1] >= 60;
  const reds = kept.filter(isRed).slice(0, 1);
  const rest = kept.filter(b => !isRed(b)).slice(0, 2)
                   .sort((a,b) => a.hsv[1] - b.hsv[1]);   // 채도 낮은 순
  const out = {};
  if (reds[0]) out.red = reds[0].p;
  // ⚠️ '채도 50 이하면 흰공' 같은 절대 기준은 조명이 바뀌면 깨진다. 서로 견준다 —
  //    제일 덜 물든 것이 흰공, 나머지가 노란공.
  if (rest.length >= 2){ out.white = rest[0].p; out.yellow = rest[1].p; }
  else if (rest.length === 1) out[rest[0].hsv[1] < 85 ? 'white' : 'yellow'] = rest[0].p;
  return out;
}

// ---------------------------------------------------------------- 정답 배치
// 숙제로 드린 배치도의 **지정 좌표**(mm). 이걸 화면에 겹쳐 그리면 원근보정이
// 얼마나 정확한지 눈으로·숫자로 잴 수 있다. 배치도를 만든 값 그대로다.
const LAYOUTS = {
  // ⚠️ 임의의 mm 값을 쓰면 안 된다. 당구대에서 그 자리에 정확히 놓을 방법이 없어
  //    정답 구실을 못 한다. 사람이 정확히 놓을 수 있는 자리는 셋뿐이다 —
  //    다이아몬드 교차점(306mm 격자) / 쿠션에 붙이고 다이아몬드 정렬 / 코너 밀착.
  //    그림: C:\sc\배치01~04.png (make_layouts.py 로 만든다)
  '01': {name:'격자 3점',  white:[306,306],    yellow:[1224,612],       red:[1836,918]},
  '02': {name:'격자 대각', white:[306,918],    yellow:[1224,306],       red:[2142,612]},
  '03': {name:'쿠션 밀착', white:[612,30.75],  yellow:[1836,1193.25],   red:[30.75,612]},
  '04': {name:'코너 밀착', white:[30.75,30.75],yellow:[2417.25,1193.25],red:[1224,612]}
};
let ANSWER = null;          // 지금 비교 중인 배치 (null 이면 안 그린다)

function drawAnswer(){
  if (!ANSWER) return;
  const a = LAYOUTS[ANSWER];
  if (!a) return;
  g.save();
  for (const [c, mm] of [['white',a.white],['yellow',a.yellow],['red',a.red]]){
    const [x,y] = toPx(...mm), r = ballR();
    g.strokeStyle = TONE[c]; g.lineWidth = Math.max(2, r*0.28);
    g.setLineDash([r*0.5, r*0.4]);
    g.beginPath(); g.arc(x, y, r*1.25, 0, 7); g.stroke();
    // 실제로 놓은 공과의 거리
    const put = S.balls[roleOf(c)];
    if (put){
      const d = Math.hypot(put.p[0]-mm[0], put.p[1]-mm[1]);
      g.setLineDash([]);
      g.fillStyle = '#fff'; g.font = 'bold ' + Math.round(r*1.1) + 'px sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'bottom';
      g.strokeStyle = '#101014'; g.lineWidth = Math.max(2, r*0.3);
      g.strokeText(Math.round(d) + 'mm', x, y - r*1.5);
      g.fillText(Math.round(d) + 'mm', x, y - r*1.5);
    }
    g.setLineDash([]);
  }
  g.restore();
}

// ---------------------------------------------------------------- 상태
const S = {balls:{}, cueWhite:true, place:null, aim:null, aiming:false, scatter:null,
           sugDown:null, lapEnd:false, verdict:{},
           corr:0, rMode:0, backup:null, drag:null, lastAim:null, rotHinted:0,
           blink:0, pal:null, routePage:0, listDrag:null,
           noteList:false, notePage:0, verDrag:null,
           // ★ 세기 — 0 약 · 1 중 · 2 강. 기본은 **중** (사용자 확정 2026-08-11).
           //   아직 자리만 잡아 둔 것이다. 경로 길이에는 연결하지 않았다 —
           //   두께·세기별 굴러간 거리 표가 채워지면 그때 연결한다 (data/speed.json).
           power:1, routeIx:-1, routeList:false, anim:0, listShown:null, rblink:0, snapA:null, lockRails:null,   // ⚠️ blink 는 공 놓을 때 반짝임이 이미 쓴다
           // ★ 시스템 고르기. 0 자동 · 1 파이브앤하프 고정 · 2 2뱅크 고정.
           //   ★ 사용자 2026-08-11: '0에서 10 언저리로 경로를 이동하면 파이브앤하프에서
           //     자동으로 2뱅크 시스템으로 안내하고 경로를 자동으로 설정.'
           //   → 기본은 **자동**이다. 1쿠션이 코너 쪽 0~10 이면 파이브앤하프로는
           //     못 읽는 영역이라 2뱅크로 넘어간다. 판독창 탭으로 고정할 수도 있다.
           sysMode:0,
           // 상하 당점. +3 상단 3팁 · 0 중단 · −3 하단 3팁 (고르는 화면은 아직 없다)
           // 당점 — 시계 방향(30분 단위) + 거리(팁). ss1 기준.
           // ★★ 표준 당점 — 사용자 2026-08-12: '팁은 **3시·9시 3팁**이 표준입니다.
           //   모두 거기서 출발하면 됩니다. 그 후 보정을 하면 되고.'  '상단기준.'
           //   = 옆으로 3시(또는 9시) 쪽 3팁 · 위로 상단.
           //   systems.json 에 2026-08-10 확정으로 적힌 **2시30분 3팁** 이 바로 이것이다
           //   (measured_bounce 도 separation 도 이 당점으로 잰 것이다).
           // ⚠️ 전에는 3시 2팁·중단(tipV 0) 이 기본값이었다 — 표준이 아니었다.
           tipDir:5, tipR:3,            // 2시30분 3팁
           tipV:0.776,     // 위 성분 (분리각에 쓴다)   3 × cos75도
           tipH:2.898,     // 옆 성분 (쿠션 반사에 쓴다) 3 × sin75도
           tipPanel:false};

// ---------------------------------------------------------------- 화면 좌표
let L = {};
// 세로로 든 화면에서는 당구대를 눕혀서 그린다. 당구대가 2:1 이라 세로 화면에
// 그대로 넣으면 절반이 빈다. 그리기 좌표계를 90도 돌리고, 손가락 좌표는
// 되돌려서 받는다.
let ROT = false, SIDE = false, PANEL = null, READOUT = null;
function layout(){
  ROT = cv.height > cv.width;
  const w = ROT ? cv.height : cv.width, h = ROT ? cv.width : cv.height;
  const ow = T.outer_width, oh = T.outer_height;
  // 화면을 가득 채운다. 세로로 들면 눕혀서 그린다 (당구대는 2:1 이라
  // 세로 화면에 그대로 넣으면 절반이 빈다).
  // 당구대를 최대한 키우되 오른쪽 버튼 칸은 반드시 남긴다.
  // ⚠️ '남는 폭을 쓴다'로 하면 화면비가 2:1 보다 좁은 폰에서 남는 폭이 0 이 되어
  //    버튼 크기가 음수가 되고 화면이 죽는다 (arcTo radius -0.54).
  // ⚠️ 배율을 두 개(sc, sc2) 두지 말 것. 하나가 옛 값을 쓰면 테두리와 천이
  //    어긋나 당구대와 버튼이 겹친다 (실기기에서 확인).
  // 여백을 최소로. 위·아래 각 1px 만 남긴다.
  const fit = Math.min((w - 2)/ow, (h - 2)/oh);   // 당구대만 놓았을 때
  const need = Math.max(h * 0.22, 72);            // 버튼 칸에 꼭 필요한 폭
  const panelW = Math.max(w - 2 - ow*fit, need);
  const sc = Math.min((w - 3 - panelW)/ow, (h - 2)/oh);

  const rw = ow*sc, rh = oh*sc;
  const rl = 1, rt = 1;      // 위·왼쪽 끝에 붙인다
  const px = T.rail_x*sc, py = T.rail_y*sc;
  PANEL = {x: rl + rw + 4, y: rt, w: Math.max(w - (rl+rw) - 8, 40), h: rh};
  L = {sc, w, h,                                   // w·h = 눕힌 뒤의 화면 크기
       rail:{x:rl, y:rt, w:rw, h:rh},
       cloth:{x:rl+px, y:rt+py, w:T.width*sc, h:T.height*sc},
       ox: rl+px, oy: rt+py+T.height*sc};
}
const toPx = (x,y) => [L.ox + x*L.sc, L.oy - y*L.sc];
const toMm = (px,py) => [(px-L.ox)/L.sc, (L.oy-py)/L.sc];

// ---------------------------------------------------------------- 버튼
// ⚠️ 고정 픽셀로 두면 안 된다. 폰은 화소밀도가 높아 58px 가 손톱만하게 나온다
//    (사용자 지적). 화면 짧은 변에 비례시켜 손가락에 맞춘다.
let BW = 58, BH = 58, BG = 8, ROWG = 12, GRPG = 18;
function sizeButtons(){
  // ⚠️ 기준은 **당구대 짧은 변(천 높이)** 하나로 통일한다. cv.width 같은 물리 화소를
  //    쓰면 폰마다 제각각이고, 당점(천 기준)과 버튼(화소 기준)이 따로 논다.
  const base = L.cloth.h;
  BW = BH = Math.round(base * 0.125);      // 천 높이의 12.5% (두 줄이 들어가야 한다)
  BG   = Math.round(BW * 0.14);
  ROWG = Math.round(BW * 0.16);
  GRPG = Math.round(BW * 0.30);
}
let BTN = [];
function buttonRects(){
  sizeButtons();
  if (PANEL) return sideButtons().concat(previewOn() ? [] : corrButtons());
  const w = BW*5 + BG*4 + GRPG, h = BH*2 + ROWG, pad = 12, c = L.cloth;
  // 좌상단은 당점 자리라 마지막 후보로 둔다
  const spots = [[c.x+c.w-pad-w, c.y+c.h-pad-h], [c.x+pad, c.y+c.h-pad-h],
                 [c.x+c.w-pad-w, c.y+pad], [c.x+pad, c.y+pad]];
  const busy = [];
  for (const k in S.balls){                       // 궤적은 덮어도 되고 공만 피한다
    const [bx,by] = toPx(...S.balls[k].p), r = ballR()+6;
    busy.push([bx-r, by-r, r*2, r*2]);
  }
  const [ex,ey] = tipCenter(), CR = clockR();
  busy.push([ex-CR-8, ey-CR-8, CR*2+16, CR*2+16]);
  const hit = (a,b) => a[0] < b[0]+b[2] && b[0] < a[0]+a[2] && a[1] < b[1]+b[3] && b[1] < a[1]+a[3];
  let best = spots[0];
  for (const s of spots) if (!busy.some(b => hit([s[0],s[1],w,h], b))) { best = s; break; }
  // ⚠️ 자리 고르기만 하면 화면 밖으로 나간다 (실기기에서 아랫줄이 잘렸다).
  //    반드시 천 안쪽으로 밀어 넣는다.
  let [x,y] = best;
  x = Math.min(Math.max(x, c.x + pad), c.x + c.w - pad - w);
  y = Math.min(Math.max(y, c.y + pad), c.y + c.h - pad*3 - h);   // 3쿠션 숫자를 피해 조금 위로
  const out = [];
  ['-','0','+','cam'].forEach((lb,i) => out.push({x:x+i*(BW+BG), y, w:BW, h:BH, lb}));
  const y2 = y + BH + ROWG;
  ['swap','white','yellow','red','reset'].forEach((lb,i) =>
    out.push({x:x + i*(BW+BG) + (i ? GRPG : 0), y:y2, w:BW, h:BH, lb}));
  return out;
}
function sideButtons(){
  // 오른쪽 칸 — 2줄 x 3칸 + 아래 카메라(2칸 폭, 크게).
  // ⚠️ 카메라가 제일 자주 쓰는 기능인데 제일 작았다 (사용자 지적). 하단에 크게 둔다.
  //    보정(- 0 +)은 다이 안 당점 옆으로 옮겼다 — 보정 숫자가 거기 그려지므로 한 묶음이다.
  const p = PANEL;
  const colGap = Math.max(3, p.w * 0.05);          // 버튼 사이 (전의 절반)
  const rowGap = colGap;
  const lead   = Math.max(2, p.w * 0.036);         // 숫자와 버튼 사이 (전의 30%)
  // 카메라는 **원**이다 (design.png). 칸을 정사각형으로 잡아야 원이 나온다 —
  // 가로로 긴 칸에 반지름만 크게 주면 알약 모양이 된다.
  const RO_H   = 1.05;                             // 판독창 높이 배수 (카메라 위)
  // ⚠️ 0.82 → 1.05. 시스템 이름을 **판독창 안**에 넣는다. 밖(위)에 그렸더니
  //    버튼에 가려 안 보였다 (사용자 지적 28.jpg).
  const CAM_D  = 1.6;                              // 카메라 지름 배수
  // ⚠️ 두 칸 폭(2.05)을 그대로 지름으로 쓰면 칸을 다 먹어 제품명 자리가 사라진다.
  // ★ 사용자 2026-08-11 — 세기(약·중·강) · 경로추천 두 칸을 넷째 줄로 넣는다.
  //   '버튼만, 기능은 나중에. 위치부터 잡아봅시다.'
  const ROWS = 4;
  const bw = Math.max(12, Math.min((p.w - colGap - lead) / 2,
                                   (p.h - rowGap*(ROWS+1)) / (ROWS + RO_H + CAM_D)));
  const totalW = bw*2 + colGap;
  const camD = bw*CAM_D;
  const totalH = bw*(ROWS + RO_H) + camD + rowGap*(ROWS+1);
  const x0 = p.x + lead + (p.w - lead - totalW) / 2;
  // 남는 세로 여백을 위·아래로 나누는 비율. 클수록 버튼 뭉치가 아래로 내려간다.
  // ⚠️ 전에는 0.78 이었다 — 이름 자리를 넉넉히 주려던 것인데, 이름을 한 줄
  //    (BSsystem) 로 줄이고 나니 로고와 첫 줄 사이가 크게 비고 카메라는 아래에
  //    붙어 버렸다 (사용자 지적 7.jpg: '제품명 아래 버튼들 조금만 위로 올려도 될 듯,
  //    그래야 카메라 버튼까지 같이 올라가죠').
  const TOP_SHARE = 0.50;
  const y0 = p.y + (p.h - totalH) * TOP_SHARE;
  const out = [];
  [['swap','reset'], ['white','yellow'], ['red','exit'],
   ['power','suggest']].forEach((row,i) =>
    row.forEach((lb,j) => out.push({x:x0 + j*(bw+colGap), y:y0 + i*(bw+rowGap),
                                    w:bw, h:bw, lb})));
  // 판독창(누르는 것 아님) 자리를 잡아두고, 카메라는 그 아래에 둔다 (사용자 지시).
  // ⚠️ 2026-08-11 에 카메라와 판독창을 맞바꿔 보자는 얘기가 나왔지만
  //    사용자가 '카메라 버튼 그대로 유지' 로 정했다. 바꾸지 말 것.
  const roY = y0 + ROWS*(bw+rowGap);
  READOUT = {x:x0, y:roY, w:totalW, h:bw*RO_H};
  out.push({x:x0 + (totalW-camD)/2, y:roY + bw*RO_H + rowGap,
            w:camD, h:camD, lb:'cam'});
  BW = BH = bw;
  return out;
}

// 보정(- 0 +) — 당점 그림 바로 옆에 붙여 한 묶음으로 움직인다.
// 보정 바의 자리 — 당점 중심을 주면 계산한다.
// ⚠️ clockCenter 를 여기서 부르면 안 된다. clockCenter 가 이 함수를 쓰기 때문이다
//    (서로 물고 돌면 화면이 통째로 죽는다).
function corrGeom(ex, ey){
  const R = clockR(), c = L.cloth;
  // 오른쪽 칸 공 버튼과 같은 크기로 맞춘다 (사용자 지시).
  // ⚠️ BW 는 sideButtons() 가 정한다. buttonRects() 가 sideButtons() 를 먼저 부르므로
  //    여기서는 이미 값이 들어 있다. 당점 크기에 맞추면 안 된다 — 당점은 보기만
  //    하는 그림이고 이건 손가락으로 누른다.
  // ⚠️ 당점 반지름을 하한으로 두면 안 된다 — 조건에 따라 BW 보다 커진다.
  //    오른쪽 칸 여섯 버튼과 **정확히 같은 크기**로 둔다 (사용자 지시).
  const bw = Math.round(BW || c.h * 0.12);
  const gap = Math.round(bw * 0.16);
  const w = bw*3 + gap*2;
  const up = ey > c.y + c.h/2;                     // 아래쪽 모서리면 위로 붙인다
  const y0 = up ? ey - R - gap - bw : ey + R + gap;
  return {x: Math.min(Math.max(ex - w/2, c.x + 4), c.x + c.w - w - 4),
          y: Math.min(Math.max(y0, c.y+4), c.y + c.h - bw - 4),
          w, h: bw, bw, gap};
}

function corrButtons(){
  // ★ 사용자 2026-08-14: '공이 난수로 움직일때는 보정상황판은 꺼주시고 공이 멈춘후 보여주세요.'
  if (S.anim || S.scatter) return [];             // 시뮬레이션·초구 뿌리기 중에는 보정 버튼도 없앤다
  const q = cluster().q;                          // 당점·이름·▶ 와 같은 자리에서 나온다
  return ['-','0','+'].map((lb,i) =>
    ({x: q.x + i*(q.bw+q.gap), y: q.y, w: q.bw, h: q.bw, lb}));
}

// 당점은 **보기만 하는 그림**이라 작아도 된다 (사용자 지시로 줄임).
const clockR = () => L.cloth.h * 0.055;
// ⚠️ 여기서 BTN(버튼 자리)을 보면 안 된다. buttonRects() 가 clockCenter() 를
//    부르므로 서로 물고 도는 순환이 되고, const 화살표 함수라 선언 전에
//    불려 화면이 통째로 죽는다 (실기기에서 확인).
//    당점은 버튼과 무관하게 **천 네 모서리 중 하나**에 둔다. 버튼은 알아서 피한다.
// ⚠️ 한 자리에 고정하면 그 모서리에 공이 있을 때 덮어버린다 (사용자 지적).
//    공에서 제일 먼 모서리를 고른다. 공이 없으면 왼쪽 위 그대로.

let PATH_CACHE = {key:null, pts:null};

// 카메라·시험 사진 미리보기 중인가. ⚠️ 이때 다이 안에는 아무것도 그리지 않는다
//    (사용자 지시: 촬영시 다이 안은 공란). 셔터는 우측 하단 원버튼 하나뿐이다.
function previewOn(){ return !!(TEST.img || (CAMLIVE && VID.videoWidth)); }

// 화면의 한 점에서 지금 궤적까지의 거리 (px). 궤적이 없으면 아주 큰 값.
// ⚠️ clockCenter 안에서 부르므로 clockCenter 를 되부르는 것을 넣으면 안 된다
//    (전에 서로 물고 돌아 화면이 통째로 죽었다).
function pathDist(t){
  const box = clusterBox(t);
  const cue = S.balls.cue;
  if (!cue || !S.aim) return 1e9;
  // ⚠️ 한 프레임에 네 모서리를 다 재므로 그때마다 궤적을 새로 굴리면 안 된다.
  //    조건이 같으면 지난 결과를 쓴다.
  const key = cue.p[0]+','+cue.p[1]+','+S.aim[0]+','+S.aim[1]+','+S.corr+','+L.sc;
  if (PATH_CACHE.key !== key){
    let hits = null;
    try { hits = pathFromAim(cue.p, S.aim, S.corr); } catch(e){ hits = null; }
    PATH_CACHE = {key, pts: (hits && hits.length)
      ? [cue.p, ...hits.map(h => h.p)].map(p => toPx(...p)) : null};
  }
  const pts = PATH_CACHE.pts;
  if (!pts) return 1e9;
  // ⚠️ 당점 중심점까지가 아니라 **묶음 상자까지** 재야 한다. 공과 같은 이유로,
  //    중심은 궤적에서 멀어도 보정 바가 궤적을 덮는다 (사용자 지시).
  //    선분을 잘게 나눠 상자까지의 거리를 잰다.
  let best = 1e9;
  for (let i = 0; i < pts.length-1; i++){
    const [ax,ay] = pts[i], [bx,by] = pts[i+1];
    const n = Math.max(2, Math.min(24, Math.round(Math.hypot(bx-ax, by-ay) / 20)));
    for (let k = 0; k <= n; k++){
      const u = k/n;
      best = Math.min(best, rectD(box, [ax + (bx-ax)*u, ay + (by-ay)*u]));
    }
  }
  return best;
}

// 상자에서 점까지의 거리 (상자 안이면 0)
function rectD(b, p){
  return Math.hypot(Math.max(b[0] - p[0], 0, p[0] - b[2]),
                    Math.max(b[1] - p[1], 0, p[1] - b[3]));
}

// 당점 원 + 시뮬레이션 원 + 보정 바를 묶은 상자 [x0,y0,x1,y1]
function clusterBox(t){
  // ⚠️ cluster() 와 같은 기준으로 잡아야 한다 (보정 바는 clockCenter 에서 r*1.15 왼쪽)
  const r = clockR(), q = corrGeom(t[0] - r*1.15, t[1]);
  return [Math.min(t[0]-r*2.2, q.x), Math.min(t[1]-r*1.3, q.y),
          Math.max(t[0]+r*2.2, q.x+q.w), Math.max(t[1]+r*1.3, q.y+q.h)];
}

// ★★ 사용자 2026-08-13 (ss.jpg): '보정 아래에 공을 **2개** 배치하세요.
//   좌측은 당점, 우측은 시뮬레이션(공 모양 · 수구 색깔 · 가운데 큰 화살표).
//   추천 경로에서 시뮬레이션은 제거.'
//   → clockCenter() 가 정하는 자리를 가운데로 보고 좌우로 갈라 놓는다.
// ★★ 당점 · 당점이름 · 시뮬레이션을 **보정 버튼 세 칸 위에 하나씩** 세운다
//   (사용자 2026-08-14, 4·5.jpg) —
//     '시물레이션 버튼은 보정+ 위에 고정하고 가운데에 2시30분·3팁 을 항상 넣어주라구요'
//
//        [당점 공]   2시30분 · 3팁   [▶]
//           [−]          [0]        [+]
//
//   전에는 당점과 ▶ 가 clockCenter 를 가운데 두고 좌우로 붙어 있어, 보정 바가
//   화면 끝에서 밀리면 세로줄이 안 맞았다.
//   ⚠️ corrGeom 은 tipCenter 를 부르지 않는다 — clockCenter 로만 자리를 잡는다.
//      (여기서 tipCenter 를 쓰면 서로 물고 돌아 화면이 죽는다)
function cluster(){
  const [cx0, cy] = clockCenter(), r = clockR();
  const q = corrGeom(cx0 - r*1.15, cy);
  const mid = q.bw/2, step = q.bw + q.gap;
  return {q, r, y: cy,
          tip: [q.x + mid,            cy],
          nam: [q.x + mid + step,     cy],
          sim: [q.x + mid + step*2,   cy],
          // ★ 키스 자동조정 — 키스가 날 때만 뜬다 (위 kissFixTip 주석)
          kiss:[q.x + mid + step*3,   cy]};
}
function tipCenter(){ return cluster().tip; }
function simCenter(){ return cluster().sim; }
function clockCenter(){
  const r = clockR(), m = r * 0.5, c = L.cloth;
  const spot = [[c.x + r + m,       c.y + r + m],          // 왼쪽 위 (기본)
                [c.x + c.w - r - m, c.y + r + m],
                [c.x + r + m,       c.y + c.h - r - m],
                [c.x + c.w - r - m, c.y + c.h - r - m]];
  const put = Object.keys(S.balls).map(k => toPx(...S.balls[k].p));
  if (!put.length) return spot[0];
  // ⚠️ '기준치를 넘으면 바로 그 자리'로 하면 안 된다. 기준을 아슬아슬하게 넘긴
  //    왼쪽 위가 계속 뽑혀 공을 덮는다 (사용자 지적, 6.jpg — 54px 떨어졌는데
  //    기준이 52px 이라 통과했다). **제일 빈 모서리**를 고른다.
  // ⚠️ 당점 원만 재면 안 된다. 같이 움직이는 **보정 바**가 훨씬 넓어서, 당점은
  //    비어 있어도 바가 공을 덮는다 (사용자 지적, 4.jpg 에서 수구가 가려졌다).
  //    당점 원 + 바를 하나의 상자로 묶어 잰다.
  const ballD = t => { const b = clusterBox(t);
                       return Math.min(...put.map(p => rectD(b, p))); };
  const clear = ballR() * 1.1;                              // 이만큼 떨어지면 안 덮는다
  // 공은 반드시 피하고, **그중에서 궤적도 가능하면 피한다** (사용자 지시).
  const okay = spot.filter(t => ballD(t) >= clear);
  let cand = okay.length ? okay : spot;
  // ★★ 점수 슬라이더도 피한다 (사용자 2026-08-16, 12.jpg:
  //   '의견과 포인트가 중복이 됩니다 … 이 화면에서는 보정판이 위로 올라가면 좋겠습니다.')
  //   슬라이더는 다이 아래를 가로로 다 덮는다. 뭉치가 그 위에 앉으면 —
  //     · 당점을 누르려 해도 슬라이더가 가로챈다 (요청 #13)
  //     · 의견 칸이 왼쪽으로 밀려 슬라이더 눈금 '0' 과 겹친다 (12.jpg)
  //   → 슬라이더와 안 겹치는 모서리가 있으면 그쪽을 쓴다. 그러면 저절로 위로 간다.
  {
    let vb = null;
    try { vb = verBar(); } catch(e){ vb = null; }
    if (vb){
      const free = cand.filter(t => { const b = clusterBox(t);
        return !(b[0] < vb.x + vb.w && b[2] > vb.x && b[1] < vb.y + vb.h && b[3] > vb.y); });
      if (free.length) cand = free;
    }
  }
  let best = cand[0], bestD = -1;
  for (const t of cand){
    const d = okay.length ? pathDist(t) : ballD(t);
    if (d > bestD){ bestD = d; best = t; }                  // 같으면 앞쪽(왼쪽 위) 유지
  }
  return best;
}
const ballR = () => Math.max(5, T.ball_diameter/2*L.sc);

function tapButton(px,py){
  for (const b of BTN){
    if (px < b.x || px > b.x+b.w || py < b.y || py > b.y+b.h) continue;
    // ★ 보정을 바꿔도 같이 따라간다 (당점과 같은 이유 — reaimForTip 주석 참고)
    if (b.lb === '+'){ S.corr += 0.5; reaimForTip(); }
    else if (b.lb === '-'){ S.corr -= 0.5; reaimForTip(); }
    else if (b.lb === '0'){ S.corr = 0; reaimForTip(); }
    else if (b.lb === 'cam') shoot();

    else if (b.lb === 'exit'){
      // 설치한 앱(PWA)이면 창이 닫히고, 브라우저 탭이면 못 닫는 경우가 있다.
      // 그때는 사진과 공을 지워 처음 상태로 돌린다.
      window.close();
      setTimeout(() => {
        PHOTO = WARPED = TABLE_HULL = null;
        TEST.img = null; TEST.i = -1;
        S.balls = {}; S.aim = null; S.corr = 0;
        msg.style.display = 'block'; msg.textContent = '처음 상태로 돌렸습니다';
        setTimeout(() => { msg.textContent = ''; msg.style.display = 'none'; }, 2000);
      }, 300);
    }
    else if (b.lb === 'swap'){
      // ⚠️ S.cueWhite 만 뒤집으면 안 된다. 공은 역할(cue/obj1)로 담겨 있어서
      //    깃발만 바꾸면 화면의 노란 링이 엉뚱한 공에 남는다 (사용자 지적).
      //    흰공·노란공의 자리와 색을 통째로 맞바꾼다.
      S.cueWhite = !S.cueWhite;
      const a = S.balls.cue, b2 = S.balls.obj1;
      if (a) S.balls.obj1 = a; else delete S.balls.obj1;
      if (b2) S.balls.cue = b2; else delete S.balls.cue;
    }
    else if (['white','yellow','red'].includes(b.lb)){
      S.place = S.place === b.lb ? null : b.lb;
      // 손가락으로 끌어다 놓기도 된다 (사용자 지시). 탭 방식은 그대로 남긴다 —
      // 움직이지 않고 떼면 지금처럼 '고른 상태' 로 남는다.
      S.pal = {c: b.lb, x: px, y: py, moved: false};
    }
    else if (b.lb === 'reset') doReset();
    // ★ 세기 — 누를 때마다 약 → 중 → 강. 기본은 중 (사용자 확정).
    //   ⚠️ 아직 경로 길이에 연결하지 않았다. 자리와 눈에 보이는 상태만 만든 것이다.
    else if (b.lb === 'power') S.power = (S.power + 1) % 3;
    // ★ 경로추천 — 누를 때마다 다음 경로로. 끝나면 직접조준 (사용자 승인 2026-08-11).
    else if (b.lb === 'suggest'){
      // ★ 사용자 2026-08-12 —
      //   '추천을 누르면 처음에 공배치 후 **한 번만** 리스트를 보여주고,
      //    선택하면 해당 경로를 보여주고, 다음부터 추천을 탭하면 리스트로
      //    돌아가지 말고 **하나씩** 넘긴다. 공배치를 바꾸고 다시 누르면 리스트부터.'
      //   → 배치가 그대로면 순환, 배치가 바뀌었으면 리스트.
      //     배치가 바뀌었는지는 routeKey() 가 알려 준다 (공·보정·당점이 들어 있다).
      // ⚠️ 여기서는 아무것도 안 한다 — 짧게/길게를 가르려고 **뗄 때**(up) 처리한다.
      //   down() 이 'suggest' 를 가로채므로 이 갈래는 사실상 안 온다.
    }
    return true;
  }
  return false;
}
function doReset(){
  if (S.rMode === 0) S.aim = null;
  else if (S.rMode === 1){ S.backup = {b:{...S.balls}, aim:S.lastAim}; S.balls = {}; S.aim = null; }
  else if (S.backup){ S.balls = {...S.backup.b}; S.aim = S.backup.aim; }
  S.place = null;
  S.rMode = (S.rMode+1) % 3;
}

// 공끼리 **붙는 것은 되지만 올라탈 수는 없다** (사용자 확정).
// 겹치면 중심 사이 거리가 지름이 되도록 밀어낸다. 밀린 공이 또 다른 공과 겹칠 수
// 있으므로 몇 번 되풀이한다.
function separate(role, p){
  const D = T.ball_diameter;
  let x = p[0], y = p[1];
  for (let n = 0; n < 8; n++){
    let moved = false;
    for (const k in S.balls){
      if (k === role) continue;
      const o = S.balls[k].p;
      let dx = x - o[0], dy = y - o[1], d = Math.hypot(dx, dy);
      if (d >= D - 1e-6) continue;
      if (d < 1e-6){ dx = 1; dy = 0; d = 1; }     // 정확히 포개졌으면 아무 방향으로
      x = o[0] + dx/d*D; y = o[1] + dy/d*D;
      moved = true;
    }
    x = Math.min(Math.max(x, 0), T.width);
    y = Math.min(Math.max(y, 0), T.height);
    if (!moved) break;
  }
  return [x, y];
}

// ★★ 카메라 모드에서 상황판을 터치하면 **랜덤 배치** (사용자 2026-08-14)
//   '카메라 모드로 들어가서 상황판을 터치하면 랜덤으로 공을 배치해 주세요.
//    이때 수구는 기존에 설정되어 있는 수구입니다.
//    여기서 추천을 누르고 이상한 경로들을 걸러냅시다.'
//   → 배치를 손으로 놓지 않고 계속 뽑아 가며 추천을 훑어보기 위한 것이다.
//   ⚠️ 수구 색은 안 바꾼다 (S.cueWhite 그대로). 놓이는 자리만 새로 뽑는다.
//   ⚠️ 쿠션에 딱 붙은 배치는 이 앱이 배우려는 것이 아니다 (허공에 뜬 공).
//      쿠션에서 공 하나 반쯤 띄우고, 공끼리도 두 개 폭 이상 벌린다.
function randomLayout(){
  const got = scatterLayout();
  if (!got) return;                       // 40번 뿌려도 안 되면 배치를 안 바꾼다
  // ★ 사용자 2026-08-14: '또 흰공이 초구합니다.' → 초구는 흰공이다.
  S.cueWhite = true;
  // ★★ 사용자 2026-08-14: '공 세개가 좌측하단에 모여 있다가 우측으로 날라가서
  //   공끼리 충돌 후 돌아다니다가 서는 것을 시뮬레이션으로 보여주세요.'
  //   → 결과만 놓지 않는다. **받아들여진 그 던지기를 그대로 다시 굴려** 보여 준다.
  //     엔진이 고정 스텝이라 같은 시작이면 같은 자리에 선다 — 화면과 결과가 어긋나지 않는다.
  S.balls = {cue:  {p: got.start[0].p.slice(), color: 'white'},
             obj1: {p: got.start[1].p.slice(), color: 'yellow'},
             obj2: {p: got.start[2].p.slice(), color: 'red'}};
  S.scatter = {sim: {k:0, E:0, stop: SCATTER_STOP, balls: got.start.map((b,i) =>
                 ({key: ['cue','obj1','obj2'][i],
                   color: ['white','yellow','red'][i],
                   p: b.p.slice(), v: b.v.slice(), spin:false}))},
               last: performance.now(), rest: performance.now(), acc: 0};
  // ★ 사용자 2026-08-14: '무작위배치 누르면 경로는 보여주지 말고 공만 배치하세요.'
  //   조준을 비우면 궤적이 안 그려진다 (곳곳에 !S.aim 이면 건너뛰게 되어 있다).
  S.aim = null;
  // ROUTES 는 배치로 키를 잡으니 저절로 새로 계산된다. 화면 상태만 되돌린다.
  S.corr = 0; S.routeIx = -1; S.routeList = false; S.listShown = null;
  S.place = null; S.drag = null; S.anim = null; S.routePage = 0;
  tipAuto();                               // 배치가 바뀌면 자동완성이 다시 산다
}

// ★★★ 실제 당구장에서 초구를 놓는 방식 그대로 (사용자 2026-08-14) —
//   '좌측하단에서 공 세개를 손으로 잡고 우측방향으로 뿌립니다. 그러면 공끼리 충돌을
//    하고 사방으로 뿌려집니다. 우측방향은 상단 끝에서 하단끝까지 랜덤이고 뿌리는
//    힘의 세기도 랜덤입니다. 서로 충돌을 하고 각각 돌다가 멈추면 초구의 위치가 됩니다.'
//   → 자리를 난수로 찍지 않는다. **엔진으로 실제로 뿌려서** 멈춘 자리를 쓴다.
//     그래야 실전에 나오는 배치 분포가 나온다 (코너에 몰리는 것도, 붙는 것도 자연스럽게).
//   ⚠️ 회전은 안 준다 (손으로 뿌리는 것이다). k=0 · E=0 · spin=false.
function scatterLayout(){
  const D = T.ball_diameter, R = D/2;
  const KEYS = ['cue','obj1','obj2'];
  for (let tryN = 0; tryN < 40; tryN++){
    // 손에 쥔 자리 — 좌측하단
    const ox = R + D*(0.3 + Math.random()*0.8);
    const oy = R + D*(0.3 + Math.random()*1.2);
    // 뿌리는 방향 — 우측 레일의 위쪽 끝에서 아래쪽 끝까지
    const ty   = R + Math.random()*(T.height - 2*R);
    const base = Math.atan2(ty - oy, (T.width - R) - ox);
    const v0   = 2300 + Math.random()*2800;              // 뿌리는 세기도 난수
    // 손에서 빠질 때 세 공이 붙어 있다 — 진행 방향 옆으로 나란히 놓아 서로 부딪게 한다
    const px = -Math.sin(base), py = Math.cos(base);
    const balls = KEYS.map((key, i) => {
      const t = (i - 1) * D * 1.02;
      const a = base + (i - 1) * 0.10 + (Math.random()-0.5)*0.16;
      const sp = v0 * (0.72 + Math.random()*0.56);
      return {key, color: null, spin: false,
              p: [ox + px*t, oy + py*t],
              v: [Math.cos(a)*sp, Math.sin(a)*sp]};
    });
    // 시작부터 다이 밖이면 버린다
    if (balls.some(b => b.p[0] < R || b.p[0] > T.width - R ||
                        b.p[1] < R || b.p[1] > T.height - R)) continue;
    const start0 = balls.map(b => ({p: b.p.slice(), v: b.v.slice()}));   // 뿌린 그 순간
    const sim = {balls, k: 0, E: 0, stop: SCATTER_STOP};   // 화면과 같은 기준이라야 자리가 맞다
    let n = 0, bump = false;
    // ★ 사용자 2026-08-14: '또 공끼리 한번은 충돌을 해야 하는데'
    //   손으로 뿌리면 반드시 서로 부딪는다. 안 부딪은 던지기는 버린다.
    while (n++ < 90000 && balls.some(b => Math.hypot(b.v[0], b.v[1]) > 0)){
      simStep(sim, SIM_DT);
      if (!bump){
        for (let i = 0; i < 3 && !bump; i++) for (let j = i+1; j < 3; j++)
          if (Math.hypot(balls[i].p[0]-balls[j].p[0],
                         balls[i].p[1]-balls[j].p[1]) <= D*1.02){ bump = true; break; }
      }
    }
    if (!bump) continue;                    // 한 번도 안 부딪었으면 다시 뿌린다
    const p = balls.map(b => b.p);
    // 멈춘 자리가 쓸 만한가 — 다이 안 · 서로 안 붙음 · 한 군데 뭉치지 않음
    if (p.some(q => q[0] < R-1 || q[0] > T.width-R+1 || q[1] < R-1 || q[1] > T.height-R+1)) continue;
    let mn = 1e9, mx = 0;
    for (let i = 0; i < 3; i++) for (let j = i+1; j < 3; j++){
      const dd = Math.hypot(p[i][0]-p[j][0], p[i][1]-p[j][1]);
      if (dd < mn) mn = dd;
      if (dd > mx) mx = dd;
    }
    if (mn < D * 1.15) continue;            // 붙어 있으면 다시 뿌린다
    if (mx < D * 6)    continue;            // 한 군데 뭉쳤으면 다시 뿌린다
    return {start: start0, final: p.map(q => q.slice())};
  }
  return null;
}

function roleOf(c){
  if (c === 'red') return 'obj2';
  return c === (S.cueWhite ? 'white' : 'yellow') ? 'cue' : 'obj1';
}

// 조준 미세조정 — 한 번에 이만큼(도) 안쪽으로 움직이면 그 몫을 GAIN 만큼만 준다
const AIM_FINE_DEG = 2.0, AIM_FINE_GAIN = 0.25;
function frameAt(px,py){
  const c = L.cloth, r = L.rail;
  if (px > c.x && px < c.x+c.w && py > c.y && py < c.y+c.h) return null;
  if (px < r.x || px > r.x+r.w || py < r.y || py > r.y+r.h) return null;
  // ★ 2뱅크는 **레일 포인트** 기준이다 (사용자 확정). 프레임 포인트로 조준하면
  //   눈금과 조준점이 어긋난다. 레일(쿠션 날) 위로 붙인다.
  //   사용자 2026-08-11 (32.jpg): '하단 프레임 0에서 10 안쪽을 탭하면 자동으로
  //   지금의 경로로 안내를 하면 좋겠어요.' — 그 눈금을 그대로 겨냥하게 하는 것이다.
  const off = curSystem() === 1 ? 0 : T.frame_offset;
  let [x,y] = toMm(px,py);
  const cl = (v,m) => Math.min(Math.max(v,0), m);
  const cand = [[Math.abs(y-(T.height+off)), [cl(x,T.width), T.height+off]],
                [Math.abs(y+off),            [cl(x,T.width), -off]],
                [Math.abs(x+off),            [-off, cl(y,T.height)]],
                [Math.abs(x-(T.width+off)),  [T.width+off, cl(y,T.height)]]];
  cand.sort((a,b) => a[0]-b[0]);
  return cand[0][1];
}
function ballAt(px,py){
  const r = ballR()+8;
  for (const k of ['obj2','obj1','cue']){
    const b = S.balls[k]; if (!b) continue;
    const [bx,by] = toPx(...b.p);
    if ((bx-px)**2 + (by-py)**2 <= r*r) return k;
  }
  return null;
}
// 잠깐 뜨는 안내
function flash(t, ms){
  msg.style.display = 'block'; msg.textContent = t;
  setTimeout(() => { msg.textContent = ''; msg.style.display = 'none'; }, ms || 1800);
}

// 당점판이 열려 있을 때. **한 번 탭하면 그 자리로 정하고 바로 닫는다** (사용자 지시).
// ★ 고르는 것만으로는 닫지 않는다. 오른쪽 안내(시계 자리·분리각·쿠션 보정)를
//   보고 나서 '조정 완료' 를 눌러야 나간다 (사용자 지시 2026-08-10).
function tapTipPanel(px,py){
  const q = tipGeom();
  for (const b of q.btn)
    if (px >= b.x && px <= b.x+b.w && py >= b.y && py <= b.y+b.h){
      if (b.done) S.tipPanel = false;      // 이것만 나간다
      else setTip(b.dir, b.r);             // 프리셋도 값만 바꾸고 남는다
      return;
    }
  const dx = px - q.cx, dy = py - q.cy, dist = Math.hypot(dx, dy);
  if (dist <= q.R){
    if (dist > q.R*TIP_EDGE){ flash('바깥 7mm 는 큐가 미끄러집니다'); return; }
    // ⚠️ 아무 데나 찍히게 하지 않는다. 표가 팁 단위로만 있어서, 사이를 허용하면
    //    없는 값을 지어내 쓰게 된다. **가장 가까운 자리**로 붙인다.
    let best = q.dots[0], bd = 1e9;
    for (const d of q.dots){
      const [ox,oy] = tipXY(d.dir, d.r, q.unit);
      const t = Math.hypot(dx - ox, dy - oy);
      if (t < bd){ bd = t; best = d; }
    }
    setTip(best.dir, best.r);              // 값만 바꾸고 판은 그대로
    return;
  }
  S.tipPanel = false;                      // 판 바깥을 탭하면 나간다
}

function down(px,py){
  // ★ 뿌리는 중이면 어디를 눌러도 끝까지 굴려 확정한다 (기다리기 싫을 때)
  if (S.scatter){ scatterFinish(); blink(); return; }
  if (S.tipPanel){ tapTipPanel(px,py); return; }
  // 경로 리스트가 열려 있으면 그것부터 — 칸을 고르면 그 경로로 가고 닫힌다
  // ★ 상·중·하 — 다이 안 막대 (사용자 2026-08-14)

      py >= BRAND_HIT.y && py <= BRAND_HIT.y + BRAND_HIT.h){
    S.noteList = true; S.notePage = 0;
    noteSync(() => blink());
    blink(); return;
  }
  // ★ 점수판 오른쪽 '의견' 칸 — 요청·평가를 쓴다 (위 NOTE 주석 참고)
  if (NOTE_HIT && px >= NOTE_HIT.x && px <= NOTE_HIT.x + NOTE_HIT.w &&
      py >= NOTE_HIT.y && py <= NOTE_HIT.y + NOTE_HIT.h){
    noteOpen(); return;
  }
  // ★ 키스 자동조정 — 당점을 돌려 키스가 없어지는 길을 찾는다 (위 kissFixTip)

      py >= KISS_HIT.y && py <= KISS_HIT.y + KISS_HIT.h){
    kissFixTip(); blink(); return;
  }
  // ★ 점수 슬라이더 — 누르면 잡고, 밀면 따라오고, 떼면 그 값으로 정해진다
  //   ⚠️ 사용자 요청 #13 (2026-08-16): '직접조준 후 당점수정이 않되요.'
  //      슬라이더가 다이 아래를 가로로 다 덮는데, 당점 시계·보정 뭉치가 그 위에
  //      겹쳐 앉는 배치가 있다 (3.jpg). 그러면 당점을 누르려 해도 슬라이더가 먼저
  //      가로채 값만 바뀌고 당점판이 안 열렸다.
  //      → 그 뭉치 안이면 슬라이더를 건너뛴다. 당점이 먼저다.
  if (VER_HIT && px >= VER_HIT.x - VER_HIT.h*0.2 && px <= VER_HIT.x + VER_HIT.w + VER_HIT.h*0.2 &&
      py >= VER_HIT.y && py <= VER_HIT.y + VER_HIT.h){
    let box = null;
    try { box = clusterBox(tipCenter()); } catch(e){ box = null; }
    const inCluster = box && px >= box[0] && px <= box[2] && py >= box[1] && py <= box[3];
    if (!inCluster){
      S.verDrag = {v: verValueAt(px)};
      blink(); return;
    }
  }
  if (S.routeList){
    // ★ 내보내기는 여기서 바로 처리한다 (사용자 2026-08-14)
    if (EXPORT_HIT && px >= EXPORT_HIT.x && px <= EXPORT_HIT.x + EXPORT_HIT.w &&
        py >= EXPORT_HIT.y && py <= EXPORT_HIT.y + EXPORT_HIT.h){
      verSync();                                   // 못 보낸 것을 다시 올린다
      blink(); return;
    }
    // ★ 누르는 순간에 고르지 않는다 — **손을 뗄 때** 탭인지 스와이프인지 가른다.
    //   (누르자마자 골라 버리면 밀 수가 없다)
    S.listDrag = {x:px, y:py, dx:0};
    return;
  }
  // ★★ 추천만 **뗄 때** 판단한다 — 짧게는 다음 경로, 길게는 목록 (사용자 2026-08-14 ③).
  //   '추천 버튼을 길게 누르면 목록.' 윈도우 휴대폰연동에서는 왼쪽 버튼을 누른 채
  //   0.5초 가만히 있다가 떼면 된다.
  {
    const b = BTN.find(q => q.lb === 'suggest');
    if (b && px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h){
      S.sugDown = {t: nowMs(), x: px, y: py};
      blink(); return;
    }
  }
  if (tapButton(px,py)) return;
  if (S.place){
    const [x,y] = toMm(px,py);
    if (x >= 0 && x <= T.width && y >= 0 && y <= T.height){
      S.balls[roleOf(S.place)] = {p: separate(roleOf(S.place), [x,y]), color:S.place};
      S.place = null;                          // 궤적은 그대로 둔다 (따라온다)
      blink();
    }
    return;
  }
  // ★ 판독창을 탭하면 시스템이 돈다 — 파이브앤하프 ↔ 2뱅크 곱셈 (사용자 지시 2026-08-11).
  //   버튼을 늘리지 않으려고 여기 붙였다. 바뀌는 것이 바로 그 창이라 눈에 띈다.
  //   ⚠️ 폰에서 손가락 접촉은 40~50px 다. 판독창이 얇으므로 위아래로 넉넉히 잡는다.
  const rm = READOUT ? Math.max(10, READOUT.h * 0.35) : 0;

      px >= READOUT.x - rm && px <= READOUT.x + READOUT.w + rm &&
      py >= READOUT.y - rm && py <= READOUT.y + READOUT.h + rm;
  // ★ 카메라 모드에서 상황판을 누르면 랜덤 배치 (사용자 2026-08-14)
  if (inRO && previewOn()){
    stopCam(); TEST.img = null;           // 미리보기를 끄고 다이를 보여준다
    randomLayout(); blink(); return;

  if (inRO && !previewOn()){
    S.sysMode = (S.sysMode + 1) % 6;   // 자동 → 파앤하 → 2뱅크 → 횡단샷 → 리버스 → 옆돌리기 → 자동
    if (S.sysMode === 3) aimForCross();   // 횡단샷을 고르면 그 두께·팁으로 조준선을 잡는다
    return;
  }
  const gb = ballAt(px,py);
  if (gb){ S.drag = gb; blink(); return; }
  // 작은 시계판을 탭하면 크게 띄운다.
  // ⚠️ 탭 영역을 그림 크기(clockR)로 두면 못 누른다 — 폰에서 반경이 21 CSS px 밖에
  //    안 되는데 손가락 접촉은 40~50 px 다 (사용자: 'v90 안되는데요'). 넉넉히 잡는다.
  // ⚠️ 공보다 뒤에 둔다. 당점 원이 공 위에 겹쳤을 때 공을 못 잡으면 안 된다.
  if (!previewOn()){
    // 시뮬레이션 공을 먼저 본다 (당점 공보다 오른쪽에 붙어 있다)
    const [sx,sy] = simCenter(), CRr = clockR();
    if (Math.hypot(px-sx, py-sy) <= CRr*1.25){ S.anim = performance.now(); S.sim = null; return; }
    const [cx,cy] = tipCenter();
    if (Math.hypot(px-cx, py-cy) <= CRr*1.6){ S.tipPanel = true; return; }
  }
  const f = frameAt(px,py);
  if (f){ S.aim = S.lastAim = f; S.aiming = true; }
}
function move(px,py){
  if (S.tipPanel) return;
  if (S.verDrag){ S.verDrag.v = verValueAt(px); blink(); return; }   // 점수 슬라이더
  if (S.listDrag){ S.listDrag.dx = px - S.listDrag.x; return; }   // 목록에서 미는 중
  if (S.pal){                                    // 색 버튼에서 끌어오는 중
    if (Math.hypot(px - S.pal.x, py - S.pal.y) > BW * 0.25) S.pal.moved = true;
    S.pal.x = px; S.pal.y = py;
    return;
  }
  if (S.drag){
    const [x,y] = toMm(px,py);
    S.balls[S.drag].p = separate(S.drag,
      [Math.min(Math.max(x,0),T.width), Math.min(Math.max(y,0),T.height)]);
    blink();
  } else if (S.aiming){
    // ★★ 사용자 2026-08-12 —
    //   '탭 이동 중 3쿠션이 완성이 되면 **바로 블링크**. 이때는 탭을 누르고 있는 상태.
    //    블링크 중 손을 떼면 확정. 블링크 중에는 탭을 움직여도 무시.
    //    블링크가 3초 후 꺼진 다음부터 다시 탭 이동 허용.'
    if (blinking()) return;                        // 잠김 — 움직여도 무시한다
    // ★★★ 손가락을 **천천히** 움직이면 조준이 곱게 따라온다 (사용자 2026-08-17:
    //   '직접지정시 너무 휙 경로가 지나가서 중간에 세울 수가 없어요').
    //   3쿠션은 1쿠션이 조금만 움직여도 끝이 크게 흔들린다. 손가락을 그대로 따라가면
    //   원하는 자리에 세울 수가 없다.
    //   → 각도로 따라가되, **한 번에 움직인 양이 작으면 그 몫을 줄여** 준다.
    //     크게 휘두르면 1:1 로 따라오고(멀리 옮길 때), 살살 밀면 1/4 만 움직인다.
    const f = frameAt(px,py);
    if (f){
      const cue = S.balls.cue;
      const aNow = (cue && S.aim)
        ? Math.atan2(S.aim[1]-cue.p[1], S.aim[0]-cue.p[0]) : null;
      const aFin = cue ? Math.atan2(f[1]-cue.p[1], f[0]-cue.p[0]) : null;
      if (aNow === null || aFin === null){ S.aim = S.lastAim = f; }
      else {
        let d = ((aFin - aNow + Math.PI*3) % (Math.PI*2)) - Math.PI;   // −π..π
        const deg = Math.abs(d) * 180/Math.PI;
        const gain = deg < AIM_FINE_DEG ? AIM_FINE_GAIN : 1;
        const a2 = aNow + d*gain;
        const len = Math.hypot(S.aim[0]-cue.p[0], S.aim[1]-cue.p[1]) || 2000;
        const q = frameAt(...toPx(cue.p[0] + Math.cos(a2)*len,
                                 cue.p[1] + Math.sin(a2)*len));
        S.aim = S.lastAim = q || [cue.p[0] + Math.cos(a2)*len, cue.p[1] + Math.sin(a2)*len];
      }
    }
    // 방금 붙었던 각에서 충분히 벗어나야 다시 붙는다.
    // (안 그러면 깜빡임이 끝나자마자 같은 자리에 도로 붙어 영영 못 빠져나온다)
    if (S.snapA !== null){
      const cue = S.balls.cue;
      if (!cue || !S.aim) return;
      const a0 = Math.atan2(S.aim[1]-cue.p[1], S.aim[0]-cue.p[0]);
      const df = Math.abs(((S.snapA - a0 + Math.PI*3) % (Math.PI*2)) - Math.PI);
      if (df < MAGNET_DEG * Math.PI/180) return;   // 아직 그 경로 근처다
      S.snapA = null;                              // 벗어났다 — 다시 붙을 수 있다
    }
    snapAim();                                     // 닿는 순간 바로 붙고 깜빡인다
  }
}
const LONG_MS = 450;                 // 이만큼 누르고 있으면 '길게'

function up(px, py){
  // ★ 점수 슬라이더 — 떼는 순간 저장한다 (탭도 여기로 온다: 누르고 그 자리에서 뗌)
  if (S.verDrag){
    const v = S.verDrag.v; S.verDrag = null;
    const r0 = curRoute();

    blink(); return;
  }
  if (S.sugDown){
    const d = S.sugDown; S.sugDown = null;
    const held = nowMs() - d.t;
    const moved = (px === undefined) ? 0 : Math.hypot(px - d.x, py - d.y);
    if (moved <= LONG_MOVE){
      findRoutes();
      const k = placeKey();
      const long = held >= LONG_MS;
      if (long || S.listShown !== k || S.lapEnd){
        // 길게 · 배치가 바뀌었을 때 · 한 바퀴를 돈 다음 — 목록을 보여준다
        S.listShown = k; S.lapEnd = false;

  }

  // ★ 요청 목록 — 밀면 쪽 넘김, 누르면 그 배치를 되살린다
  if (S.listDrag && S.listDrag.note){
    const q0 = S.listDrag; S.listDrag = null;
    if (Math.abs(q0.dx) > L.cloth.w*0.08){
      S.notePage = Math.max(0, Math.min(NOTE_PAGES-1,
                    (S.notePage|0) + (q0.dx < 0 ? 1 : -1)));
      return;
    }
    for (const q of NOTE_TABS){          // ★ 위 두 칸을 먼저 본다
      if (q0.x < q.x || q0.x > q.x+q.w || q0.y < q.y || q0.y > q.y+q.h) continue;
      NOTE.tab = q.k; S.notePage = 0; return;
    }
    const rows = noteListRows();
    for (const q of NOTE_CELLS){
      if (q0.x < q.x || q0.x > q.x+q.w || q0.y < q.y || q0.y > q.y+q.h) continue;
      if (rows[q.i]) noteRestore(rows[q.i]);
      else S.noteList = false;
      return;
    }
    S.noteList = false; return;                     // 바깥을 누르면 닫는다
  }
  if (S.listDrag){
    const q0 = S.listDrag; S.listDrag = null;
    if (Math.abs(q0.dx) > L.cloth.w*0.08){          // 화면폭의 8% 넘게 밀면 스와이프
      S.routePage = Math.max(0, Math.min(ROUTE_PAGES-1,

      return;

      if (q0.x < q.x || q0.x > q.x+q.w || q0.y < q.y || q0.y > q.y+q.h) continue;
      if (q.i === ROUTE_SHOW_CELLS-1){ S.routeIx = -1; S.routeList = false; return; }
      if (!list[q.i]) return;
      S.routeIx = q.i; pickRoute(list[q.i]); S.routeList = false; return;
    }

  }
  // 끌어온 자리가 다이 안이면 거기 놓는다. 움직이지 않았으면 탭으로 본다.
  // ⚠️ 끌고 가는 동안은 아직 안 놓인 상태라 다른 공 위를 지나가도 상관없다.

        S.place = null;

function fold(o,p){ return [o.fx ? T.width-p[0] : p[0], o.fy ? T.height-p[1] : p[1]]; }

//   장축   32 − (수구값  + 목적구값)  = 1쿠션값            한 칸당 10, 코너 0
//   ★ 당점은 **항상 중단 3팁** — 고를 것이 없다
// ⚠️ 어느 코너를 0 으로 보느냐는 배치가 정한다. 여기서는 **수구에서 가까운 코너**를
//    0 으로 잡는다 (책 그림이 늘 수구 쪽 코너를 0 으로 둔다).
function reverseNums(){
  const cue = S.balls.cue, o2 = S.balls.obj2 || S.balls.obj1;
  if (!cue || !o2) return null;
  const near = (v, span) => Math.min(v, span - v);       // 가까운 코너까지 거리
  // 단축 출발인가 장축 출발인가 — 수구가 붙어 있는 쪽으로 본다
  const dx = near(cue.p[0], T.width), dy = near(cue.p[1], T.height);

// ★ 기울기의 정의 (책 110쪽) —
//   '두 공을 잇는 선을 **상·하 장축까지 늘렸을 때 두 교점 사이의 거리**'
//   단위는 **포인트(다이아 한 칸)**. 장쿠션은 8칸이다.
// ⚠️ 진로마다 재는 법이 조금씩 다르다 —

  //      또 멀리 굴러가는 길이 추천에 올라왔다 (사용자 1~5.jpg: '공이 그렇게
  //      움직이지 않습니다'). 그리기(drawPath)는 이미 이 표를 쓰고 있었다.
  let budget = afterCushions(c1);

  //   ⚠️⚠️ 범인 하나가 여기였다. speed.json 표가 '충돌 전 3쿠션 → 충돌 후 0쿠션'
  //      이라 budget 이 0 이 되고 그 자리에서 return null 했다.
  //      그런데 쓰리뱅크는 **빈쿠션 3개 → 1적구 → 그대로 2적구** 다.
  //      쿠션을 더 안 써도 득점이다 (c1+c2 = 3+0 = 3).
  //   → budget 이 0 이면 **쿠션 없이 직선으로** 2적구에 닿는지만 본다.

  let seq2, cut2;
  if (budget <= 0){
    const nx0 = nextRail(P, af.dir, T.width, T.height);
    if (!nx0) return null;
    seq2 = [];
    cut2 = cutAtBall([P, nx0[1]], cut1.obj);
  } else {
    seq2 = roll(P, af.dir, Math.min(budget, SWEEP_C_NOW - c1), k, E);
    cut2 = cutAtBall([P, ...seq2.map(h => h.p)], cut1.obj);
  }
  if (!cut2.hit) return null;                       // 2적구를 못 맞힌다

  if (c2 > budget) return null;                     // 표가 허락한 것보다 멀리 갔다
  if (c1 + c2 < MIN_C_NOW) return null;             // ★ 3쿠션 미달 — 득점이 아니다
  // ★★ 사용자 승인 2026-08-13 — 훑기에도 **남은 힘**을 넣는다.
  //   1차는 힘을 모른 채 굴려 길을 잡고, 그 길로 세기를 구한 뒤 **다시 굴린다.**
  //   그래야 추천이 찾은 길과 그려지는 길이 뒤쪽 쿠션에서 안 어긋난다.
  {
    const share0 = Math.max(0.10, Math.min(0.95, af.thick));
    const keep0  = Math.sqrt(Math.max(0.04, 1 - share0*share0));
    const V0 = needV0exact([...cut1.pts, ...cut2.pts.slice(1)], keep0);
    const s1 = roll(cue.p, dir, SWEEP_C_NOW, k, E, V0);
    const q1 = cutAtBall([cue.p, ...s1.map(h => h.p)]);
    if (!q1.hit) return null;
    const d1 = q1.pts.length - 2;
    const P2 = q1.pts[q1.pts.length-1];
    const a2 = afterHit(q1.from, P2, q1.obj);
    if (!a2) return null;
    const b2 = afterCushions(d1);
    let v2 = V0;                                    // 충돌 지점까지 굴러오며 잃는다
    for (let i = 0; i < q1.pts.length-1; i++){
      const L = Math.hypot(q1.pts[i+1][0]-q1.pts[i][0], q1.pts[i+1][1]-q1.pts[i][1]);
      const A0 = DRAG_A0*DRAG_TABLE, KV = DRAG_KV/DRAG_TABLE;
      const u = (A0 + v2*v2/KV) * Math.exp(-2*L/KV) - A0;
      v2 = u > 0 ? Math.sqrt(u*KV) : 0;
      if (i < q1.pts.length-2) v2 *= CUSHION_KEEP;
    }
    v2 *= Math.sqrt(Math.max(0.04, 1 - Math.min(0.95, a2.thick)**2));   // 두께만큼 또 잃는다
    let s2, q2;
    if (b2 <= 0){
      const nx0 = nextRail(P2, a2.dir, T.width, T.height);
      if (!nx0) return null;
      s2 = []; q2 = cutAtBall([P2, nx0[1]], q1.obj);
    } else {
      s2 = roll(P2, a2.dir, Math.min(b2, SWEEP_C_NOW - d1), k, E, v2);
      q2 = cutAtBall([P2, ...s2.map(h => h.p)], q1.obj);
    }
    // ★ 2차가 정답이다 — 1차와 다르다고 **버리지 않고 다시 센다.**
    //   버리기만 했더니 역각 눈금(PT_FEEL)을 맞춘 뒤 찾는 길이 38→25 로 줄었다.
    //   1차는 힘을 모른 채 굴린 임시 경로다. 조건 검사도 2차 값으로 다시 한다.
    if (!q2.hit) return null;                       // 2적구를 못 맞힌다
    const d2 = q2.pts.length - 2;
    if (d2 > b2) return null;                       // 표가 허락한 것보다 멀리 갔다
    if (d1 + d2 < MIN_C_NOW) return null;           // 3쿠션 미달 — 득점이 아니다
    seq = s1; cut1 = q1; af = a2; seq2 = s2; cut2 = q2;
    c1 = d1; c2 = d2; budget = b2;
  }
  const rails = seq.slice(0, c1).map(h => h.rail)
           .concat(seq2.slice(0, c2).map(h => h.rail));
  // ⚠️ 같은 쿠션이 연달아 나오면 쿠션을 **스치며 미끄러진** 것이지 경로가 아니다.
  //    (파이썬 검증에서 'bottom-bottom-left' 같은 것이 잔뜩 잡혔다.)
  for (let i = 1; i < rails.length; i++) if (rails[i] === rails[i-1]) return null;
